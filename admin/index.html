  const resEl = document.getElementById('fmv-result');
  const key = _fmvKeyOf(it.title, it.issue);
  const _cat = _fmvCategory(it);
  try {
    if (resEl) { resEl.style.color = '#aaa'; resEl.textContent = 'Clearing…'; }
    await api('/api/set_fmv', { method: 'POST', body: { category: _cat, type: it.type === 'card' ? 'card' : 'comic', key, breaks: null } });
    _fmvBounds = []; it.fmvManualCurve = null; renderFmvEditor(it);
    const r2 = document.getElementById('fmv-result'); if (r2) { r2.style.color = '#5c5'; r2.textContent = 'Cleared manual FMV for ' + key + '.'; }
  } catch (e) { if (resEl) { resEl.style.color = '#e85050'; resEl.textContent = 'Clear failed: ' + (e.message || e); } }
}
function renderDefectList() {
  const el = document.getElementById('defect-list');
  if (!el) return;
  const defects = window._adminDefects || [];
  if (defects.length === 0) {
    el.innerHTML = '<div style="color:#666;font-size:12px;padding:8px;">No defects recorded.</div>';
    return;
  }
  const defectRow = (d, i) => {
    const sev = d.severity || '';
    const sevColor = sev === 'High' ? '#e85050' : sev === 'Med' ? '#e8a040' : sev === 'Low' ? '#888' : '#666';
    const parts = [d.location, d.measurement].filter(Boolean).join(', ');
    const cb = d.colorBreaking ? ' <span style="color:#e85050;font-size:9px;">CB</span>' : '';
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:${i % 2 === 0 ? '#111' : '#161616'};border-radius:4px;margin-bottom:2px;">
      <button onclick="removeDefect(${i})" style="${_armedDefect === i ? 'padding:0 6px;height:22px;background:#e85050;color:#fff;border:1px solid #e85050;border-radius:4px;font-size:10px;font-weight:700;line-height:1;cursor:pointer;flex-shrink:0' : 'width:22px;height:22px;background:#3a1a1a;color:#e85050;border:1px solid #5a2a2a;border-radius:4px;font-size:14px;line-height:1;cursor:pointer;flex-shrink:0'}">${_armedDefect === i ? 'tap to remove' : '×'}</button>
      <span style="flex:1;font-size:11px;color:#ddd;"><strong>${escapeHtml(d.type || '?')}</strong>${parts ? ' — ' + escapeHtml(parts) : ''}${cb}</span>
      <span style="font-size:10px;font-weight:700;color:${sevColor};letter-spacing:0.5px;flex-shrink:0">${sev.toUpperCase()}</span>
    </div>`;
  };
  // S20: group defects by section (Front/Back/Spine/Interior) as the app does,
  // keeping each defect's ORIGINAL index so removeDefect stays correct.
  const SECTIONS = ['Front', 'Back', 'Spine', 'Interior'];
  const byCat = {};
  defects.forEach((d, i) => {
    const cat = SECTIONS.includes(d.category) ? d.category : 'Other';
    (byCat[cat] = byCat[cat] || []).push([d, i]);
  });
  el.innerHTML = [...SECTIONS, 'Other'].filter(c => byCat[c]).map(cat => `
    <div style="font-size:10px;font-weight:700;color:#7fd0ff;text-transform:uppercase;letter-spacing:1px;margin:8px 0 3px;">${cat} (${byCat[cat].length})</div>
    ${byCat[cat].map(([d, i]) => defectRow(d, i)).join('')}
  `).join('');
}

// Two-tap delete: first tap ARMS the row (turns it red, "tap to remove"), a
// second tap within 2.5s removes it. Prevents accidental deletes while scrolling.
let _armedDefect = -1;
function removeDefect(idx) {
  if (_armedDefect === idx) {           // second tap = confirm
    _armedDefect = -1;
    window._adminDefects.splice(idx, 1);
    renderDefectList();
    return;
  }
  _armedDefect = idx;                    // first tap = arm
  renderDefectList();
  setTimeout(() => { if (_armedDefect === idx) { _armedDefect = -1; renderDefectList(); } }, 2500);
}

// Admin delete of a junk/abuse entry, gated by a confirm dialog.
async function deleteItemConfirm() {
  const it = window._adminItem; if (!it) return;
  const label = (it.title || 'this entry') + (it.issue ? ' #' + it.issue : '');
  if (!confirm(`Permanently delete "${label}" from Firestore?\n\nThis removes the item record and cannot be undone.`)) return;
  const el = document.getElementById('delete-result');
  if (el) el.textContent = 'Deleting…';
  try {
    await api(`/api/item?uid=${encodeURIComponent(it.uid)}&id=${encodeURIComponent(it.id)}`, { method: 'DELETE' });
    if (state.tab !== 'users') state.tab = 'items';
    renderDashboard();
  } catch (e) {
    if (el) { el.style.color = '#e85050'; el.textContent = 'Delete failed: ' + (e.message || e); }
  }
}

function addDefectFromForm() {
  const type = document.getElementById('def-type')?.value?.trim();
  const location = document.getElementById('def-location')?.value?.trim();
  const severity = document.getElementById('def-severity')?.value;
  const measurement = document.getElementById('def-measurement')?.value?.trim();
  const colorBreaking = document.getElementById('def-cb')?.checked;
  if (!type) { alert('Type is required'); return; }
  const _lc = (location || '').toLowerCase();
  const category = _lc.includes('spine') ? 'Spine'
    : (_lc.includes('interior') || _lc.includes('centerfold') || _lc.includes('staple')) ? 'Interior'
    : _lc.includes('back') ? 'Back'
    : 'Front';
  window._adminDefects.push({
    type, location: location || '', severity: severity || 'Low',
    measurement: measurement || '', colorBreaking: !!colorBreaking,
    category
  });
  renderDefectList();
  // Clear form
  document.getElementById('def-type').value = '';
  document.getElementById('def-location').value = '';
  document.getElementById('def-severity').value = 'Low';
  document.getElementById('def-measurement').value = '';
  document.getElementById('def-cb').checked = false;
}

async function saveIdent() {
  const it = window._adminItem;
  if (!it) { alert('No item loaded'); return; }
  const titleEl = document.getElementById('ident-title');
  const issueEl = document.getElementById('ident-issue');
  const resEl = document.getElementById('ident-result');
  const title = titleEl ? titleEl.value : undefined;
  const issue = issueEl ? issueEl.value : undefined;
  if (resEl) { resEl.style.color = '#9aa'; resEl.textContent = 'Saving\u2026'; }
  try {
    const resp = await api('/api/set_ident', { method: 'POST', body: { userId: it.uid, itemId: it.id, title: title, issue: issue } });
    if (resEl) { resEl.style.color = '#6a6'; resEl.textContent = resp.message || 'Saved.'; }
    setTimeout(() => showItem(it.uid, it.id, 'items'), 1200);
  } catch (e) {
    if (resEl) { resEl.style.color = '#e55'; resEl.textContent = 'Save failed: ' + (e.message || e); }
  }
}

async function rescoreItem() {
  const it = window._adminItem;
  if (!it) { alert('No item loaded'); return; }
  const resultEl = document.getElementById('rescore-result');
  if (resultEl) resultEl.textContent = 'Re-scoring…';
  try {
    const resp = await api('/api/rescore', {
      method: 'POST',
      body: {
        userId: it.uid,
        itemId: it.id,
        defects: window._adminDefects,
        pageQuality: it.pageQuality || 'White'
      }
    });
    if (resultEl) {
      resultEl.style.color = '#6a6';
      resultEl.textContent = resp.message || 'Re-scored successfully.';
    }
    // Refresh the item view
    setTimeout(() => showItem(it.uid, it.id, 'items'), 1500);
  } catch (e) {
    if (resultEl) {
      resultEl.style.color = '#e55';
      resultEl.textContent = 'Re-score failed: ' + e.message;
    }
  }
}

// ── Admin item-state tap-cycle ──────────────────────────────────────────
// Cycle Owned → Sold → Watching → Print (tap to pick), then a separate
// Confirm tap commits — mirrors the two-tap "arm" pattern used for defect
// deletes so a book's state can't be changed by a single accidental tap.
// Primary use: recover a book stranded in Print (invisible to the user's app)
// by setting it back to Owned.
const _STATE_ORDER = ['Owned', 'Sold', 'Watching', 'Print'];
let _stateCandidate = null;
let _stateCandidateItemId = null;
let _stateResetTimer = null;
function _resetStateCycle() {
  _stateCandidate = null;
  const it = window._adminItem;
  const c = document.getElementById('state-candidate');
  const cb = document.getElementById('state-confirm-btn');
  if (c && it) c.textContent = it.ownership || 'Owned';
  if (cb) cb.style.display = 'none';
}
function cycleState() {
  const it = window._adminItem; if (!it) return;
  if (_stateCandidateItemId !== it.id) { _stateCandidate = null; _stateCandidateItemId = it.id; }
  const cur = _STATE_ORDER.includes(it.ownership) ? it.ownership : 'Owned';
  const base = _stateCandidate || cur;
  const next = _STATE_ORDER[(_STATE_ORDER.indexOf(base) + 1) % _STATE_ORDER.length];
  _stateCandidate = next;
  const c = document.getElementById('state-candidate'); if (c) c.textContent = next;
  const cb = document.getElementById('state-confirm-btn');
  const lbl = document.getElementById('state-confirm-label');
  if (cb) cb.style.display = (next !== cur) ? '' : 'none';
  if (lbl) lbl.textContent = next;
  clearTimeout(_stateResetTimer);
  _stateResetTimer = setTimeout(_resetStateCycle, 5000);
}
async function confirmState() {
  const it = window._adminItem; if (!it || !_stateCandidate) return;
  clearTimeout(_stateResetTimer);
  const target = _stateCandidate;
  const el = document.getElementById('state-result');
  if (el) { el.style.color = '#9aa'; el.textContent = 'Setting…'; }
  try {
    const resp = await api('/api/set_state', { method: 'POST', body: { userId: it.uid, itemId: it.id, ownership: target } });
    if (el) { el.style.color = '#6a6'; el.textContent = resp.message || ('State set to ' + target); }
    _stateCandidate = null;
    setTimeout(() => showItem(it.uid, it.id, state.tab || 'items'), 1200);
  } catch (e) {
    if (el) { el.style.color = '#e55'; el.textContent = 'Failed: ' + (e.message || e); }
  }
}

// ── Utility ────────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}
function escapeAttr(s) {
  return escapeHtml(s);
}
</script>
<div id="admin-lightbox">
  <img id="admin-lb-img" src="" alt="">
  <div class="alb-navrow">
    <button class="alb-nav" id="adminlb-prev" onclick="_albStep(event,-1)" aria-label="Previous">‹</button>
    <button class="alb-nav" id="adminlb-next" onclick="_albStep(event,1)" aria-label="Next">›</button>
  </div>
  <div id="admin-lb-defects"></div>
  <div class="lb-btns">
    <button class="lb-btn" onclick="document.getElementById('admin-lightbox').classList.remove('show')">Exit</button>
    <button class="lb-btn" onclick="saveAdminLightboxImage()">Save Image</button>
  </div>
</div>
<script>
let _albList = [], _albIdx = 0;
function _albArrows() {
  const show = _albList.length > 1;
  const p = document.getElementById('adminlb-prev'), n = document.getElementById('adminlb-next');
  if (p) p.style.display = show ? 'flex' : 'none';
  if (n) n.style.display = show ? 'flex' : 'none';
}
function _albStep(e, dir) {
  if (e) e.stopPropagation();
  if (!_albList.length) return;
  const n = _albList.length;
  _albIdx = (_albIdx + dir + n) % n;
  document.getElementById('admin-lb-img').src = _albList[_albIdx];
  _albRenderDefects();
}
// ── S21: admin per-image defect box (MAIN images only, comic + card) ──────────
const _ALB_COMIC_CAT = ["Front", "Back", "Interior", "Spine"];
const _ALB_CARD_HEAD = ["Front defects", "Back defects", "Top defects", "Bottom defects"];
function _albSevColor(x) { const u = String(x || "").toUpperCase(); return u === "HIGH" ? "#e0555f" : (u === "MED" || u === "MEDIUM") ? "#e0a020" : "#8fbf5a"; }
function _albRow(text, sev) {
  const chip = sev ? `<span class="lbd-sev" style="color:${_albSevColor(sev)}">${String(sev).toUpperCase() === "MEDIUM" ? "MED" : String(sev).toUpperCase()}</span>` : "";
  return `<div class="lbd-row"><span>${escapeHtml(String(text))}</span>${chip}</div>`;
}
function _albBox(head, rowsHTML) { return `<div class="lbd-head">${escapeHtml(head)}</div>${rowsHTML || '<div class="lbd-none">No defects noted for this view.</div>'}`; }
function _albParseSev(str) {
  let s = String(str == null ? "" : str).trim();
  if (!s) return null;
  let sev = null;
  const m = s.match(/[\s,;.–-]*\b(HIGH|MED|MEDIUM|LOW)\b\.?$/i);
  if (m) { sev = m[1].toUpperCase(); s = s.slice(0, m.index).trim(); }
  s = s.replace(/[.\s]+$/, "");
  return s ? { t: s, sev: sev } : null;
}
function _albComicDefectsHTML(it, idx) {
  const cat = _ALB_COMIC_CAT[idx];
  if (!cat) return "";
  const list = Array.isArray(it.defects) ? it.defects.filter(d => String(d.category || "") === cat) : [];
  const rows = list.map(d => {
    let t = d.type || "Defect";
    if (d.location && d.location !== "N/A") t += " — " + d.location;
    if (d.colorBreaking) t += " (color-breaking)";
    return _albRow(t, d.severity);
  }).join("");
  return _albBox(cat + " defects", rows);
}
function _albCardDefectsHTML(it, idx) {
  const cd = it.cardRobograde || {};
  const df = it.cardDefects || {};
  const rows = [];
  const CH = { frontTopLeft: "top-left", frontTopRight: "top-right", frontBottomLeft: "bottom-left", frontBottomRight: "bottom-right", backTopLeft: "top-left", backTopRight: "top-right", backBottomLeft: "bottom-left", backBottomRight: "bottom-right" };
  const CS = { "SLIGHT FRAY": "LOW", "MINOR BLUNT": "LOW", "SOFT": "LOW", "HEAVY BLUNT": "MED", "CHIPPED": "MED", "DESTROYED": "HIGH" };
  const ES = { "LIGHT WEAR": "LOW", "NOTCHING": "MED", "CHIPPING": "MED", "ROUGH": "MED", "TEAR": "HIGH" };
  const pc = (cd.corners && cd.corners.perCorner) || {};
  const edges = cd.edges || {};
  const arr = k => Array.isArray(df[k]) ? df[k] : [];
  const addCorners = keys => keys.forEach(k => { const v = String(pc[k] || "").toUpperCase().trim(); if (!v || v === "PRISTINE" || v === "SHARP") return; rows.push(_albRow("Corner " + CH[k] + " — " + (v.charAt(0) + v.slice(1).toLowerCase()), CS[v] || "MED")); });
  const addEdge = side => { const v = String(edges[side] || "").toUpperCase().trim(); if (!v || v === "CLEAN") return; rows.push(_albRow((v.charAt(0) + v.slice(1).toLowerCase()) + " — " + side + " edge", ES[v] || "MED")); };
  const addFree = () => [].concat(arr("creases"), arr("scratches"), arr("printDefects"), arr("stains"), arr("other"), arr("edgeIssues")).forEach(txt => { const p = _albParseSev(txt); if (p) rows.push(_albRow(p.t, p.sev)); });
  const centerLine = which => { const c = cd.centering || {}; const r = c[which + "Ratio"]; if (r) rows.push(_albRow("Centering " + r, null)); };
  if (idx === 0) { addCorners(["frontTopLeft", "frontTopRight", "frontBottomLeft", "frontBottomRight"]); addEdge("left"); addEdge("right"); centerLine("front"); addFree(); }
  else if (idx === 1) { addCorners(["backTopLeft", "backTopRight", "backBottomLeft", "backBottomRight"]); centerLine("back"); }
  else if (idx === 2) { addCorners(["frontTopLeft", "frontTopRight"]); addEdge("top"); }
  else if (idx === 3) { addCorners(["frontBottomLeft", "frontBottomRight"]); addEdge("bottom"); }
  else return "";
  return _albBox(_ALB_CARD_HEAD[idx] || "Defects", rows.join(""));
}
function _albRenderDefects() {
  const def = document.getElementById('admin-lb-defects');
  if (!def) return;
  const it = window._adminItem;
  let html = "";
  if (it && Array.isArray(it.images)) {
    const idx = it.images.indexOf(_albList[_albIdx]);
    if (idx >= 0 && idx <= 3) html = (it.type === 'card') ? _albCardDefectsHTML(it, idx) : _albComicDefectsHTML(it, idx);
  }
  def.innerHTML = html;
  def.style.display = html ? "block" : "none";
}
function openAdminLightbox(src) {
  const lb = document.getElementById('admin-lightbox');
  const img = document.getElementById('admin-lb-img');
  const els = Array.from(document.querySelectorAll('[onclick*="openAdminLightbox"]'));
  _albList = els.map(el => { const m = (el.getAttribute('onclick') || '').match(/openAdminLightbox\('([^']*)'\)/); return m ? m[1] : null; }).filter(Boolean);
  _albIdx = _albList.indexOf(src);
  if (_albIdx < 0) { _albList = [src]; _albIdx = 0; }
  img.src = src;
  lb.classList.add('show');
  _albArrows();
  _albRenderDefects();
  lb.onclick = function(e) { if (e.target === lb) lb.classList.remove('show'); };
  if (!window._albKeyed) {
    window._albKeyed = true;
    document.addEventListener('keydown', e => {
      if (!lb.classList.contains('show')) return;
      if (e.key === 'ArrowLeft') _albStep(null, -1);
      else if (e.key === 'ArrowRight') _albStep(null, 1);
      else if (e.key === 'Escape') lb.classList.remove('show');
    });
  }
}
// S20: one-tap save. Setting a.href to the cross-origin Firebase URL made the
// browser IGNORE the download attribute (download only works same-origin), so it
// opened the image and forced the extra "download → scroll up → save" taps. Pull
// the bytes through the same-origin proxy and save the blob directly — one tap,
// same clean flow as the app.
async function saveAdminLightboxImage() {
  const img = document.getElementById('admin-lb-img');
  if (!img || !img.src) return;
  const url = img.src;
  const name = ((window._adminItem && ((window._adminItem.title || 'robograder') + (window._adminItem.issue ? '-' + window._adminItem.issue : ''))) || 'robograder').replace(/[^a-z0-9]+/gi, '_') + '.jpg';
  try {
    const isData = /^data:/i.test(url);
    if (!isData && !state.idToken) state.idToken = await state.user.getIdToken();
    const r = isData
      ? await fetch(url)
      : await fetch('/api/download?url=' + encodeURIComponent(url), { headers: { Authorization: 'Bearer ' + state.idToken } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  } catch (e) {
    // Fallback: open the image so the user can still save it manually.
    window.open(url, '_blank');
  }
}
