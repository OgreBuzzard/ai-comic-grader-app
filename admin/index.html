<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#152e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Robograder Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Saira:wght@700&family=Saira+Extra+Condensed:wght@700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23152e10'/%3E%3Ctext x='50' y='65' text-anchor='middle' font-size='50' font-family='Helvetica' font-weight='bold' fill='%237aa838'%3ERG%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0e1a0a;
    --panel: #1a2d12;
    --panel-2: #243f1a;
    --rule: #3a5818;
    --text: #e8efe0;
    --text-dim: #9abf60;
    --accent: #7aa838;
    --accent-soft: #4a7028;
    --danger: #c75450;
    --safe-top: env(safe-area-inset-top, 0);
    --safe-bot: env(safe-area-inset-bottom, 0);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bot);
  }
  header {
    position: sticky;
    top: var(--safe-top);
    z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--rule);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  header .back {
    background: none;
    border: 1px solid var(--accent-soft);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  header .back:active { background: var(--panel-2); }
  header .sign-out {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    padding: 4px 8px;
  }
  main {
    padding: 16px;
    max-width: 800px;
    margin: 0 auto;
  }

  /* Sign-in screen */
  .signin {
    min-height: calc(100vh - 60px);
    min-height: calc(100dvh - 60px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .signin p { color: var(--text-dim); margin-bottom: 24px; }
  .signin button {
    background: var(--accent);
    color: var(--bg);
    border: none;
    padding: 14px 28px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .signin .err { color: var(--danger); margin-top: 16px; font-size: 14px; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--rule);
  }
  .tabs button {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 10px 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    -webkit-tap-highlight-color: transparent;
  }
  .tabs button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tabs button:not(.active):active { color: var(--text); }

  /* Search input */
  .search-input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--rule);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 12px;
    -webkit-appearance: none;
    appearance: none;
  }
  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus { outline: none; border-color: var(--accent); }

  /* Count line */
  .count-line {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

  /* Item-row with thumbnail */
  .item-row {
    align-items: center;
  }
  .row-thumb {
    width: 44px;
    height: 66px;   /* comic-cover proportions (~2:3), not square */
    flex-shrink: 0;
    margin-right: 12px;
    background: var(--panel-2);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .row-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .row-thumb.empty::before {
    content: '?';
    color: var(--text-dim);
    font-size: 18px;
    opacity: 0.5;
  }

  /* Loading state */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .err-banner {
    background: rgba(199, 84, 80, 0.15);
    border: 1px solid var(--danger);
    color: var(--text);
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 14px;
  }

  /* Stats cards */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  @media (min-width: 600px) {
    .stats-grid { grid-template-columns: 1fr 1fr 1fr; }
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 9px 12px;
  }
  .stat-card h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin: 0 0 4px;
    font-weight: 600;
  }
  .stat-card .total {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 3px;
    line-height: 1;
  }
  .stat-card .breakouts {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .stat-card .breakouts span strong {
    color: var(--text);
    font-weight: 600;
  }

  /* Sort controls */
  .sort-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .sort-bar button {
    background: var(--panel);
    border: 1px solid var(--rule);
    color: var(--text-dim);
    padding: 6px 10px;
    border-radius: 14px;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sort-bar button.active {
    background: var(--accent-soft);
    color: var(--text);
    border-color: var(--accent);
  }
  .sort-bar button .dir { opacity: 0.7; margin-left: 4px; }

  /* User & item list rows */
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 6px;
    margin-bottom: 6px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .row:active { background: var(--panel-2); }
  .row .main { min-width: 0; flex: 1; }
  .row .title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
  }
  .row .meta {
    text-align: right;
    margin-left: 12px;
    flex-shrink: 0;
  }
  .row .meta .big {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
  }
  .row .meta .label {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .load-more {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--rule);
    color: var(--accent);
    padding: 12px;
    border-radius: 6px;
    margin-top: 12px;
    cursor: pointer;
    font-size: 14px;
  }

  /* User detail */
  .user-detail .profile {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .user-detail .profile h2 {
    margin: 0 0 4px;
    font-size: 18px;
    color: var(--accent);
  }
  .user-detail .profile .email {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 12px;
    word-break: break-all;
  }
  .user-detail .profile .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  /* S20: the item-detail header pills weren't covered by the .user-detail rule,
     so a second row of pills clipped. Give all .pills a wrapping flex row with
     row-gap, and the pills enough line-height not to clip. */
  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .pill {
    background: var(--panel-2);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-dim);
  }
  .pill strong { color: var(--text); font-weight: 600; }

  .section-h {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin: 0 0 8px;
    font-weight: 600;
  }

  /* Item detail */
  .item-detail .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .item-detail .field-grid .label,
  .item-detail .field-grid .value {
    padding: 8px 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--rule);
  }
  .item-detail .field-grid .label {
    color: var(--text-dim);
    background: var(--panel-2);
  }
  .item-detail .field-grid .value {
    color: var(--text);
    word-break: break-word;
  }
  .item-detail .field-grid > :nth-last-child(-n+2) { border-bottom: none; }

  .item-detail .scores {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-bottom: 16px;
  }
  .score-cell {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 10px 6px;
    text-align: center;
  }
  .score-cell .num {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }
  .score-cell .lbl {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }

  .notes-block {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .notes-block h4 {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 6px;
    letter-spacing: 0.08em;
  }
  .notes-block p {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    margin: 0;
    white-space: pre-wrap;
  }

  .images-block {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .img-wrap {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    overflow: hidden;
    cursor: zoom-in;
  }
  .img-wrap .label {
    padding: 4px 8px;
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid var(--rule);
  }
  .img-wrap img {
    width: 100%;
    display: block;
    aspect-ratio: 3 / 4;
    object-fit: cover;
  }
  /* Reference Comparison: show the FULL image, no crop — the ComicVine cover
     and the assessed photo can be different aspect ratios, and cropping hides
     exactly the edge/corner damage we're trying to compare. Let height follow
     the natural image dimensions. */
  .img-wrap.adaptive img {
    aspect-ratio: auto;
    object-fit: contain;
    height: auto;
    max-height: 70vh;
  }
  .img-wrap.wide img {
    aspect-ratio: 5 / 1;
  }
  /* S20 (#43): per-type aspect ratios matching the app's capture/display so the
     admin boxes don't crop the shape (spine strip, corner macros, interior-cover
     spreads, signature strips). */
  .img-wrap.tall img   { aspect-ratio: 2 / 3;  }  /* corner macros */
  .img-wrap.spread img { aspect-ratio: 3 / 2;  }  /* interior-cover spreads */
  .img-wrap.spine img  { aspect-ratio: 16 / 5; }  /* spine strip */
  .img-wrap.sig img    { aspect-ratio: 2 / 1;  }  /* signature strips */
  /* S21: main Interior matches the app — a full-width 3/2 strip on its own row.
     Front/Back stay the 3/4 portrait pair above; Spine is the 16/5 strip below. */
  .img-wrap.imain      { grid-column: 1 / -1;  }
  .img-wrap.imain img  { aspect-ratio: 3 / 2;  }
  /* Extreme-wide strips span the full grid width so they aren't squeezed into
     a half-width column. */
  .img-wrap.wide, .img-wrap.spine, .img-wrap.spread { grid-column: 1 / -1; }
  /* S16: Admin lightbox */
  #admin-lightbox {
    display: none;
    position: fixed; inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,0.95);
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    /* S21: flow from the top with a reserved safe-area (Dynamic Island) so a tall
       defect box never pushes the image up under the island; image flexes instead. */
    padding: max(env(safe-area-inset-top, 0px), 48px) 12px max(env(safe-area-inset-bottom, 0px), 16px);
    box-sizing: border-box;
    overflow: hidden;
  }
  #admin-lightbox.show { display: flex; }
  #admin-lightbox img {
    max-width: 90%;
    flex: 1 1 auto;
    min-height: 0;
    max-height: 100%;
    object-fit: contain;
    border-radius: 4px;
  }
  #admin-lightbox .lb-btns {
    display: flex; gap: 12px;
  }
  #admin-lightbox .lb-btn {
    padding: 10px 20px;
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  #admin-lightbox .lb-btn:hover { background: #444; }
  /* S21: nav arrows sit in a row BENEATH the image (were absolute overlays). */
  #admin-lightbox .alb-nav {
    position: static; transform: none;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0,0,0,0.55); color: #fff; border: 1.5px solid #555;
    font-size: 26px; font-weight: 700; line-height: 1; padding: 0 0 3px;
    cursor: pointer; display: none; align-items: center; justify-content: center;
    z-index: 10000;
  }
  #admin-lightbox .alb-navrow { display: flex; gap: 26px; justify-content: center; align-items: center; flex-shrink: 0; }
  #admin-lb-defects {
    width: 90%; max-width: 560px; max-height: 22vh; overflow-y: auto; flex-shrink: 0;
    background: rgba(20,20,22,0.92); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; color: #e8e6e2; font-size: 12px; line-height: 1.45;
    padding: 10px 12px; text-align: left; display: none;
  }
  #admin-lb-defects .lbd-head { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: #7aa838; text-transform: uppercase; margin-bottom: 6px; }
  #admin-lb-defects .lbd-row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-top: 1px solid rgba(255,255,255,0.06); }
  #admin-lb-defects .lbd-row:first-of-type { border-top: none; }
  #admin-lb-defects .lbd-sev { font-weight: 800; flex-shrink: 0; letter-spacing: 0.5px; }
  #admin-lb-defects .lbd-none { color: #8a8f86; font-style: italic; }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
    font-size: 14px;
  }
  /* S14: in-app prompt dialog. Native prompt()/confirm() are unreliable
     in mobile Safari and standalone PWA mode — they can be suppressed
     entirely or silently return null, which is why the delete-account
     email confirmation had "nowhere to type." This is a real text-input
     modal styled to the admin theme. */
  #ap-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.66);
    z-index: 9000; display: none;
    align-items: center; justify-content: center; padding: 22px;
  }
  #ap-box {
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: 12px; width: min(420px, 100%);
    padding: 20px 20px 16px;
    box-shadow: 0 14px 44px rgba(0,0,0,0.55);
  }
  #ap-msg {
    color: var(--text); font-size: 14px; line-height: 1.5;
    white-space: pre-wrap; margin-bottom: 14px;
  }
  #ap-input {
    width: 100%; box-sizing: border-box;
    background: var(--bg); border: 1px solid var(--rule);
    color: var(--text); font-size: 15px;
    padding: 11px 12px; border-radius: 8px;
    font-family: inherit; margin-bottom: 16px;
  }
  #ap-input:focus { outline: none; border-color: var(--accent); }
  #ap-actions { display: flex; gap: 10px; justify-content: flex-end; }
  #ap-actions button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 9px 18px; border-radius: 8px; cursor: pointer;
    border: 1px solid transparent;
  }
  #ap-cancel { background: var(--panel-2); color: var(--text-dim); border-color: var(--rule); }
  #ap-ok { background: var(--danger); color: #fff; }
  #ap-ok:active, #ap-cancel:active { filter: brightness(0.9); }
</style>
</head>
<body>

<!-- S14: in-app prompt dialog (replaces native prompt() for the delete
     confirmation, which mobile Safari / standalone PWA mode can suppress). -->
<div id="ap-overlay">
  <div id="ap-box" role="dialog" aria-modal="true" aria-labelledby="ap-msg">
    <div id="ap-msg"></div>
    <input id="ap-input" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false">
    <div id="ap-actions">
      <button type="button" id="ap-cancel">Cancel</button>
      <button type="button" id="ap-ok">Confirm</button>
    </div>
  </div>
</div>

<div id="root">
  <div class="loading">Loading…</div>
</div>

<!-- Firebase SDK (compat libs match the pattern used in the main app) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// ── Firebase config ────────────────────────────────────────────────────────
// Same project as the main app. These are public client keys — security is
// enforced server-side by the admin email allowlist on each API endpoint.
const firebaseConfig = {
  apiKey: "AIzaSyCDfjpnL94J0L09vJpg3I8ANu6zUzrrKxM",
  authDomain: "ai-comic-grader.firebaseapp.com",
  projectId: "ai-comic-grader",
  storageBucket: "ai-comic-grader.firebasestorage.app",
  messagingSenderId: "700471029422",
  appId: "1:700471029422:web:5f5269c70cece04bf2473f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const dbF = firebase.firestore();

// ── State ──────────────────────────────────────────────────────────────────
const state = {
  user: null,           // Firebase user object
  idToken: null,        // Cached for API calls
  view: 'dashboard',    // 'dashboard' | 'user' | 'item'
  selectedUid: null,
  selectedItemId: null,
  // S14: default tab changed from 'users' to 'items'. Matt's usual entry
  // point is "what assessments came in recently" rather than "who are my
  // users." itemsSort + itemsDir already default to date/desc which is
  // exactly the right starting sort for that intent.
  tab: 'items',         // 'users' | 'items' | 'timings'
  sort: 'createdAt',
  dir: 'desc',
  users: [],
  hasMore: false,
  itemsSort: 'date',
  itemsDir: 'desc',
  itemsList: [],
  itemsHasMore: false,
  itemsTotal: 0,
  itemSearch: '',
  // S15: Timings tab — diagnostic data from assess.js phaseTimings.
  timingsList: [],
  timingsHasMore: false,
  timingsTotal: 0,
  timingsFilter: 'all',  // 'all' | 'errors' | 'timeouts' | 'success'
  timingsVersion: '',    // empty string = all versions
  stats: null,
  // S14: when truthy, the credits pill on the user-detail view renders as an
  // inline editor instead of a static value. Reset whenever we leave the
  // user-detail view or switch to a different user.
  creditsEditOpen: false,
  error: null,
};

const root = document.getElementById('root');

// ── Dataset exclusions (S18) ───────────────────────────────────────────────
// Exclude any account (Matt's own + test accounts) from both the full JSON
// export and the summary. Persisted in localStorage so it survives reloads.

// Translate the selected export range into {since, until} Date bounds (local time).
// today/7d/30d/month are relative windows; custom reads the two date inputs.
function _rangeBounds() {
  const sel = document.getElementById('export-range');
  const mode = sel ? sel.value : 'all';
  const now = new Date();
  const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  let since = null, until = null;
  if (mode === 'today') { since = startOfDay(now); }
  else if (mode === '7d') { since = startOfDay(now); since.setDate(since.getDate() - 6); }
  else if (mode === '30d') { since = startOfDay(now); since.setDate(since.getDate() - 29); }
  else if (mode === 'month') { since = new Date(now.getFullYear(), now.getMonth(), 1); }
  else if (mode === 'custom') {
    const f = document.getElementById('export-from');
    const t = document.getElementById('export-to');
    if (f && f.value) since = new Date(f.value + 'T00:00:00');
    if (t && t.value) until = new Date(t.value + 'T23:59:59.999'); // inclusive end-of-day
  }
  return { since, until };
}
// Build the ?...excludeUid=...&since=...&until=... query shared by export + summary.
function exportQuery(extra) {
  const parts = [];
  if (extra) parts.push(extra);
  if (state.excludedUids.length) parts.push('excludeUid=' + encodeURIComponent(state.excludedUids.join(',')));
  const { since, until } = _rangeBounds();
  if (since) parts.push('since=' + encodeURIComponent(since.toISOString()));
  if (until) parts.push('until=' + encodeURIComponent(until.toISOString()));
  return parts.length ? '?' + parts.join('&') : '';
}

// ── API helper ─────────────────────────────────────────────────────────────
// S14: accepts an opts object so PATCH/POST with a JSON body works through
// the same auth + token-refresh path as GET. opts.method defaults to GET;
// opts.body is JSON-stringified automatically and Content-Type is set.
async function api(path, opts) {
  opts = opts || {};
  const method = opts.method || 'GET';
  if (!state.idToken) state.idToken = await state.user.getIdToken();
  const buildInit = (token) => {
    const init = {
      method,
      headers: { Authorization: 'Bearer ' + token }
    };
    if (opts.body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(opts.body);
    }
    return init;
  };
  let res = await fetch(path, buildInit(state.idToken));
  // Token might have expired — refresh once and retry.
  if (res.status === 401) {
    state.idToken = await state.user.getIdToken(true);
    res = await fetch(path, buildInit(state.idToken));
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// S20: the toggle used to render unchecked on every re-render (renderDashboard
// rebuilds the header via innerHTML) and on any read failure, so it displayed
// "off" while assess.js was actually caching. Hold the config in module state,
// default it to assess.js's defaults (enabled, 1h), and render FROM that state.
// S21: caching is now PER TYPE. Only Main comic (assess.js) and Card-main
// (assess_card.js) implement cache_control in code; Deep/Full/Card-Deep never
// cache, so their chips are disabled (no-ops until caching is added there).
let _cacheCfg = { ttl: '1h', types: { main: true, card: false, deep: false, full: false, cardDeep: false } };
async function _loadCacheCfg() {
  try {
    const snap = await dbF.collection('config').doc('caching').get();
    if (snap.exists) {
      const d = snap.data() || {};
      const t = d.types || null;
      const legacy = d.enabled !== false; // pre-per-type doc had a single global flag
      _cacheCfg = {
        ttl: d.ttl === '5m' ? '5m' : '1h',
        types: {
          main:     t ? !!t.main : legacy, // legacy global flag -> Main (matches assess.js)
          card:     t ? !!t.card : false,  // Card off unless explicitly set (matches assess_card.js)
          deep:     t ? !!t.deep : false,
          full:     t ? !!t.full : false,
          cardDeep: t ? !!t.cardDeep : false,
        },
      };
    } else {
      _cacheCfg = { ttl: '1h', types: { main: true, card: false, deep: false, full: false, cardDeep: false } };
    }
  } catch (e) {
    console.warn('[cache-cfg] read failed, keeping defaults:', e && e.message);
  }
  _syncCacheCfgDom();
}
const _CACHE_LIVE = { main: true, card: true, deep: false, full: false, cardDeep: false };
function _syncCacheCfgDom() {
  ['main','card','deep','full','cardDeep'].forEach(k => {
    const el = document.getElementById('ct-' + k);
    if (!el) return;
    const on = !!_cacheCfg.types[k];
    el.style.background  = on ? '#1f6feb' : '#1c1c22';
    el.style.color       = on ? '#fff' : (_CACHE_LIVE[k] ? '#9ab' : '#666');
    el.style.borderColor = on ? '#1f6feb' : '#333';
  });
  const tt = document.getElementById('cache-ttl');
  if (tt) tt.value = _cacheCfg.ttl;
}
async function _persistCacheCfg() {
  const t = _cacheCfg.types;
  try {
    await dbF.collection('config').doc('caching').set({
      enabled: !!t.main, // legacy field kept in sync with the primary (Main) lever
      ttl: _cacheCfg.ttl,
      types: { main: !!t.main, card: !!t.card, deep: !!t.deep, full: !!t.full, cardDeep: !!t.cardDeep },
    }, { merge: true });
  } catch (e) { alert('Failed to save caching config: ' + (e && e.message)); }
}
async function _toggleCacheType(key) {
  if (!_CACHE_LIVE[key]) return; // deep/full/cardDeep aren't cached in code
  _cacheCfg.types[key] = !_cacheCfg.types[key];
  _syncCacheCfgDom();
  await _persistCacheCfg();
}
async function _saveCacheCfg() {
  const tt = document.getElementById('cache-ttl');
  if (tt) _cacheCfg.ttl = tt.value;
  await _persistCacheCfg();
}
function _setupPullToRefresh() {
  let startY = 0, pulling = false, ind = null;
  const THRESH = 70;
  const atTop = () => (window.scrollY || document.documentElement.scrollTop || 0) <= 0;
  const ensureInd = () => {
    if (ind) return ind;
    ind = document.createElement('div');
    ind.style.cssText = 'position:fixed;top:0;left:0;right:0;text-align:center;font-size:12px;color:#9ab;padding:8px;transform:translateY(-44px);transition:transform .15s;z-index:9999;pointer-events:none;background:rgba(10,12,8,0.9)';
    document.body.appendChild(ind);
    return ind;
  };
  document.addEventListener('touchstart', e => {
    if (!atTop()) { pulling = false; return; }
    startY = e.touches[0].clientY; pulling = true;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!pulling) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0 && atTop()) {
      const pull = Math.min(dy, 100), el = ensureInd();
      el.style.transform = 'translateY(' + (pull - 44) + 'px)';
      el.textContent = pull > THRESH ? '\u2191 Release to refresh' : '\u2193 Pull to refresh';
    }
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!pulling) return;
    pulling = false;
    const dy = e.changedTouches[0].clientY - startY;
    if (ind) ind.style.transform = 'translateY(-44px)';
    if (dy > THRESH && atTop()) refreshDashboard();
  }, { passive: true });
}

  const card = (label, tot) => `<div style="flex:1;background:#0e0f12;border:1px solid #23252c;border-radius:8px;padding:10px 12px;min-width:0;text-align:center;">

function renderItemsTab() {

function _toggleIncome() {

// Compact grouped-bar SVG: net revenue (green) vs API spend (red) over the
// 30-day series, re-bucketed by day / week / month client-side.
function renderSpendChart(gran) {
  const el = document.getElementById('spend-chart');
  if (!el) return;
  const series = window._statSeries || [];
  let pts;
  if (gran === 'day') {
    pts = series.map(s => ({ label: s.date, rev: s.revCents, spend: s.spendCents }));
  } else {
    const size = gran === 'week' ? 7 : 30;
    pts = [];
    for (let i = 0; i < series.length; i += size) {
      const ch = series.slice(i, i + size);
      pts.push({ label: ch[0].date, rev: ch.reduce((a, b) => a + b.revCents, 0), spend: ch.reduce((a, b) => a + b.spendCents, 0) });
    }
  }
  document.querySelectorAll('#chart-gran button').forEach(b => {
    const on = b.dataset.gran === gran;
    b.style.background = on ? '#2a6a4a' : '#161821';
    b.style.color = on ? '#dfffe9' : '#9ab';
  });
  const maxV = Math.max(1, ...pts.map(p => Math.max(p.rev, p.spend)));
  const W = 100, H = 60, n = pts.length || 1, gw = W / n, bw = Math.max(0.5, gw * 0.34);
  const y = v => H - (v / maxV) * (H - 6);
  let bars = '';
  pts.forEach((p, i) => {
    const x = i * gw + gw * 0.14;
    bars += `<rect x="${x.toFixed(2)}" y="${y(p.rev).toFixed(2)}" width="${bw.toFixed(2)}" height="${(H - y(p.rev)).toFixed(2)}" fill="#4caf82"/>`;
    bars += `<rect x="${(x + bw + gw * 0.06).toFixed(2)}" y="${y(p.spend).toFixed(2)}" width="${bw.toFixed(2)}" height="${(H - y(p.spend)).toFixed(2)}" fill="#e85d5d"/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:110px;display:block;">
      <line x1="0" y1="${H - 0.3}" x2="${W}" y2="${H - 0.3}" stroke="#2a2d38" stroke-width="0.3"/>${bars}
    </svg>
    <div style="text-align:right;font-size:9px;color:#8a8d96;margin-top:2px;">peak $${(maxV / 100).toFixed(0)} · ${pts.length} ${gran === 'day' ? 'days' : gran === 'week' ? 'weeks' : 'months'}</div>`;
}

async function loadUsers(reset = false) {
  if (reset) {
    state.users = [];
    state.hasMore = false;
  }
  const offset = state.users.length;
  try {
    // S14: page size dropped from 50 to 20. 50 was hitting noticeable load
    // delay on the items endpoint especially (admin SDK reads + per-item
    // doc lookups). 20 is plenty for an at-a-glance view; Load More is
    // there for deeper digs.
    const res = await api(`/api/users?sort=${state.sort}&dir=${state.dir}&limit=20&offset=${offset}&q=${encodeURIComponent(state.userSearch || '')}`);
    state.users = state.users.concat(res.users);
    state.hasMore = res.hasMore;
    renderUsers();
  } catch (e) {
    document.getElementById('users-section').innerHTML =
      `<div class="err-banner">Users failed: ${escapeHtml(e.message)}</div>`;
  }
}

function renderUsers() {
  const sec = document.getElementById('users-section');
  if (state.users.length === 0) {
    sec.innerHTML = '<div class="empty">No users yet.</div>';
    return;
  }
  const rightLabel = ({
    displayName: u => ({ big: u.assessmentCredits, label: 'credits' }),
    assessmentCredits: u => ({ big: u.assessmentCredits, label: 'credits' }),
    itemCount: u => ({ big: u.itemCount, label: 'items' }),
    lastAssessment: u => ({
      big: u.lastAssessment ? new Date(u.lastAssessment).toLocaleDateString() : '—',
      label: 'last grade'
    }),
    createdAt: u => ({
      big: u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '—',
      label: 'joined'
    }),
    referralIssued: u => ({ big: u.referralIssued || 0, label: 'ref out (cr)' }),
    referralReceived: u => ({ big: u.referralReceived || 0, label: 'ref in (cr)' }),
  })[state.sort] || (u => ({ big: u.assessmentCredits, label: 'credits' }));
  sec.innerHTML = state.users.map(u => {
    const r = rightLabel(u);
    return `
      <div class="row" data-uid="${u.uid}">
        <div class="main">
          <div class="title">${escapeHtml(u.displayName)}</div>
          <div class="sub">${u.itemCount} item${u.itemCount === 1 ? '' : 's'} · ${escapeHtml(u.email)}${(u.referralIssued || u.referralReceived) ? ` · <span style="color:#7fd0ff">ref ${u.referralIssued||0}/${u.referralReceived||0}</span>` : ''}${u.referralBlocked ? ' · <span style="color:#e0655a;font-weight:700">⚑ ref-blocked</span>' : ''}</div>
        </div>
        <div class="meta">
          <div class="big">${escapeHtml(String(r.big))}</div>
          <div class="label">${r.label}</div>
        </div>
        <label class="excl-wrap" style="display:flex;align-items:center;gap:5px;margin-left:12px;font-size:11px;color:#9aa;white-space:nowrap" title="Exclude this account from export + summary">
          <input type="checkbox" class="excl-box" data-uid="${u.uid}" ${isExcluded(u.uid) ? 'checked' : ''}>
          excl
        </label>
      </div>
    `;
  }).join('') + (state.hasMore ? `<button class="load-more" id="load-more-btn">Load more</button>` : '');
  sec.querySelectorAll('.row').forEach(row => {
    row.onclick = () => showUser(row.dataset.uid);
  });
  sec.querySelectorAll('.excl-box').forEach(cb => {
    cb.onclick = e => e.stopPropagation();
    cb.onchange = () => toggleExclude(cb.dataset.uid);
  });
  if (state.hasMore) {
    document.getElementById('load-more-btn').onclick = () => loadUsers(false);
  }
}

function renderItemsSortBar() {
  const sorts = [
    { key: 'date', label: 'Date' },
    { key: 'title', label: 'Title' },
    { key: 'pg', label: 'PG' },
    { key: 'tier', label: 'Tier' },
    { key: 'uid', label: 'User ID' },
  ];
  const bar = document.getElementById('items-sort-bar');
  if (!bar) return;
  bar.innerHTML = sorts.map(s => `
    <button data-key="${s.key}" class="${state.itemsSort === s.key ? 'active' : ''}">
      ${s.label}${state.itemsSort === s.key ? ` <span class="dir">${state.itemsDir === 'asc' ? '↑' : '↓'}</span>` : ''}
    </button>
  `).join('');
  bar.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.key;
      if (state.itemsSort === key) {
        state.itemsDir = state.itemsDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.itemsSort = key;

async function loadItems(reset = false) {
  if (reset) {
    state.itemsList = [];
    state.itemsHasMore = false;
  }
  const offset = state.itemsList.length;
  const q = encodeURIComponent(state.itemSearch || '');
  try {
    const res = await api(`/api/items?sort=${state.itemsSort}&dir=${state.itemsDir}&limit=10&offset=${offset}&q=${q}`);
    state.itemsList = state.itemsList.concat(res.items);
    state.itemsHasMore = res.hasMore;
    state.itemsTotal = res.total;
    renderItemsList();
  } catch (e) {
    const sec = document.getElementById('items-section');
    if (sec) sec.innerHTML = `<div class="err-banner">Items failed: ${escapeHtml(e.message)}</div>`;
  }
}

  sec.innerHTML = countLine + state.itemsList.map(it => {
    const thumbSrc = it.inlineThumb || it.thumbUrl;
    return `
      <div class="row item-row" data-uid="${it.uid}" data-id="${it.id}">

function renderTimingsTab() {

function renderTimingsFilterBar() {
  const bar = document.getElementById('timings-filter-bar');
  if (!bar) return;

    ['all', 'All'],
    ['errors', 'Errors'],
    ['timeouts', 'Timeouts'],
    ['success', 'Success only']
  ];
  bar.innerHTML = filters.map(([key, label]) => {
    const active = state.timingsFilter === key ? 'active' : '';
    return `<button class="${active}" data-filter="${key}">${label}</button>`;
  }).join('') + `
    <span style="margin-left:8px;font-size:12px;color:var(--text-dim)">v</span>
    <input type="text" id="timings-version" value="${escapeAttr(state.timingsVersion || '')}" placeholder="any" style="width:42px;background:var(--panel-2);border:1px solid var(--panel-2);color:var(--text);padding:4px 6px;border-radius:4px;font-size:12px;">
  `;
  bar.querySelectorAll('button[data-filter]').forEach(btn => {
    btn.onclick = () => {
      state.timingsFilter = btn.dataset.filter;
      loadTimings(true);
      renderTimingsFilterBar();
    };
  });
  const vIn = document.getElementById('timings-version');
  if (vIn) {
    let t = null;
    vIn.oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        state.timingsVersion = vIn.value.trim();
        loadTimings(true);
      }, 400);
    };
  }
}

async function loadTimings(reset = false) {
  if (reset) {
    state.timingsList = [];
    state.timingsHasMore = false;
  }
  const offset = state.timingsList.length;
  const params = new URLSearchParams({
    limit: '20',
    offset: String(offset),
    filter: state.timingsFilter || 'all'
  });
  if (state.timingsVersion) params.set('version', state.timingsVersion);
  try {
    const res = await api(`/api/timings?${params.toString()}`);
    state.timingsList = state.timingsList.concat(res.timings || []);
    state.timingsHasMore = !!res.hasMore;
    state.timingsTotal = res.total || 0;
    renderTimingsList();
  } catch (e) {
    const sec = document.getElementById('timings-section');
    if (sec) sec.innerHTML = `<div class="err-banner">Logs failed: ${escapeHtml(e.message)}</div>`;
  }
}

function renderTimingsList() {
  const sec = document.getElementById('timings-section');
  if (!sec) return;
  if (state.timingsList.length === 0) {
    sec.innerHTML = '<div class="empty">No timing data yet for this filter.</div>';
    return;
  }

  // Aggregate stats across the visible page so Matt can eyeball averages
  // without manually reading every row.
  const totals = state.timingsList.map(t => t.totalMs || 0).filter(Boolean);
  const primaries = state.timingsList.map(t => (t.phases && t.phases.primaryCallMs) || 0).filter(Boolean);
  const refines = state.timingsList.map(t => (t.phases && t.phases.refineCallMs) || 0).filter(Boolean);
  // S15 May 28: per-assessment cost was added to timing writes (see assess.js
  // costUsd block). Aggregate across the visible page — sum is the spend,
  // mean is per-assessment cost. Errored rows write costUsd: 0 (no tokens
  // billed) so they don't skew the mean.
  const costs = state.timingsList.map(t => +t.costUsd || 0).filter(c => c > 0);
  const mean = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0) / arr.length) : 0;
  const sumCost = costs.reduce((a,b)=>a+b, 0);
  const meanCost = costs.length ? sumCost / costs.length : 0;
  const fmtCost = c => '$' + (c < 0.01 ? c.toFixed(4) : c.toFixed(c < 1 ? 3 : 2));
  const p95 = arr => {
    if (!arr.length) return 0;
    const s = [...arr].sort((a,b)=>a-b);
    return s[Math.min(s.length - 1, Math.floor(s.length * 0.95))];
  };
  const aggHtml = `
    <div class="count-line">
      <strong>${state.timingsTotal}</strong> rows · showing ${state.timingsList.length}
      &nbsp;·&nbsp; mean total <strong>${mean(totals)}ms</strong>
      &nbsp;·&nbsp; p95 total <strong>${p95(totals)}ms</strong>
      &nbsp;·&nbsp; mean primary <strong>${mean(primaries)}ms</strong>
      ${refines.length ? `&nbsp;·&nbsp; mean refine <strong>${mean(refines)}ms</strong>` : ''}
      ${costs.length ? `&nbsp;·&nbsp; mean cost <strong>${fmtCost(meanCost)}</strong> &nbsp;·&nbsp; total <strong>${fmtCost(sumCost)}</strong>` : ''}
    </div>
  `;

  const rows = state.timingsList.map(t => {
    const p = t.phases || {};
    const errored = !!t.errorMessage;
    const timedOut = t.timedOut === true;
    const tagHtml = errored
      ? `<span style="background:#5a1818;color:#ffb0b0;padding:1px 6px;border-radius:3px;font-size:11px;">${timedOut ? 'TIMEOUT' : 'ERROR'}</span>`
      : `<span style="background:var(--panel-2);color:var(--text-dim);padding:1px 6px;border-radius:3px;font-size:11px;">${(t.itemType === 'card' || (t.kind || '').indexOf('card') === 0) ? (t.kind === 'card_deep' ? 'CARD DEEP' : 'CARD') : (t.gateResult || 'COMIC')}</span>`;
    const dateStr = t.createdAt ? new Date(t.createdAt).toLocaleString() : '?';
    const totalColor = (t.totalMs || 0) > 55000 ? '#ff8080' : (t.totalMs || 0) > 40000 ? '#ffc070' : 'var(--text)';
    return `
      <div class="row timing-row" data-key="${escapeAttr(t.key)}" style="cursor:pointer;">
        <div class="main">
          <div class="title" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;">
            ${escapeHtml(t.key)} ${tagHtml}
            ${t.version ? `<span style="color:var(--text-dim);font-size:11px;margin-left:6px;">v${escapeHtml(t.version)}</span>` : ''}
          </div>
          ${(t.title || t.cardName) ? `<div style="font-size:13px;font-weight:600;color:var(--text);margin:2px 0;">${escapeHtml(t.title || t.cardName)}${t.issue ? ' #' + escapeHtml(t.issue) : ''}${t.predictedGrade ? `<span style="color:#7fd0ff;font-weight:700;margin-left:8px;">PG ${escapeHtml(t.predictedGrade)}</span>` : ''}${t.pageQuality ? `<span style="color:var(--text-dim);font-weight:400;margin-left:8px;">PQ ${escapeHtml(t.pageQuality)}</span>` : ''}</div>` : ''}
          ${t.rgScore != null ? `<div style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-dim);">RG ${escapeHtml(String(t.rgScore))}${(t.frontScore != null || t.backScore != null || t.spineScore != null || t.interiorScore != null) ? `<span style="margin-left:10px;">F ${t.frontScore ?? '—'} · B ${t.backScore ?? '—'} · Int ${t.interiorScore ?? '—'} · Sp ${t.spineScore ?? '—'}</span>` : ''}</div>` : ''}
          <div class="sub" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">
            ${dateStr}
            ${+t.costUsd > 0 ? `&nbsp;·&nbsp;<span style="color:var(--text-dim);">${fmtCost(+t.costUsd)}</span>` : ''}
            ${t.errorMessage ? `<br><span style="color:#ff8080;">${escapeHtml(String(t.errorMessage).slice(0, 200))}</span>` : ''}
          </div>
        </div>
        <div class="meta">
          <div class="big" style="color:${totalColor};">${t.totalMs ?? '—'}</div>
          <div class="label">ms total</div>
          <button class="timing-json-btn" data-key="${escapeAttr(t.key)}" style="margin-top:4px;background:var(--panel-2);color:var(--text-dim);border:1px solid var(--rule);border-radius:4px;font-size:10px;padding:2px 6px;cursor:pointer;letter-spacing:0.05em">log</button>
        </div>
      </div>
    `;
  }).join('');

  sec.innerHTML = aggHtml + rows + (state.timingsHasMore ? `<button class="load-more" id="load-more-timings-btn">Load more</button>` : '');
  sec.querySelectorAll('.timing-row').forEach(row => {
    // S20 (#33): tapping a log opens the item entry (Items tab, filtered to this
    // assessment's Grade ID). The small "log" button still opens the raw timing JSON.
    row.onclick = () => jumpToItemByGradeId(row.dataset.key);
  });
  sec.querySelectorAll('.timing-json-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const t = state.timingsList.find(x => x.key === btn.dataset.key);
      if (t) showTimingDetail(t);
    };
  });
  if (state.timingsHasMore) {
    document.getElementById('load-more-timings-btn').onclick = () => loadTimings(false);
  }
}

// S14: hard-delete a user account via the admin endpoint. The two-step
// confirmation is enforced both client-side (this function) AND
// server-side (the endpoint checks the typed email matches). Double
// confirmation prevents fat-finger deletions of the wrong account.
// S14: promise-based in-app replacement for window.prompt(). Native
// prompt() is unreliable in mobile Safari and is fully suppressed in
// standalone/PWA display mode — it can return null without ever showing
// a dialog, which is exactly why the delete-account email confirmation
// had "nowhere to type." Resolves the entered string, or null on
// cancel / overlay tap / Escape.
let _apResolver = null;
function appPrompt(message, okLabel) {
  return new Promise((resolve) => {
    _apResolver = resolve;
    const overlay = document.getElementById('ap-overlay');
    const msg = document.getElementById('ap-msg');
    const input = document.getElementById('ap-input');
    const ok = document.getElementById('ap-ok');
    if (!overlay || !msg || !input) {
      // Last-resort fallback — should not happen, but never trap the admin.
      resolve(window.prompt(message));
      return;
    }
    msg.textContent = message;
    input.value = '';
    if (ok && okLabel) ok.textContent = okLabel;
    overlay.style.display = 'flex';
    setTimeout(() => { try { input.focus(); } catch (e) {} }, 30);
    const done = (val) => {
      overlay.style.display = 'none';
      document.removeEventListener('keydown', onKey);
      const r = _apResolver; _apResolver = null;
      if (r) r(val);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') done(null);
      else if (e.key === 'Enter') done(input.value);
    };
    document.getElementById('ap-ok').onclick = () => done(input.value);
    document.getElementById('ap-cancel').onclick = () => done(null);
    overlay.onclick = (e) => { if (e.target === overlay) done(null); };
    document.addEventListener('keydown', onKey);
  });
}

async function deleteAccount(user) {
  const hasEmail = !!(user.email && user.email.trim());
  const uidSuffix = (user.uid || '').slice(-6);
  const summary = `Delete this account?\n\n` +
    `Name:   ${user.displayName || '(no name)'}\n` +
    `Email:  ${user.email || '(no email — legacy account)'}\n` +
    `UID:    ${user.uid}\n\n` +
    `This will permanently remove the Auth user, the Firestore doc, ` +
    `all items, all photos, and all registry entries.\n\n` +
    `Purchases, credit adjustments, and promo redemptions will be RETAINED.\n\n` +
    `Cannot be undone.`;
  if (!confirm(summary)) return;

  // Second confirmation: typed-back token. For accounts WITH an email, type
  // the email. For very old accounts with NO email (fields are just
  // assessmentCredits/createdAt/freeCreditsGranted/termsAccepted/
  // termsAcceptedAt/termsVersion), type the last 6 chars of the UID — the
  // only stable identifier these ghost accounts have. Server enforces the
  // same rule, so this client check is the first line, not the only line.
  let promptMsg, expected;
  if (hasEmail) {
    promptMsg = `Type the user's email to confirm deletion:\n\n${user.email}`;
    expected = user.email.trim().toLowerCase();
  } else {
    promptMsg = `This is a legacy account with no email.\n\nType the last 6 characters of its UID to confirm deletion:\n\n${user.uid}\n                                          ^^^^^^\n(type: ${uidSuffix})`;
    expected = uidSuffix.toLowerCase();
  }
  const typed = await appPrompt(promptMsg, 'Delete Account');
  if (typed == null) return;  // cancelled
  let trimmed = typed.trim().toLowerCase();
  // S14: the client's expected value is a best guess (it's derived from
  // the Firestore record's email, which can disagree with the Auth
  // record the SERVER checks — the exact cause of the reported bug). So
  // this is a soft warning, not a hard block: if it doesn't match what
  // the client expected, confirm intent but still let the server be the
  // authority. The server validates strictly and now offers a retry
  // with its exact required value, so a wrong guess here is recoverable
  // rather than a dead end.
  if (trimmed !== expected) {
    const proceed = await appPrompt(
      'That doesn\'t match what this screen expected, but the server will ' +
      'verify independently (the server is the source of truth and may ' +
      'require a different value for this account).\n\nRe-enter the ' +
      'confirmation value to send to the server, or Cancel to abort:',
      'Send to Server'
    );
    if (proceed == null) return;
    trimmed = proceed.trim().toLowerCase();
  }

  const btn = document.getElementById('delete-account-btn');

  // S14 FIX — the real delete bug. The client decided whether to ask for
  // the EMAIL or the UID-SUFFIX based on user.email from the FIRESTORE
  // list record. The server decides based on the FIREBASE AUTH record
  // (getAuth().getUser().email). For ghost accounts whose Firestore doc
  // has no email but whose Auth user DOES (e.g. paulsonier2@gmail.com),
  // the two disagree forever: client asks for the UID suffix, server
  // demands the email, mismatch every time — exactly the user's
  // screenshot. The server is the source of truth and its error message
  // states precisely what to type. So: attempt with what we have, and if
  // the server returns a confirmation mismatch, surface the server's
  // requirement and let the admin retry with the correct value instead
  // of dead-ending. confirmEmail is re-sent each attempt.
  async function attemptDelete(confirmValue) {
    if (btn) { btn.disabled = true; btn.textContent = 'Deleting…'; }
    try {
      const data = await api('/api/delete_user', {
        method: 'POST',
        body: { uid: user.uid, confirmEmail: confirmValue },
      });
      if (!data || !data.ok) throw new Error('Unexpected response');
      alert(`Account deleted.\n\n` +
            `Auth removed:       ${data.summary.authDeleted ? 'yes' : 'no'}\n` +
            `User doc removed:   ${data.summary.userDocDeleted ? 'yes' : 'no'}\n` +
            `Items removed:      ${data.summary.itemsDeleted}\n` +
            `Comics removed:     ${data.summary.comicsDeleted}\n` +
            `Meta docs removed:  ${data.summary.metaDeleted}\n` +
            `Registry removed:   ${data.summary.robogradeIdsDeleted}\n` +
            `Storage cleared:    ${data.summary.storageObjectsDeleted}`);
      // S14 FIX: the previous code called render() + loadUsers(true) +
      // set state.* directly. This codebase has NO bare render()
      // function (it uses renderDashboard / renderUserDetail / etc.) —
      // the ReferenceError "Can't find variable: render" fired AFTER the
      // account was already deleted server-side, so the delete actually
      // succeeded but the UI crashed instead of returning to the list.
      // The canonical "return to the user list" is exactly what the
      // detail view's Back button does: renderDashboard() (it resets
      // state.view/selectedUid itself and calls loadUsers via
      // renderUsersTab). Set the tab first so we land on Users.
      state.tab = 'users';
      renderDashboard();
      return true;
    } catch (e) {
      const msg = (e && e.message) || 'unknown error';
      if (btn) { btn.disabled = false; btn.textContent = 'Delete this account'; }
      // If the server told us a confirmation mismatch, it also told us
      // exactly what string it wants. Re-prompt with that, pre-filled
      // hint, and retry — rather than failing terminally on a client/
      // server rule disagreement the admin can't otherwise resolve.
      if (/confirmation mismatch|type the last 6|type "/i.test(msg)) {
        const retry = await appPrompt(
          'The server requires a specific confirmation value:\n\n' + msg +
          '\n\nEnter it exactly to proceed, or Cancel to abort.',
          'Confirm & Delete'
        );
        if (retry == null) return false;
        return attemptDelete(retry.trim().toLowerCase());
      }
      alert('Delete failed: ' + msg);
      return false;
    }
  }

  await attemptDelete(trimmed);
}

// S14: PATCH the user doc with the new credit value. On success, the
// endpoint returns the same shape as GET, so we feed it back into
// renderUserDetail directly — no extra round-trip needed. On failure,
// surface the error inline above the pills and leave the editor open so
// the admin can fix and retry.
async function saveCredits(uid) {
  const input = document.getElementById('credits-input');
  const save  = document.getElementById('credits-save');
  if (!input) return;
  const n = parseInt(input.value, 10);
  if (!Number.isFinite(n) || n < 0 || n > 10000) {
    alert('Credits must be an integer between 0 and 10000.');
    input.focus(); input.select();
    return;
  }
  // No-op short-circuit: if the value didn't change, just close the editor.
  // Without this, the server returns a 400 ("No change") that gets surfaced
  // as a "Failed to update" alert, which is wrong messaging for a no-op.
  // Server still enforces the same rule as defense-in-depth (and to prevent
  // junk audit entries from stale clients).
  const cached = state.currentUserDetail;
  if (cached && cached.user && cached.user.assessmentCredits === n) {
    state.creditsEditOpen = false;
    renderUserDetail(cached.user, cached.items, cached.publicRate);
    return;
  }
  // Disable the buttons while in-flight so a double-tap doesn't fire twice.
  if (save) { save.disabled = true; save.textContent = 'SAVING…'; }
  try {
    const { user, items, publicRate } = await api(
      `/api/user?uid=${encodeURIComponent(uid)}`,
      { method: 'PATCH', body: { assessmentCredits: n } }
    );
    state.creditsEditOpen = false;
    renderUserDetail(user, items, publicRate);
  } catch (e) {
    alert('Failed to update credits: ' + e.message);
    if (save) { save.disabled = false; save.textContent = 'SAVE'; }
  }
}

async function showItem(uid, id, fromTab) {
  if (fromTab === 'items' && state.view !== 'item') {
    state.itemsScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  }
  state.view = 'item';
  state.selectedItemId = id;
  // fromTab tells us where the user came from so "Back" goes back to the
  // right place. 'items' = all-items list; otherwise = a user's profile.
  const fromItemsList = fromTab === 'items';
  root.innerHTML = `
    <header>
      <button class="back" id="back-btn">← ${fromItemsList ? 'All Items' : 'User'}</button>
      <h1>ITEM</h1>
      <button class="sign-out" id="signout-btn">Sign out</button>
    </header>
    <main class="item-detail">
      <div class="loading">Loading item…</div>
    </main>
  `;
  document.getElementById('back-btn').onclick = () => {
    if (fromItemsList) {
      renderDashboard();
    } else {
      showUser(uid);
    }
  };
  document.getElementById('signout-btn').onclick = signOut;
  try {
    const { item } = await api(`/api/item?uid=${encodeURIComponent(uid)}&id=${encodeURIComponent(id)}`);
    renderItemDetail(item);
  } catch (e) {
    document.querySelector('main').innerHTML =
      `<div class="err-banner">Item load failed: ${escapeHtml(e.message)}</div>`;
  }
}

// Jump from the item detail view to the Items tab, pre-filtered to one user
// (by their 4-char transferCode, which the items search matches).
function jumpToUserItems(code) {
  if (!code) return;
  state.tab = 'items';
  state.itemSearch = code;
  renderDashboard();
}

// S20 (#33): from a Logs row, jump to the Items tab filtered by the assessment's
// Grade ID (the log's doc key). The items search already matches roboGradeId, so
// this surfaces the exact item entry — tap it to open the detail view.
function jumpToItemByGradeId(gradeId) {
  if (!gradeId) return;
  // S20 (#33): a Logs doc key is the assessment_timings doc id (e.g.
  // `t_<ts>_<rand>`, `deep_…`, `full_…`). The client now persists that exact key
  // onto the item it saves (assessmentTimingKeys), and the items search matches
  // it — so search by the FULL key. (Legacy logs keyed by a roboGradeId still
  // resolve too, since roboGradeId is also in the items search haystack.)
  state.tab = 'items';
  state.itemSearch = String(gradeId);
  renderDashboard();
}

const RGV2 = (function () {
  const LADDER = ["0","0+","1-","1","1+","2-","2","2+","3-","3","3+","4-","4","4+","5-","5","5+","6-","6","6+","7-","7","7+","8-","8","8+","9-","9","9+","10-","10"];
  const CONFIG = {
    comic: [ {key:"front",label:"F",max:50}, {key:"back",label:"B",max:20}, {key:"spine",label:"S",max:20}, {key:"interior",label:"I",max:10} ],
    card:  [ {key:"surface",label:"Surf",max:50}, {key:"corners",label:"Corn",max:20}, {key:"edges",label:"Edge",max:20}, {key:"centering",label:"Cent",max:10} ],
  };
  const clampTier = t => Math.max(0, Math.min(30, t));
  const roundHalfUp = x => Math.floor(x + 0.5);
  const tierFromThirds = th => LADDER[clampTier(th)];
  const subThirds = (val, max) => Math.max(0, Math.min(roundHalfUp(max*0.3), roundHalfUp((val||0)*0.3)));
  const gradeFromScore = score => tierFromThirds(clampTier(roundHalfUp((score||0)*0.3)));
  function fromSubscores(subscores, type) {
    const cfg = CONFIG[type] || CONFIG.comic;
    const subs = cfg.map(c => { const th = subThirds(subscores && subscores[c.key], c.max); return { key:c.key, label:c.label, thirds:th, maxThirds: roundHalfUp(c.max*0.3), display: tierFromThirds(th) }; });
    const totalThirds = clampTier(subs.reduce((a,s)=>a+s.thirds,0));
    return { grade: tierFromThirds(totalThirds), totalThirds, subs };
  }
  function pmBand(gradeLabel, pmNotches) { const i = LADDER.indexOf(gradeLabel); if (i < 0 || !(pmNotches>0)) return gradeLabel; return LADDER[clampTier(i-pmNotches)] + " to " + LADDER[clampTier(i+pmNotches)]; }
  const PM_BASE = { slabbed:4, main:2, deep:1, full:0 };
  return { LADDER, CONFIG, gradeFromScore, fromSubscores, tierFromThirds, subThirds, pmBand, PM_BASE, tierIndex: l=>LADDER.indexOf(l) };
})();

// Robograde Scoring v3 (half-point 0-10). Inlined from lib/roboscore_v3.js.
// lib/roboscore_v3.js — Robograder Scoring v3 (half-point 0–10).
// Pure display/quantization transform over the stored 0–100 subscores.
// See claude/SCORING_V3_SPEC.md. Classic-script + CommonJS dual export.
(function (root) {
  "use strict";

  function roundHalf(x) { return Math.round(Number(x) * 2) / 2; }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

  function interiorBase(pageQuality) {
    var pq = String(pageQuality || "").toLowerCase().trim();
    if (!pq) return 0.5;
    if (pq === "white") return 1;
    if (pq === "off-white to white" || pq === "off-white" || pq === "cream to off-white") return 0.5;
    if (pq.indexOf("cream") === 0 || pq.indexOf("tan") !== -1 || pq.indexOf("brittle") !== -1) return 0;
    if (pq.indexOf("off-white") !== -1) return 0.5;
    return 0;
  }
  function interiorTier(pageQuality, interiorDefect) {
    var base = interiorBase(pageQuality);
    if (interiorDefect) base = Math.max(0, base - 0.5);
    return base;
  }

  var DEPTH_CAP = { main: 9.0, deep: 9.5, full: 10.0 };

  // Confidence-hold cap: shave 0.5 at a time, round-robin front -> back -> spine,
  // until the subscores sum to the ceiling. Front is shaved first each cycle, so
  // it is restored LAST (Main holds front+back at 9.0; Deep holds front at 9.5;
  // Full restores all). Interior (page-quality) is never shaved. Subscores always
  // reconcile to the displayed grade.
  function shaveToCap(sub, cap) {
    var s = { front: sub.front, back: sub.back, spine: sub.spine, interior: sub.interior };
    var order = ["front", "back", "spine"];
    var i = 0, guard = 0;
    function total() { return s.front + s.back + s.spine + s.interior; }
    while (total() > cap + 1e-9 && guard < 200) {
      var k = order[i % order.length];
      if (s[k] >= 0.5) s[k] = roundHalf(s[k] - 0.5);
      i++; guard++;
      if (s.front <= 0 && s.back <= 0 && s.spine <= 0) break;
    }
    return s;
  }

  function photoSeverity(pg) {
    if (!pg) return 0;
    var c = 0, b = 0;
    ["focus", "lighting", "cropping", "angle"].forEach(function (k) {
      var v = String(pg[k] || "").toUpperCase();
      if (v === "C") c++; else if (v === "B") b++;
    });
    return c * 2 + b;   // C counts double
  }

  // PM (Precision Modifier). Returns one of 0, 0.5, 1, 1.5, 2.
  function computePM(input) {
    var depth = (input.depth || "main").toLowerCase();
    var slab = !!input.slabbed;
    var sev = photoSeverity(input.photograder);
    var pm;
    if (slab) {
      pm = (depth === "deep") ? (sev <= 1 ? 1.0 : sev === 2 ? 1.5 : 2.0)
                              : (sev <= 1 ? 1.5 : 2.0);          // slabbed main (2 imgs, through plastic)
    } else if (depth === "full") {
      pm = (input.all16Present && sev === 0) ? 0
                                             : (sev <= 1 ? 0.5 : sev === 2 ? 1.0 : 1.5);
    } else if (depth === "deep") {
      pm = (sev <= 1 ? 0.5 : sev === 2 ? 1.0 : 1.5);
    } else { // main (raw, 4 imgs)
      pm = (sev <= 1 ? 1.0 : sev === 2 ? 1.5 : 2.0);
      pm = pm + 0.5 * (input.missingCore || 0);                 // missing spine/interior widens
    }
    return Math.min(2.0, pm);
  }
  function formatPM(pm) { return (!pm || pm <= 0) ? "" : "±" + pm; }   // ±1 not ±1.0; ±0.5 keeps decimal

  function computeRoboScoreV3(input) {
    input = input || {};
    var depth = (input.depth || "main").toLowerCase();
    var slabbed = !!input.slabbed;

    var raw = {
      front: clamp(roundHalf((input.front50 || 0) / 10), 0, 5),
      back: clamp(roundHalf((input.back20 || 0) / 10), 0, 2),
      spine: clamp(roundHalf((input.spine20 || 0) / 10), 0, 2),
      interior: interiorTier(input.pageQuality, !!input.interiorDefect)
    };
    var uncapped = raw.front + raw.back + raw.spine + raw.interior;

    var cap = DEPTH_CAP[depth] != null ? DEPTH_CAP[depth] : 9.0;
    if (slabbed) cap = Math.min(cap, 9.5);   // slab can never reach RG 10 (no Full)

    var sub = (uncapped > cap + 1e-9) ? shaveToCap(raw, cap) : raw;
    var grade = sub.front + sub.back + sub.spine + sub.interior;
    var ceilingHit = uncapped > cap + 1e-9;

    var upsell = null;
    if (depth === "main" && ceilingHit) upsell = "deep";
    else if (depth === "deep" && ceilingHit && !slabbed) upsell = "full";

    var pm = computePM(input);

    return {
      grade: grade,
      uncappedGrade: uncapped,
      subscores: sub,
      rawSubscores: raw,
      pm: pm,
      pmLabel: formatPM(pm),
      ceilingHit: ceilingHit,
      upsell: upsell
    };
  }

  // Display formatting: integers show bare ("9","10"); halves keep one decimal
  // ("9.5","8.5"). Same on EVERY surface (screens + labels) — no ".0".
  function formatGrade(g){ g = Number(g); return (g % 1 === 0) ? String(g) : g.toFixed(1); }
  function gradeParts(g){ g = Number(g); var w = Math.trunc(g); return { whole: String(w), frac: (g % 1 === 0) ? "" : ("." + Math.round((g - w) * 10)) }; }

  // ---- Shared score-box renderer (identical look on every surface) ----------
  // Structural anti-clip layout: stars pinned top-center; the number is
  // flex-centered so it is ALWAYS dead-center regardless of PM width; PM and the
  // footer (version / "RG") are stacked at the bottom, so PM can never touch the
  // stars or the number. One uniform-size decimal — no fragile superscript.
  // opts: {grade, pmLabel, stars(0-3), restoStar, footer('version'|'RG'|''),
  //   footerText, size, numColor, starColor, footerColor, pmColor, bg, border}
  var _STAR_PATH = "M12,2 15.64,6.98 21.51,8.91 17.9,13.92 17.88,20.09 12,18.2 6.12,20.09 6.1,13.92 2.49,8.91 8.36,6.98Z";
  function _starRow(n, px, color, resto, restoColor) {
    var s = "";
    for (var i = 0; i < n; i++) s += '<svg viewBox="0 0 24 24" width="' + px + '" height="' + px + '" style="display:inline-block"><path d="' + _STAR_PATH + '" fill="' + color + '"/></svg>';
    if (resto) s += '<svg viewBox="0 0 24 24" width="' + px + '" height="' + px + '" style="display:inline-block"><path d="' + _STAR_PATH + '" fill="' + (restoColor || "#b58be0") + '"/></svg>';
    return s ? '<span style="display:inline-flex;gap:1px;align-items:center;line-height:1">' + s + '</span>' : "";
  }
  function scoreBox(o) {
    o = o || {};
    var size = o.size || 104;
    var numColor = o.numColor || "#b8d820";
    var starColor = o.starColor || numColor;
    var footerColor = o.footerColor || numColor;
    var pmColor = o.pmColor || footerColor;
    var bg = o.bg || "#0f1a05";
    var border = o.border || ("1.5px solid " + (o.borderColor || "#3a5010"));
    var stars = o.stars || 0;
    var starPx = o.starPx || Math.max(8, Math.round(size * 0.11));
    var numSize = o.numSize || Math.round(size * 0.66);
    var _nudge = Math.round(numSize * 0.09);
    var p = gradeParts(o.grade);
    // Number: ABSOLUTELY centered in the full box so PM/stars/footer never shift
    // it off-center. font-stretch 62.5% uses Noto Sans Display's real condensed
    // width axis (narrow glyphs, prints correctly) so decimals like 5.5 stay tight.
    var _numInner = p.frac ? (p.whole + '<span style="font-size:0.5em">.</span>' + p.frac.slice(1)) : p.whole;
    var numHtml = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">'
      + '<span style="font-family:\'League Spartan\',system-ui,sans-serif;font-weight:900;transform:scaleX(0.66) translateY(' + _nudge + 'px);transform-origin:center;display:inline-block;color:' + numColor + ';line-height:1;font-size:' + numSize + 'px">' + _numInner + '</span></div>';
    // Stars: top-center.
    var starsHtml = (stars > 0 || o.restoStar) ? '<div style="position:absolute;top:' + Math.round(size*0.05) + 'px;left:0;right:0;display:flex;justify-content:center;pointer-events:none">' + _starRow(stars, starPx, starColor, o.restoStar, o.restoColor) + '</div>' : "";
    // PM: UPPER-RIGHT (never below the score).
    var pmHtml = "";
    if (o.pmLabel) {
      var _pmM = String(o.pmLabel).match(/^([^0-9.]*)(.*)$/);
      var _pmSym = _pmM ? _pmM[1] : '';
      var _pmNum = _pmM ? _pmM[2] : String(o.pmLabel);
      var _pmSize = Math.max(11, Math.round(size * 0.17));
      var _pmTop = Math.round(size * 0.5 + _nudge - numSize * 0.365 - _pmSize * 0.5);
      pmHtml = '<div style="position:absolute;top:' + _pmTop + 'px;right:' + Math.round(size*0.07) + 'px;line-height:1;white-space:nowrap;pointer-events:none;color:' + pmColor + ';font-weight:700">'
        + '<span style="font-family:\'Saira\',system-ui,sans-serif;font-size:' + _pmSize + 'px">' + _pmSym + '</span>'
        + '<span style="font-family:\'Saira Extra Condensed\',system-ui,sans-serif;font-size:' + _pmSize + 'px">' + _pmNum + '</span></div>';
    }
    // Footer (version / RG): bottom-center.
    var footHtml = "";
    if (o.footer === "RG") footHtml = '<div style="position:absolute;bottom:' + Math.round(size*0.05) + 'px;left:0;right:0;text-align:center;font-size:' + Math.max(8, Math.round(size*0.086)) + 'px;font-weight:700;color:' + footerColor + ';opacity:0.85;letter-spacing:1px;line-height:1;pointer-events:none">RG</div>';
    else if (o.footer === "version" && o.footerText) footHtml = '<div style="position:absolute;bottom:' + Math.round(size*0.05) + 'px;left:0;right:0;text-align:center;font-size:' + Math.max(7, Math.round(size*0.077)) + 'px;font-weight:700;color:' + footerColor + ';opacity:0.8;letter-spacing:0.8px;line-height:1;pointer-events:none">' + o.footerText + '</div>';
    return '<div style="position:relative;width:' + size + 'px;height:' + size + 'px;background:' + bg + ';border:' + border + ';border-radius:' + Math.round(size*0.14) + 'px;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,0.4)">' + numHtml + starsHtml + pmHtml + footHtml + '</div>';
  }

  // ---- CARD scoring (v3) ----------------------------------------------------
  // Card axes: Surface 0-5, Corners 0-2, Edges 0-2, Centering 0-1. Cards have no
  // "Full" (no interior/spine to open), so a Deep (raking-light, all angles) is
  // the deepest pass and CAN confirm a 10. Caps: Main 9.0, Deep 10; slab <= 9.5.
  var DEPTH_CAP_CARD = { main: 9.5, deep: 10.0 };  // cards have no interior surfaces — confident to 9.5 on the first pass
  function shaveToCapCard(sub, cap) {
    var s = { surface: sub.surface, corners: sub.corners, edges: sub.edges, centering: sub.centering };
    var order = ["surface", "corners", "edges"];  // centering never shaved (mirrors interior)
    var i = 0, guard = 0;
    function total() { return s.surface + s.corners + s.edges + s.centering; }
    while (total() > cap + 1e-9 && guard < 200) {
      var k = order[i % order.length];
      if (s[k] >= 0.5) s[k] = roundHalf(s[k] - 0.5);
      i++; guard++;
      if (s.surface <= 0 && s.corners <= 0 && s.edges <= 0) break;
    }
    return s;
  }
  function computeCardV3(input) {
    input = input || {};
    var depth = (input.depth || "main").toLowerCase();
    var slabbed = !!input.slabbed;
    var raw = {
      surface: clamp(roundHalf((input.surface50 || 0) / 10), 0, 5),
      corners: clamp(roundHalf((input.corners20 || 0) / 10), 0, 2),
      edges: clamp(roundHalf((input.edges20 || 0) / 10), 0, 2),
      centering: clamp(roundHalf((input.centering10 || 0) / 10), 0, 1)
    };

async function downloadAllImages() {
  const it = window._adminItem; if (!it) return;
  // S20 (#36): include the Deep interior-cover images in the export set.
  const urls = [].concat(it.images || [], it.cornerImages || [], it.interiorCoverImages || [], it.interiorImages || [], it.restorationImages || [], it.signatureImages || []).filter(Boolean);
  const status = document.getElementById('dl-all-status');
  if (!urls.length) { if (status) status.textContent = 'No images.'; return; }
  const base = ((it.title || 'item') + (it.issue ? '-' + it.issue : '')).replace(/[^a-z0-9]+/gi, '_');
  // S20 (#42): Firebase Storage URLs aren't CORS-enabled, so a direct fetch()
  // fails ("load failed"). Route each image through the same-origin admin proxy
  // (/api/download), which fetches server-side and streams the bytes back. Data
  // URLs (inline thumbnails) are fetched directly — no proxy needed.
  if (!state.idToken) state.idToken = await state.user.getIdToken();
  let n = 0;
  for (const url of urls) {
    try {
      const isData = /^data:/i.test(url);
      const r = isData
        ? await fetch(url)
        : await fetch('/api/download?url=' + encodeURIComponent(url), { headers: { Authorization: 'Bearer ' + state.idToken } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const blob = await r.blob();
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `${base}_${String(n + 1).padStart(2, '0')}.jpg`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
      n++;
      if (status) status.textContent = `Downloaded ${n}/${urls.length}…`;
      await new Promise(res => setTimeout(res, 150));
    } catch (e) { if (status) status.textContent = `Failed on #${n + 1}: ${e.message}`; }
  }
  if (status) status.textContent = `Done — ${n} image${n === 1 ? '' : 's'} saved.`;
}

const CGC_LADDER = [0.5,1.0,1.5,2.0,2.5,3.0,3.5,4.0,4.5,5.0,5.5,6.0,6.5,7.0,7.5,8.0,8.5,9.0,9.2,9.4,9.6,9.8];
const PSA_LADDER = [1,1.5,2,3,4,5,6,7,8,9,10];
function _fmvLadder(it){ return (it && it.type === 'card') ? PSA_LADDER : CGC_LADDER; }
function _fmvCategory(it){ return (it && it.type === 'card') ? (it.fmvCategory || 'pokemon') : 'comics'; }
const _fmvNormTitle = s => !s ? '' : s.toString().trim().replace(/\s+/g,' ').replace(/^The\s+/i,'').toLowerCase();
function _fmvKeyOf(title, issue) {
  let t = (title == null ? '' : title.toString()).trim().replace(/\s+/g,' ');
  let i = (issue == null ? '' : issue.toString()).trim().replace(/^#/,'');
  const titleHasAnnual = /\bannual\b/i.test(t);
  const mA = i.match(/^\s*(?:annual|ann\.?)\s*#?\s*0*(\d+)\s*$/i);
  const mB = i.match(/^\s*A\s*0*(\d+)\s*$/i);
  if (titleHasAnnual) { t = t.replace(/\bannual\b/ig,'').replace(/\s+/g,' ').trim(); const num = mA ? mA[1] : (mB ? mB[1] : i.replace(/^0+(\d)/,'$1')); i = 'A'+num; }
  else if (mA) { i = 'A'+mA[1]; } else if (mB) { i = 'A'+mB[1]; } else { i = i.replace(/^0+(\d)/,'$1'); }
  t = t.replace(/^invincible\s+iron\s+man\b/i,'Iron Man');
  return _fmvNormTitle(t) + '|' + i;
}
let _fmvBounds = [];
function _fmvInitBounds(it) {
  _fmvBounds = [];
  if (!it) return;
  const LAD = _fmvLadder(it);
  const curve = (Array.isArray(it.fmvManualCurve) && it.fmvManualCurve.length) ? it.fmvManualCurve
              : (Array.isArray(it.fmvCurve) ? it.fmvCurve : null);
  if (!curve) return;
  const pts = [];
  curve.forEach(pair => {
    let g, t;
    if (Array.isArray(pair)) { g = pair[0]; t = +pair[1]; }
    else if (pair && typeof pair === 'object') { g = pair.g; t = +pair.t; }
    else return;
    const ci = LAD.indexOf(g);
    if (ci >= 0 && t >= 1) pts.push([ci, t]);
  });
  pts.sort((a,b)=>a[0]-b[0]);
  // Emit (t - prevT) bounds at each breakpoint's ladder index, INCLUDING the
  // base at index 0. A base tier > 1 pushes that many bounds at index 0 so the
  // whole ladder sits at the right tier. (Bug fix: the base used to be skipped,
  // so any book with base tier > 1 — every valuable key — rendered with its
  // lower tiers stripped and everything shifted down, e.g. ASM Annual #1 showed
  // tier 2 at grade 4.5 instead of tier 6.)
  let prevT = 1;
  for (const pt of pts) {
    const ci = pt[0], t = pt[1];
    let delta = t - prevT;
    while (delta-- > 0 && _fmvBounds.length < 12) _fmvBounds.push(ci);
    prevT = t;
  }
  _fmvBounds.sort((a,b)=>a-b);
}
function tapFmv(cell) {
  // Each tap raises this grade AND every grade below it by one tier (stacking).
  // The base (cell 0, the lowest grade) is tappable too — raise it when a book is
  // worth more than tier 1 even at 0.5. When a cell reaches the max tier 13, one
  // more tap CYCLES it back to the lowest it can be: the base cycles to tier 1;
  // any other cell cycles to one tier above the cell directly above it (e.g. cell
  // above = 4 → this cell cycles to 5). Use Clear to reset everything.
  const below = i => _fmvBounds.filter(b => b <= i).length; // bounds at/above this row in-list
  const curUncapped = 1 + below(cell);
  if (curUncapped >= 13) {
    // Cycle back to minimum. Strip the extra bounds stacked AT this cell; for the
    // base that means tier 1 (no bound), for any other cell that means one bound
    // (tier of the cell above + 1).
    _fmvBounds = _fmvBounds.filter(b => b !== cell);
    if (cell !== 0) _fmvBounds.push(cell);
  } else {
    if (_fmvBounds.length >= 12) return;
    _fmvBounds.push(cell);
  }
  _fmvBounds.sort((x, y) => x - y);
  renderFmvEditor(window._fmvItem);
}
function renderFmvEditor(it) {
  const el = document.getElementById('fmv-editor');
  if (!el) return;
  const _isCardFmv = !!(it && it.type === 'card');
  const LAD = _fmvLadder(it);
  const _tiersMap = (it && it.fmvTiers) || null;
  const _fmtK = v => v == null ? '' : (v >= 1000 ? '$' + (v / 1000) + 'K' : '$' + v);
  const _rangeStr = t => { if (!_tiersMap) return ''; const r = _tiersMap[String(t)]; if (!r) return ''; return (r[1] == null) ? _fmtK(r[0]) + '+' : _fmtK(r[0]) + '–' + _fmtK(r[1]); };
  const rows = LAD.map((g, i) => {
    let tier = 1;
    for (const b of _fmvBounds) { if (i >= b) tier++; else break; }
    if (tier > 13) tier = 13;
    const isBase = (i === 0);
    const filled = isBase || _fmvBounds.indexOf(i) !== -1;
    return `<div onclick="tapFmv(${i})" style="display:flex;align-items:center;gap:10px;cursor:pointer;padding:1px 0">
      <div style="width:40px;text-align:right;font-size:12px;color:#bbb;font-variant-numeric:tabular-nums">${g.toFixed(1)}</div>
      <div style="width:42px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;${filled?'background:#2a6a2a;color:#fff':'background:#1c1c22;color:#667;border:1px solid #333'}">${tier}</div>

    <div style="font-size:11px;color:#888;margin-bottom:8px;line-height:1.45">Tap any grade — including the base (top) cell — to raise it and every grade below it one tier (tap again to raise further; at 13 it cycles back). Clear to reset. Then Save.</div>

    <div style="display:flex;gap:8px;margin-top:10px;max-width:220px">

      <button onclick="clearFmv()" style="padding:9px 14px;background:#3a1a1a;color:#e85050;border:1px solid #5a2a2a;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer">Clear</button>

async function saveFmv() {
  const it = window._fmvItem; if (!it) return;
  const resEl = document.getElementById('fmv-result');
  const LAD = _fmvLadder(it);
  const bounds = _fmvBounds.slice().sort((a, b) => a - b);
  // Start at i=0 so a base tier > 1 is written to the curve (previously the base
  // grade was hardcoded to tier 1, corrupting valuable books on save).
  const breaks = [];
  let prevT = null;
  for (let i = 0; i < LAD.length; i++) {
    let t = 1;
    for (const b of bounds) { if (b <= i) t++; else break; }
    if (t > 13) t = 13;
    if (prevT === null || t > prevT) { breaks.push({ g: LAD[i], t: t }); prevT = t; }
  }
  const key = _fmvKeyOf(it.title, it.issue);
  const _cat = _fmvCategory(it);
  try {
    if (resEl) { resEl.style.color = '#aaa'; resEl.textContent = 'Saving…'; }
    await api('/api/set_fmv', { method: 'POST', body: { category: _cat, type: it.type === 'card' ? 'card' : 'comic', key, breaks } });
    it.fmvManualCurve = breaks;
    if (resEl) { resEl.style.color = '#5c5'; resEl.textContent = 'Saved ' + key + ' (' + breaks.length + ' breakpoints). Live in the app on next load.'; }
  } catch (e) { if (resEl) { resEl.style.color = '#e85050'; resEl.textContent = 'Save failed: ' + (e.message || e); } }
}
async function clearFmv() {
