<!-- Firebase SDK (compat libs match the pattern used in the main app) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// ── Firebase config ────────────────────────────────────────────────────────
// Same project as the main app. These are public client keys — security is
// enforced server-side by the admin email allowlist on each API endpoint.
const firebaseConfig = {
  apiKey: "AIzaSyCDfjpnL94J0L09vJpg3I8ANu6zUzrrKxM",
  authDomain: "ai-comic-grader.firebaseapp.com",
  projectId: "ai-comic-grader",
  storageBucket: "ai-comic-grader.firebasestorage.app",
  messagingSenderId: "700471029422",
  appId: "1:700471029422:web:5f5269c70cece04bf2473f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const dbF = firebase.firestore();

// ── State ──────────────────────────────────────────────────────────────────
const state = {
  user: null,           // Firebase user object
  idToken: null,        // Cached for API calls
  view: 'dashboard',    // 'dashboard' | 'user' | 'item'
  selectedUid: null,
  selectedItemId: null,
  // S14: default tab changed from 'users' to 'items'. Matt's usual entry
  // point is "what assessments came in recently" rather than "who are my
  // users." itemsSort + itemsDir already default to date/desc which is
  // exactly the right starting sort for that intent.
  tab: 'items',         // 'users' | 'items' | 'timings'
  sort: 'createdAt',
  dir: 'desc',
  users: [],
  hasMore: false,
  itemsSort: 'date',
  itemsDir: 'desc',
  itemsList: [],
  itemsHasMore: false,
  itemsTotal: 0,
  itemSearch: '',
  // S15: Timings tab — diagnostic data from assess.js phaseTimings.
  timingsList: [],
  timingsHasMore: false,
  timingsTotal: 0,
  timingsFilter: 'all',  // 'all' | 'errors' | 'timeouts' | 'success'
  timingsVersion: '',    // empty string = all versions
  stats: null,
  // S14: when truthy, the credits pill on the user-detail view renders as an
  // inline editor instead of a static value. Reset whenever we leave the
  // user-detail view or switch to a different user.
  creditsEditOpen: false,
  error: null,
};

const root = document.getElementById('root');

// ── Dataset exclusions (S18) ───────────────────────────────────────────────
// Exclude any account (Matt's own + test accounts) from both the full JSON
// export and the summary. Persisted in localStorage so it survives reloads.
try { state.excludedUids = JSON.parse(localStorage.getItem('rg_excluded_uids') || '[]'); }
catch (_) { state.excludedUids = []; }
function isExcluded(uid) { return state.excludedUids.indexOf(uid) !== -1; }
function toggleExclude(uid) {
  const i = state.excludedUids.indexOf(uid);
  if (i === -1) state.excludedUids.push(uid); else state.excludedUids.splice(i, 1);
  try { localStorage.setItem('rg_excluded_uids', JSON.stringify(state.excludedUids)); } catch (_) {}
  renderUsers();
  const c = document.getElementById('excl-count');
  if (c) c.textContent = state.excludedUids.length;
}
// Show/hide the custom date inputs when the range dropdown changes.
function _onRangeChange() {
  const sel = document.getElementById('export-range');
  const cust = document.getElementById('export-range-custom');
  if (cust) cust.style.display = (sel && sel.value === 'custom') ? 'inline-flex' : 'none';
}
// Translate the selected export range into {since, until} Date bounds (local time).
// today/7d/30d/month are relative windows; custom reads the two date inputs.
function _rangeBounds() {
  const sel = document.getElementById('export-range');
  const mode = sel ? sel.value : 'all';
  const now = new Date();
  const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  let since = null, until = null;
  if (mode === 'today') { since = startOfDay(now); }
  else if (mode === '7d') { since = startOfDay(now); since.setDate(since.getDate() - 6); }
  else if (mode === '30d') { since = startOfDay(now); since.setDate(since.getDate() - 29); }
  else if (mode === 'month') { since = new Date(now.getFullYear(), now.getMonth(), 1); }
  else if (mode === 'custom') {
    const f = document.getElementById('export-from');
    const t = document.getElementById('export-to');
    if (f && f.value) since = new Date(f.value + 'T00:00:00');
    if (t && t.value) until = new Date(t.value + 'T23:59:59.999'); // inclusive end-of-day
  }
  return { since, until };
}
// Build the ?...excludeUid=...&since=...&until=... query shared by export + summary.
function exportQuery(extra) {
  const parts = [];
  if (extra) parts.push(extra);
  if (state.excludedUids.length) parts.push('excludeUid=' + encodeURIComponent(state.excludedUids.join(',')));
  const { since, until } = _rangeBounds();
  if (since) parts.push('since=' + encodeURIComponent(since.toISOString()));
  if (until) parts.push('until=' + encodeURIComponent(until.toISOString()));
  return parts.length ? '?' + parts.join('&') : '';
}

// ── API helper ─────────────────────────────────────────────────────────────
// S14: accepts an opts object so PATCH/POST with a JSON body works through
// the same auth + token-refresh path as GET. opts.method defaults to GET;
// opts.body is JSON-stringified automatically and Content-Type is set.
async function api(path, opts) {
  opts = opts || {};
  const method = opts.method || 'GET';
  if (!state.idToken) state.idToken = await state.user.getIdToken();
  const buildInit = (token) => {
    const init = {
      method,
      headers: { Authorization: 'Bearer ' + token }
    };
    if (opts.body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(opts.body);
    }
    return init;
  };
  let res = await fetch(path, buildInit(state.idToken));
  // Token might have expired — refresh once and retry.
  if (res.status === 401) {
    state.idToken = await state.user.getIdToken(true);
    res = await fetch(path, buildInit(state.idToken));
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `HTTP ${res.status}`);
  }
  return res.json();
}

// Pull the full data export and save it as a JSON file. Reuses api() so the
// admin token + refresh path is identical to every other call.
async function downloadExport() {
  const btn = document.getElementById('export-btn');
  const orig = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Exporting…'; }
  try {
    const data = await api('/api/export' + exportQuery());
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `robograder-export-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Export failed: ' + (e && e.message ? e.message : e));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}

// Aggregate summary (counts only, no item bodies) — tiny payload, shown in a modal.
async function exportSummary() {
  const btn = document.getElementById('summary-btn');
  const orig = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Summarizing…'; }
  try {
    const d = await api('/api/export' + exportQuery('aggregate=1'));
    showSummaryModal(d);
  } catch (e) {
    alert('Summary failed: ' + (e && e.message ? e.message : e));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
  }
}

      </div>
      ${state.excludedUids.length ? `<div style="color:#caa;font-size:12px;margin-bottom:12px">Excluding ${state.excludedUids.length} account${state.excludedUids.length === 1 ? '' : 's'} from these numbers.</div>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
        ${statCard('Items', d.total != null ? d.total : '—')}
        ${statCard('Distinct users', d.distinctUsers != null ? d.distinctUsers : '—')}
        ${statCard('Avg predicted grade', d.avgPG != null ? d.avgPG : '—')}
        ${statCard('Avg Roboscore', d.avgRG != null ? d.avgRG : '—')}
        ${statCard('Opted in', ob.optIn != null ? ob.optIn : '—')}
        ${statCard('Opted out', ob.optOut != null ? ob.optOut : '—')}
      </div>

      <div style="font-weight:700;margin:6px 0">Multiple submissions (${(d.multiSubmissions || []).length})</div>
      <table style="width:100%;border-collapse:collapse">${multi || '<tr><td>None</td></tr>'}</table>
    </div>`;
  document.body.appendChild(wrap);

  wrap.querySelector('#summary-close').onclick = close;
  wrap.onclick = e => { if (e.target === wrap) close(); };
}

// ── Auth ───────────────────────────────────────────────────────────────────
// S20: the toggle used to render unchecked on every re-render (renderDashboard
// rebuilds the header via innerHTML) and on any read failure, so it displayed
// "off" while assess.js was actually caching. Hold the config in module state,
// default it to assess.js's defaults (enabled, 1h), and render FROM that state.
let _cacheCfg = { enabled: true, ttl: '1h' };
async function _loadCacheCfg() {
  try {
    const snap = await dbF.collection('config').doc('caching').get();
    if (snap.exists) {
      const d = snap.data() || {};
      _cacheCfg = { enabled: d.enabled !== false, ttl: d.ttl === '5m' ? '5m' : '1h' };
    } else {
      _cacheCfg = { enabled: true, ttl: '1h' }; // no doc -> assess.js defaults
    }
  } catch (e) {
    console.warn('[cache-cfg] read failed, keeping defaults (enabled/1h):', e && e.message);
  }
  _syncCacheCfgDom();
}
function _syncCacheCfgDom() {
  const en = document.getElementById('cache-enabled'), tt = document.getElementById('cache-ttl');
  if (en) en.checked = _cacheCfg.enabled;
  if (tt) tt.value = _cacheCfg.ttl;
}
async function _saveCacheCfg() {
  const en = document.getElementById('cache-enabled'), tt = document.getElementById('cache-ttl');
  if (!en || !tt) return;
  _cacheCfg = { enabled: en.checked, ttl: tt.value };
  try { await dbF.collection('config').doc('caching').set({ enabled: en.checked, ttl: tt.value }, { merge: true }); }
  catch (e) { alert('Failed to save caching config: ' + (e && e.message)); }
}
// Compact date + time for the All Items rows.
function _fmtDateTime(d) {
  try {
    return new Date(d).toLocaleString(undefined, { month: 'numeric', day: 'numeric', year: '2-digit', hour: 'numeric', minute: '2-digit' });
  } catch (e) { return new Date(d).toLocaleDateString(); }
}
// S20: refresh the current tab in place (no more Logs-then-back dance).
async function refreshDashboard() {
  const btn = document.getElementById('refresh-btn');
  if (btn) { btn.disabled = true; btn.textContent = '\u2026'; }
  try {
    await _loadCacheCfg();
    loadStats();
    if (state.tab === 'items') loadItems(true);
    else if (state.tab === 'timings') loadTimings(true);
    else loadUsers(true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '\u27F3'; }
  }
}

async function loadUsers(reset = false) {

    state.users = [];

  const offset = state.users.length;
  try {

    // delay on the items endpoint especially (admin SDK reads + per-item
    // doc lookups). 20 is plenty for an at-a-glance view; Load More is
    // there for deeper digs.
    const res = await api(`/api/users?sort=${state.sort}&dir=${state.dir}&limit=20&offset=${offset}&q=${encodeURIComponent(state.userSearch || '')}`);

    renderUsers();
  } catch (e) {
    document.getElementById('users-section').innerHTML =
      `<div class="err-banner">Users failed: ${escapeHtml(e.message)}</div>`;
  }

  renderTimingsFilterBar();
  loadTimings(true);
}

function renderTimingsFilterBar() {
  const bar = document.getElementById('timings-filter-bar');
  if (!bar) return;
  const filters = [
    ['all', 'All'],
    ['errors', 'Errors'],
    ['timeouts', 'Timeouts'],
    ['success', 'Success only']
  ];
  bar.innerHTML = filters.map(([key, label]) => {
    const active = state.timingsFilter === key ? 'active' : '';
    return `<button class="${active}" data-filter="${key}">${label}</button>`;
  }).join('') + `
    <span style="margin-left:8px;font-size:12px;color:var(--text-dim)">v</span>
    <input type="text" id="timings-version" value="${escapeAttr(state.timingsVersion || '')}" placeholder="any" style="width:42px;background:var(--panel-2);border:1px solid var(--panel-2);color:var(--text);padding:4px 6px;border-radius:4px;font-size:12px;">
  `;
  bar.querySelectorAll('button[data-filter]').forEach(btn => {
    btn.onclick = () => {
      state.timingsFilter = btn.dataset.filter;
      loadTimings(true);
      renderTimingsFilterBar();
    };
  });
  const vIn = document.getElementById('timings-version');
  if (vIn) {
    let t = null;
    vIn.oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        state.timingsVersion = vIn.value.trim();
        loadTimings(true);
      }, 400);
    };
  }
}

async function loadTimings(reset = false) {
  if (reset) {
    state.timingsList = [];
    state.timingsHasMore = false;
  }
  const offset = state.timingsList.length;
  const params = new URLSearchParams({
    limit: '50',
    offset: String(offset),
    filter: state.timingsFilter || 'all'
  });
  if (state.timingsVersion) params.set('version', state.timingsVersion);
  try {
    const res = await api(`/api/timings?${params.toString()}`);
    state.timingsList = state.timingsList.concat(res.timings || []);
    state.timingsHasMore = !!res.hasMore;
    state.timingsTotal = res.total || 0;
    renderTimingsList();
  } catch (e) {
    const sec = document.getElementById('timings-section');
    if (sec) sec.innerHTML = `<div class="err-banner">Logs failed: ${escapeHtml(e.message)}</div>`;
  }
}

function renderTimingsList() {
  const sec = document.getElementById('timings-section');
  if (!sec) return;
  if (state.timingsList.length === 0) {
    sec.innerHTML = '<div class="empty">No timing data yet for this filter.</div>';
    return;
  }

  // Aggregate stats across the visible page so Matt can eyeball averages
  // without manually reading every row.
  const totals = state.timingsList.map(t => t.totalMs || 0).filter(Boolean);
  const primaries = state.timingsList.map(t => (t.phases && t.phases.primaryCallMs) || 0).filter(Boolean);
  const refines = state.timingsList.map(t => (t.phases && t.phases.refineCallMs) || 0).filter(Boolean);
  // S15 May 28: per-assessment cost was added to timing writes (see assess.js
  // costUsd block). Aggregate across the visible page — sum is the spend,
  // mean is per-assessment cost. Errored rows write costUsd: 0 (no tokens
  // billed) so they don't skew the mean.
  const costs = state.timingsList.map(t => +t.costUsd || 0).filter(c => c > 0);
  const mean = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0) / arr.length) : 0;
  const sumCost = costs.reduce((a,b)=>a+b, 0);
  const meanCost = costs.length ? sumCost / costs.length : 0;
  const fmtCost = c => '$' + (c < 0.01 ? c.toFixed(4) : c.toFixed(c < 1 ? 3 : 2));
  const p95 = arr => {
    if (!arr.length) return 0;
    const s = [...arr].sort((a,b)=>a-b);
    return s[Math.min(s.length - 1, Math.floor(s.length * 0.95))];
  };
  const aggHtml = `
    <div class="count-line">
      <strong>${state.timingsTotal}</strong> rows · showing ${state.timingsList.length}
      &nbsp;·&nbsp; mean total <strong>${mean(totals)}ms</strong>
      &nbsp;·&nbsp; p95 total <strong>${p95(totals)}ms</strong>
      &nbsp;·&nbsp; mean primary <strong>${mean(primaries)}ms</strong>
      ${refines.length ? `&nbsp;·&nbsp; mean refine <strong>${mean(refines)}ms</strong>` : ''}
      ${costs.length ? `&nbsp;·&nbsp; mean cost <strong>${fmtCost(meanCost)}</strong> &nbsp;·&nbsp; total <strong>${fmtCost(sumCost)}</strong>` : ''}
    </div>
  `;

  const rows = state.timingsList.map(t => {
    const p = t.phases || {};
    const errored = !!t.errorMessage;
    const timedOut = t.timedOut === true;
    const tagHtml = errored
      ? `<span style="background:#5a1818;color:#ffb0b0;padding:1px 6px;border-radius:3px;font-size:11px;">${timedOut ? 'TIMEOUT' : 'ERROR'}</span>`
      : `<span style="background:var(--panel-2);color:var(--text-dim);padding:1px 6px;border-radius:3px;font-size:11px;">${t.gateResult || 'COMIC'}</span>`;
    const dateStr = t.createdAt ? new Date(t.createdAt).toLocaleString() : '?';
    const totalColor = (t.totalMs || 0) > 55000 ? '#ff8080' : (t.totalMs || 0) > 40000 ? '#ffc070' : 'var(--text)';
    return `
      <div class="row timing-row" data-key="${escapeAttr(t.key)}" style="cursor:pointer;">
        <div class="main">
          <div class="title" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;">
            ${escapeHtml(t.key)} ${tagHtml}
            ${t.version ? `<span style="color:var(--text-dim);font-size:11px;margin-left:6px;">v${escapeHtml(t.version)}</span>` : ''}
          </div>
          ${t.title ? `<div style="font-size:13px;font-weight:600;color:var(--text);margin:2px 0;">${escapeHtml(t.title)}${t.issue ? ' #' + escapeHtml(t.issue) : ''}${t.predictedGrade ? `<span style="color:#7fd0ff;font-weight:700;margin-left:8px;">PG ${escapeHtml(t.predictedGrade)}</span>` : ''}${t.pageQuality ? `<span style="color:var(--text-dim);font-weight:400;margin-left:8px;">PQ ${escapeHtml(t.pageQuality)}</span>` : ''}</div>` : ''}
          ${t.rgScore != null ? `<div style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--text-dim);">RG ${escapeHtml(String(t.rgScore))}</div>` : ''}
          <div class="sub" style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;">
            ${dateStr}
            ${+t.costUsd > 0 ? `&nbsp;·&nbsp;<span style="color:var(--text-dim);">${fmtCost(+t.costUsd)}</span>` : ''}
            ${t.errorMessage ? `<br><span style="color:#ff8080;">${escapeHtml(String(t.errorMessage).slice(0, 200))}</span>` : ''}
          </div>
        </div>
        <div class="meta">
          <div class="big" style="color:${totalColor};">${t.totalMs ?? '—'}</div>
          <div class="label">ms total</div>
        </div>
      </div>
    `;
  }).join('');

  sec.innerHTML = aggHtml + rows + (state.timingsHasMore ? `<button class="load-more" id="load-more-timings-btn">Load more</button>` : '');
  sec.querySelectorAll('.timing-row').forEach(row => {
    row.onclick = () => {
      const t = state.timingsList.find(x => x.key === row.dataset.key);
      if (t) showTimingDetail(t);
    };
  });
  if (state.timingsHasMore) {
    document.getElementById('load-more-timings-btn').onclick = () => loadTimings(false);
  }
}

function showTimingDetail(t) {
  // Tap a row to see the full phase breakdown as JSON. Useful for sharing
  // a specific timeout case in chat — copy-paste the JSON block.
  const json = JSON.stringify(t, null, 2);
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;';
  modal.innerHTML = `
    <div style="background:var(--panel);max-width:720px;width:100%;border-radius:8px;padding:16px;color:var(--text);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h2 style="margin:0;font-size:16px;">Timing detail · ${escapeHtml(t.key)}</h2>
        <button id="timing-close" style="background:var(--panel-2);color:var(--text);border:none;padding:6px 12px;border-radius:4px;cursor:pointer;">Close</button>
      </div>
      <pre style="background:#0d1808;padding:12px;border-radius:4px;font-size:11px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;">${escapeHtml(json)}</pre>

  document.getElementById('timing-close').onclick = () => modal.remove();
}

// S14: hard-delete a user account via the admin endpoint. The two-step
// confirmation is enforced both client-side (this function) AND
// server-side (the endpoint checks the typed email matches). Double
// confirmation prevents fat-finger deletions of the wrong account.
// S14: promise-based in-app replacement for window.prompt(). Native
// prompt() is unreliable in mobile Safari and is fully suppressed in
// standalone/PWA display mode — it can return null without ever showing
// a dialog, which is exactly why the delete-account email confirmation
// had "nowhere to type." Resolves the entered string, or null on
// cancel / overlay tap / Escape.
let _apResolver = null;
function appPrompt(message, okLabel) {
  return new Promise((resolve) => {
    _apResolver = resolve;
    const overlay = document.getElementById('ap-overlay');
    const msg = document.getElementById('ap-msg');
    const input = document.getElementById('ap-input');
    const ok = document.getElementById('ap-ok');
    if (!overlay || !msg || !input) {
      // Last-resort fallback — should not happen, but never trap the admin.
      resolve(window.prompt(message));
      return;
    }
    msg.textContent = message;
    input.value = '';
    if (ok && okLabel) ok.textContent = okLabel;
    overlay.style.display = 'flex';
    setTimeout(() => { try { input.focus(); } catch (e) {} }, 30);
    const done = (val) => {
      overlay.style.display = 'none';
      document.removeEventListener('keydown', onKey);
      const r = _apResolver; _apResolver = null;
      if (r) r(val);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') done(null);
      else if (e.key === 'Enter') done(input.value);
    };
    document.getElementById('ap-ok').onclick = () => done(input.value);
    document.getElementById('ap-cancel').onclick = () => done(null);
    overlay.onclick = (e) => { if (e.target === overlay) done(null); };
    document.addEventListener('keydown', onKey);
  });
}

async function deleteAccount(user) {
  const hasEmail = !!(user.email && user.email.trim());
  const uidSuffix = (user.uid || '').slice(-6);
  const summary = `Delete this account?\n\n` +
    `Name:   ${user.displayName || '(no name)'}\n` +
    `Email:  ${user.email || '(no email — legacy account)'}\n` +
    `UID:    ${user.uid}\n\n` +
    `This will permanently remove the Auth user, the Firestore doc, ` +
    `all items, all photos, and all registry entries.\n\n` +
    `Purchases, credit adjustments, and promo redemptions will be RETAINED.\n\n` +
    `Cannot be undone.`;
  if (!confirm(summary)) return;

  // Second confirmation: typed-back token. For accounts WITH an email, type
  // the email. For very old accounts with NO email (fields are just
  // assessmentCredits/createdAt/freeCreditsGranted/termsAccepted/
  // termsAcceptedAt/termsVersion), type the last 6 chars of the UID — the
  // only stable identifier these ghost accounts have. Server enforces the
  // same rule, so this client check is the first line, not the only line.
  let promptMsg, expected;
  if (hasEmail) {
    promptMsg = `Type the user's email to confirm deletion:\n\n${user.email}`;
    expected = user.email.trim().toLowerCase();
  } else {
    promptMsg = `This is a legacy account with no email.\n\nType the last 6 characters of its UID to confirm deletion:\n\n${user.uid}\n                                          ^^^^^^\n(type: ${uidSuffix})`;
    expected = uidSuffix.toLowerCase();
  }
  const typed = await appPrompt(promptMsg, 'Delete Account');
  if (typed == null) return;  // cancelled
  let trimmed = typed.trim().toLowerCase();
  // S14: the client's expected value is a best guess (it's derived from
  // the Firestore record's email, which can disagree with the Auth
  // record the SERVER checks — the exact cause of the reported bug). So
  // this is a soft warning, not a hard block: if it doesn't match what
  // the client expected, confirm intent but still let the server be the
  // authority. The server validates strictly and now offers a retry
  // with its exact required value, so a wrong guess here is recoverable
  // rather than a dead end.
  if (trimmed !== expected) {
    const proceed = await appPrompt(
      'That doesn\'t match what this screen expected, but the server will ' +
      'verify independently (the server is the source of truth and may ' +
      'require a different value for this account).\n\nRe-enter the ' +
      'confirmation value to send to the server, or Cancel to abort:',
      'Send to Server'
    );
    if (proceed == null) return;
    trimmed = proceed.trim().toLowerCase();
  }

  const btn = document.getElementById('delete-account-btn');

  // S14 FIX — the real delete bug. The client decided whether to ask for
  // the EMAIL or the UID-SUFFIX based on user.email from the FIRESTORE
  // list record. The server decides based on the FIREBASE AUTH record
  // (getAuth().getUser().email). For ghost accounts whose Firestore doc
  // has no email but whose Auth user DOES (e.g. paulsonier2@gmail.com),
  // the two disagree forever: client asks for the UID suffix, server
  // demands the email, mismatch every time — exactly the user's
  // screenshot. The server is the source of truth and its error message
  // states precisely what to type. So: attempt with what we have, and if
  // the server returns a confirmation mismatch, surface the server's
  // requirement and let the admin retry with the correct value instead
  // of dead-ending. confirmEmail is re-sent each attempt.
  async function attemptDelete(confirmValue) {
    if (btn) { btn.disabled = true; btn.textContent = 'Deleting…'; }
    try {
      const data = await api('/api/delete_user', {
        method: 'POST',
        body: { uid: user.uid, confirmEmail: confirmValue },
      });
      if (!data || !data.ok) throw new Error('Unexpected response');
      alert(`Account deleted.\n\n` +
            `Auth removed:       ${data.summary.authDeleted ? 'yes' : 'no'}\n` +
            `User doc removed:   ${data.summary.userDocDeleted ? 'yes' : 'no'}\n` +
            `Items removed:      ${data.summary.itemsDeleted}\n` +
            `Comics removed:     ${data.summary.comicsDeleted}\n` +
            `Meta docs removed:  ${data.summary.metaDeleted}\n` +
            `Registry removed:   ${data.summary.robogradeIdsDeleted}\n` +
            `Storage cleared:    ${data.summary.storageObjectsDeleted}`);
      // S14 FIX: the previous code called render() + loadUsers(true) +
      // set state.* directly. This codebase has NO bare render()
      // function (it uses renderDashboard / renderUserDetail / etc.) —
      // the ReferenceError "Can't find variable: render" fired AFTER the
      // account was already deleted server-side, so the delete actually
      // succeeded but the UI crashed instead of returning to the list.
      // The canonical "return to the user list" is exactly what the
      // detail view's Back button does: renderDashboard() (it resets
      // state.view/selectedUid itself and calls loadUsers via
      // renderUsersTab). Set the tab first so we land on Users.
      state.tab = 'users';
      renderDashboard();
      return true;
    } catch (e) {
      const msg = (e && e.message) || 'unknown error';
      if (btn) { btn.disabled = false; btn.textContent = 'Delete this account'; }
      // If the server told us a confirmation mismatch, it also told us
      // exactly what string it wants. Re-prompt with that, pre-filled
      // hint, and retry — rather than failing terminally on a client/
      // server rule disagreement the admin can't otherwise resolve.
      if (/confirmation mismatch|type the last 6|type "/i.test(msg)) {
        const retry = await appPrompt(
          'The server requires a specific confirmation value:\n\n' + msg +
          '\n\nEnter it exactly to proceed, or Cancel to abort.',
          'Confirm & Delete'
        );
        if (retry == null) return false;
        return attemptDelete(retry.trim().toLowerCase());
      }
      alert('Delete failed: ' + msg);
      return false;
    }
  }

  await attemptDelete(trimmed);
}

// S14: PATCH the user doc with the new credit value. On success, the
// endpoint returns the same shape as GET, so we feed it back into
// renderUserDetail directly — no extra round-trip needed. On failure,
// surface the error inline above the pills and leave the editor open so
// the admin can fix and retry.
async function saveCredits(uid) {
  const input = document.getElementById('credits-input');
  const save  = document.getElementById('credits-save');
  if (!input) return;
  const n = parseInt(input.value, 10);
  if (!Number.isFinite(n) || n < 0 || n > 10000) {
    alert('Credits must be an integer between 0 and 10000.');
    input.focus(); input.select();
    return;
  }
  // No-op short-circuit: if the value didn't change, just close the editor.
  // Without this, the server returns a 400 ("No change") that gets surfaced
  // as a "Failed to update" alert, which is wrong messaging for a no-op.
  // Server still enforces the same rule as defense-in-depth (and to prevent
  // junk audit entries from stale clients).
  const cached = state.currentUserDetail;
  if (cached && cached.user && cached.user.assessmentCredits === n) {
    state.creditsEditOpen = false;
    renderUserDetail(cached.user, cached.items, cached.publicRate);
    return;
  }
  // Disable the buttons while in-flight so a double-tap doesn't fire twice.
  if (save) { save.disabled = true; save.textContent = 'SAVING…'; }
  try {
    const { user, items, publicRate } = await api(
      `/api/user?uid=${encodeURIComponent(uid)}`,
      { method: 'PATCH', body: { assessmentCredits: n } }
    );
    state.creditsEditOpen = false;
    renderUserDetail(user, items, publicRate);
  } catch (e) {
    alert('Failed to update credits: ' + e.message);
    if (save) { save.disabled = false; save.textContent = 'SAVE'; }
  }
}

async function showItem(uid, id, fromTab) {
  state.view = 'item';
  state.selectedItemId = id;
  // fromTab tells us where the user came from so "Back" goes back to the
  // right place. 'items' = all-items list; otherwise = a user's profile.
  const fromItemsList = fromTab === 'items';
  root.innerHTML = `
    <header>
      <button class="back" id="back-btn">← ${fromItemsList ? 'All Items' : 'User'}</button>
      <h1>ITEM</h1>
      <button class="sign-out" id="signout-btn">Sign out</button>
    </header>
    <main class="item-detail">
      <div class="loading">Loading item…</div>
    </main>
  `;
  document.getElementById('back-btn').onclick = () => {
    if (fromItemsList) {
      renderDashboard();
    } else {
      showUser(uid);
    }
  };
  document.getElementById('signout-btn').onclick = signOut;
  try {
    const { item } = await api(`/api/item?uid=${encodeURIComponent(uid)}&id=${encodeURIComponent(id)}`);
    renderItemDetail(item);
  } catch (e) {
    document.querySelector('main').innerHTML =
      `<div class="err-banner">Item load failed: ${escapeHtml(e.message)}</div>`;
  }
}

function renderDefectList() {
  const el = document.getElementById('defect-list');
  if (!el) return;
  const defects = window._adminDefects || [];
  if (defects.length === 0) {
    el.innerHTML = '<div style="color:#666;font-size:12px;padding:8px;">No defects recorded.</div>';
    return;
  }
  el.innerHTML = defects.map((d, i) => {
    const sev = d.severity || '';
    const sevColor = sev === 'High' ? '#e85050' : sev === 'Med' ? '#e8a040' : sev === 'Low' ? '#888' : '#666';
    const parts = [d.location, d.measurement].filter(Boolean).join(', ');
    const cb = d.colorBreaking ? ' <span style="color:#e85050;font-size:9px;">CB</span>' : '';
    return `<div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:${i % 2 === 0 ? '#111' : '#161616'};border-radius:4px;margin-bottom:2px;">
      <button onclick="removeDefect(${i})" style="width:22px;height:22px;background:#3a1a1a;color:#e85050;border:1px solid #5a2a2a;border-radius:4px;font-size:14px;line-height:1;cursor:pointer;flex-shrink:0">×</button>
      <span style="flex:1;font-size:11px;color:#ddd;"><strong>${escapeHtml(d.type || '?')}</strong>${parts ? ' — ' + escapeHtml(parts) : ''}${cb}</span>
      <span style="font-size:10px;font-weight:700;color:${sevColor};letter-spacing:0.5px;flex-shrink:0">${sev.toUpperCase()}</span>
    </div>`;
  }).join('');
}

function removeDefect(idx) {
  window._adminDefects.splice(idx, 1);
  renderDefectList();
}

function addDefectFromForm() {
  const type = document.getElementById('def-type')?.value?.trim();
  const location = document.getElementById('def-location')?.value?.trim();
  const severity = document.getElementById('def-severity')?.value;
  const measurement = document.getElementById('def-measurement')?.value?.trim();
  const colorBreaking = document.getElementById('def-cb')?.checked;
  if (!type) { alert('Type is required'); return; }
  window._adminDefects.push({
    type, location: location || '', severity: severity || 'Low',
    measurement: measurement || '', colorBreaking: !!colorBreaking
  });
  renderDefectList();
  // Clear form
  document.getElementById('def-type').value = '';
  document.getElementById('def-location').value = '';
  document.getElementById('def-severity').value = 'Low';
  document.getElementById('def-measurement').value = '';
  document.getElementById('def-cb').checked = false;
}

async function rescoreItem() {
  const it = window._adminItem;
  if (!it) { alert('No item loaded'); return; }
  const resultEl = document.getElementById('rescore-result');
  if (resultEl) resultEl.textContent = 'Re-scoring…';
  try {
    const resp = await api('/api/rescore', {
      method: 'POST',
      body: {
        userId: it.uid,
        itemId: it.id,
        defects: window._adminDefects,
        pageQuality: it.pageQuality || 'White'
      }
    });
    if (resultEl) {
      resultEl.style.color = '#6a6';
      resultEl.textContent = resp.message || 'Re-scored successfully.';
    }
    // Refresh the item view
    setTimeout(() => showItem(it.uid, it.id, 'items'), 1500);
  } catch (e) {
    if (resultEl) {
      resultEl.style.color = '#e55';
      resultEl.textContent = 'Re-score failed: ' + e.message;
    }
  }
}

// ── Utility ────────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}
function escapeAttr(s) {
  return escapeHtml(s);
}

  <img id="admin-lb-img" src="" alt="">
  <div class="lb-btns">
    <button class="lb-btn" onclick="document.getElementById('admin-lightbox').classList.remove('show')">Exit</button>

  </div>

<script>
function openAdminLightbox(src) {
  const lb = document.getElementById('admin-lightbox');
  const img = document.getElementById('admin-lb-img');
  img.src = src;
  lb.classList.add('show');
  lb.onclick = function(e) { if (e.target === lb) lb.classList.remove('show'); };
}
function saveAdminLightboxImage() {
  const img = document.getElementById('admin-lb-img');
  if (!img.src) return;
  const a = document.createElement('a');
  a.href = img.src;
  a.download = 'robograder-image.jpg';
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  a.remove();
}
</script>
