<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robograder — Sign In</title>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js">
<style>
  body { margin:0; background:#0a0a0a; color:#fff; font-family:-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; flex-direction:column; gap:16px; padding:20px; }
  .logo { width:200px; }
  .subtitle { font-size:14px; letter-spacing:1.5px; color:#6a5a4a; font-weight:600; }
  .status { font-size:14px; color:#aaa; text-align:center; line-height:1.5; }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; border:none; border-radius:10px; padding:14px 28px; font-size:15px; font-weight:600; cursor:pointer; width:280px; }
  .btn-google { background:#fff; color:#1a1a1a; }
  .btn-apple { background:#000; color:#fff; border:1px solid #333; margin-top:8px; }
  .spinner { width:30px; height:30px; border:3px solid #333; border-top-color:#d4af37; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto; }
  @keyframes spin { to { transform:rotate(360deg) } }
  .done { color:#b8d820; font-size:18px; }
  .err { color:#e85050; }
  .or-divider { display:flex; align-items:center; gap:12px; width:280px; margin:4px 0; color:#555; font-size:12px; }
  .or-divider::before, .or-divider::after { content:''; flex:1; border-top:1px solid #333; }
</style>
</head>
<body>
  <img src="/assets/Robograder_Logo.webp" alt="Robograder" class="logo">
  <div class="subtitle">COMIC GRADING APP</div>
  <div id="buttons" style="display:none;flex-direction:column;align-items:center">
    <button class="btn btn-apple" id="appleBtn">
      <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#fff" d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
      Sign in with Apple
    </button>
    <div class="or-divider">or</div>
    <button class="btn btn-google" id="googleBtn">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
  </div>
  <div id="status" class="status"><div class="spinner"></div><br>Loading...</div>

<script type="module">
  // Initialize Vercel Web Analytics
  import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics@2.0.1/dist/index.mjs';
  inject();

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, OAuthProvider, signInWithRedirect, getRedirectResult } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyCDfjpnL94J0L09vJpg3I8ANu6zUzrrKxM",
    authDomain: "robograder.app",
    projectId: "ai-comic-grader",
    storageBucket: "ai-comic-grader.firebasestorage.app",
    messagingSenderId: "700471029422",
    appId: "1:700471029422:web:8dd352e5e4e5c18c22dcf9"
  });
  const auth = getAuth(app);
  const session = new URLSearchParams(window.location.search).get('s');
  const status = document.getElementById('status');
  const buttons = document.getElementById('buttons');

  // Check if returning from a redirect (Google or Apple)
  try {
    const result = await getRedirectResult(auth);
    if (result && result.user) {
      status.innerHTML = '<div class="spinner"></div><br>Completing sign-in...';
      const idToken = await result.user.getIdToken();
      const resp = await fetch('/api/ios-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken, session })
      });
      if (!resp.ok) throw new Error('Server error: ' + resp.status);
      const data = await resp.json();
      if (data.customToken || data.success) {
        // iOS auth bridge: redirect to the custom URL scheme. iOS shows a
        // one-tap "Open in Robograder?" prompt and foregrounds the app; the
        // app's visibilitychange handler then polls for this token and finishes
        // sign-in. We tried the https Universal Link (to mimic the Stripe
        // purchase auto-return) but it was NOT intercepted for the auth
        // redirect — Safari just rendered the web app in-browser, which is
        // worse than the prompt. The custom scheme is the better compromise.
        status.innerHTML = '<div class="done">✓ Signed in!</div><br>Returning to Robograder…';
        // The app polls for this token and closes this sheet automatically. We no
        // longer redirect to robograder://auth-complete — a custom scheme does
        // nothing inside an in-app sheet and was the 2.1a rejection. If auto-close
        // is slow, the sheet's Done button returns to the app and the fallback poll
        // (on visibilitychange) finishes sign-in.
        setTimeout(function() { status.innerHTML = '<div class="done">✓ Signed in!</div><br>Returning to Robograder…<br><br><span style="color:#888;font-size:13px">If this doesn\'t close on its own, tap Done (top-left) to return.</span>'; }, 2500);
      } else {
        throw new Error(data.error || 'Failed');
      }
    } else {
      status.style.display = 'none';
      buttons.style.display = 'flex';
    }
  } catch (e) {
    console.warn('[auth-ios]', e.code, e.message);
    status.style.display = 'none';
    buttons.style.display = 'flex';
  }

  // Both use signInWithRedirect — no popups, no ITP issues (same domain)
  document.getElementById('googleBtn').addEventListener('click', function() {
    status.style.display = 'block';
    status.innerHTML = '<div class="spinner"></div><br>Redirecting to Google...';
    buttons.style.display = 'none';
    signInWithRedirect(auth, new GoogleAuthProvider());
  });

  document.getElementById('appleBtn').addEventListener('click', function() {
    status.style.display = 'block';
    status.innerHTML = '<div class="spinner"></div><br>Redirecting to Apple...';
    buttons.style.display = 'none';
    signInWithRedirect(auth, new OAuthProvider('apple.com'));
  });
</script>
</body>
</html>
