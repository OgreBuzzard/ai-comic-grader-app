<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Robograder Assessment</title>

<!-- Open Graph fallback (S12). Most link-preview engines (Twitter, Slack,
     Discord, Mastodon, email previews) parse static HTML and don't run
     JavaScript, so without these tags they show no preview at all.
     iMessage uses Apple's previewer which DOES run JS — for iMessage,
     the front cover of the actual book is picked up automatically from
     the rendered <img> elements once lookup.js fetches the comic. So:
       iMessage → real comic cover (via JS rendering, no OG tag needed)
       Other    → branded Robograder fallback (these tags) -->
<meta property="og:title" content="Robograder Assessment">
<meta property="og:description" content="View this comic's Robograde score and condition assessment.">
<meta property="og:image" content="https://robograder.app/assets/Robograder_v2_Load.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://robograder.app/assets/Robograder_v2_Load.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Font system mirrors index.html so the shared RoboGrade panel renders
  identically on both surfaces:
    - Noto Sans Display @ 62.5% width  → score number, title, issue
    - Barlow Condensed                 → labels, body, identity text
    - IBM Plex Mono falls back to Menlo via system stack (matches index.html)
-->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:wdth,wght@62.5..100,500;700;900&family=Barlow+Condensed:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Shared RoboGrade panel renderer (S12). Same module index.html uses for
     the detail view. Edit only at /robograde-panel.js. -->
<script src="/robograde-panel.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:       #0d0d0f;
    --paper:     #f5f3ee;
    --mid:       #6a7a5a;
    --light:     #9aaa7a;
    --rule:      #b0b89a;
    --warn:      #c84a4a;
    /* Mascot greens — match detail view's palette so the integrity pill
       and any other accents tie into the RoboGrade panel visually. */
    --olive-deep: #152e10;
    --olive-mid:  #4a7028;
    --olive-lt:   #7aa838;
  }

  html { background: var(--paper); color: var(--ink); }

  body {
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 60px;
  }

  header {
    width: 100%;
    max-width: 720px;
    padding: 18px 20px 12px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .wordmark {
    font-family: 'Noto Sans Display', sans-serif;
    font-stretch: 62.5%;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: 0.02em;
    color: var(--ink);
    text-align: center;
  }
  .wordmark span {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-stretch: 100%;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--mid);
    margin-top: 2px;
  }

  .content {
    width: 100%;
    max-width: 720px;
    padding: 0 16px;
  }

  /* Identity block — title, issue + date, publisher. Mirrors detail view's
     title block layout and typography. Sits above the RoboGrade panel. */
  .identity { margin: 14px 0 18px; }
  .identity .book-title {
    font-family: 'Noto Sans Display', sans-serif;
    font-stretch: 62.5%;
    font-size: 28px;
    font-weight: 900;
    color: var(--ink);
    line-height: 1.1;
  }
  .identity .issue-row {
    display: flex; align-items: baseline; gap: 10px;
    flex-wrap: wrap; margin-top: 6px;
  }
  .identity .book-issue {
    font-family: 'Noto Sans Display', sans-serif;
    font-stretch: 62.5%;
    font-size: 18px; font-weight: 600;
    color: #3a2e24;
  }
  .identity .book-date {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 16px; font-weight: 600;
    color: #7a6a5a;
  }
  .identity .book-publisher {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; font-weight: 500;
    color: #8a7a6a; margin-top: 4px;
  }

  /* Photos section — mirrors detail view's image gallery layout.
     Index 0 = front cover, 1 = back cover, 2 = page-quality interior,
     3 = spine. */
  .photos-section { margin-top: 18px; }
  .photos-header-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .photos-header {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; font-weight: 700;
    color: var(--mid);
    letter-spacing: 0.18em; text-transform: uppercase;
  }
  .image-stack { display: flex; flex-direction: column; gap: 6px; }
  .image-stack img.detail-cover,
  .image-stack img.photo-spine {
    width: 100%; display: block; border-radius: 4px;
    background: #f0eee8; cursor: pointer;
  }

  /* Corner-macro grid (high-grade only). 2×2 grid mirrors detail view. */
  .corner-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    margin-top: 6px;
  }
  .corner-grid .corner-tile { position: relative; }
  .corner-grid img {
    width: 100%; display: block; border-radius: 4px;
    background: #f0eee8; cursor: pointer;
  }
  .corner-grid .corner-label {
    position: absolute; top: 4px; left: 6px;
    font-size: 9px; font-weight: 700;
    color: #fff; background: rgba(0, 0, 0, 0.55);
    padding: 2px 6px; border-radius: 3px;
    letter-spacing: 0.05em;
    font-family: 'Barlow Condensed', sans-serif;
  }

  /* Integrity pill — matches detail view's olive-on-sage / muted-amber
     styling so verified books read instantly as legit and unverified
     books carry visible weight. */
  .integrity-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.5px; line-height: 1.3;
  }
  .integrity-icon { font-size: 12px; line-height: 1; }
  .integrity-verified {
    background: #d4d9be; color: #3a4a18; border: 1px solid #a8b890;
  }
  .integrity-unverified {
    background: #f4e8cc; color: #8a6a18; border: 1px solid #c8b880;
  }

  /* Footer disclaimer — sole disclaimer surface (we removed the duplicate
     at the top). Same warm-paper aesthetic. */
  footer {
    margin-top: 28px; padding: 18px 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px; color: var(--mid); line-height: 1.55;
    text-align: center;
    border-top: 1px solid var(--rule);
    max-width: 640px; width: 100%;
  }
  footer a {
    color: var(--olive-mid); text-decoration: none; font-weight: 700;
  }

  /* Loading / error states. */
  .state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px 20px; text-align: center; color: var(--mid);
  }
  .state-icon { font-size: 36px; margin-bottom: 10px; }
  .state-title { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 6px; }
  .state-sub { font-size: 13px; line-height: 1.5; }

  /* Lightbox — simple full-screen overlay for clickable image enlargement.
     No pinch-zoom (kept light), just tap-to-open and tap-anywhere-to-close. */
  #lightbox {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.92);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 20px; cursor: pointer;
  }
  #lightbox.show { display: flex; }
  #lightbox img {
    max-width: 100%; max-height: 100%;
    object-fit: contain; display: block;
  }
  #lightbox .close-hint {
    position: absolute; top: 16px; right: 18px;
    color: rgba(255, 255, 255, 0.7);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase;
    pointer-events: none;
  }

  @media (max-width: 480px) {
    .identity .book-title { font-size: 24px; }
    .identity .book-issue { font-size: 16px; }
    .identity .book-date  { font-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    Robograder
    <span>AI Comic Assessment</span>
  </div>
</header>

<div class="content">
  <div id="app">
    <div class="state">
      <span class="state-icon">⬡</span>
      <div class="state-title">Loading…</div>
    </div>
  </div>
</div>

<!-- Lightbox overlay — populated on image click -->
<div id="lightbox" onclick="this.classList.remove('show')">
  <span class="close-hint">Tap to close</span>
  <img id="lightbox-img" alt="">
</div>

<script>
(async () => {
  const app = document.getElementById('app');

  // Extract ID from URL: /id/A3X7K2 or ?id=A3X7K2
  const pathMatch = location.pathname.match(/\/id\/([0-9A-NP-Za-np-z]{6})$/i);
  const id = pathMatch ? pathMatch[1].toUpperCase()
            : new URLSearchParams(location.search).get('id')?.toUpperCase();

  if (!id || !/^[0-9A-NP-Z]{6}$/.test(id)) {
    app.innerHTML = `<div class="state">
      <span class="state-icon">✕</span>
      <div class="state-title">Invalid ID</div>
      <div class="state-sub">The URL doesn't contain a valid Robograde ID.</div>
    </div>`;
    return;
  }

  let data;
  try {
    const resp = await fetch(`/api/lookup?id=${id}`);
    if (resp.status === 404) throw { code: 404, msg: 'Robograde ID not found.' };
    if (resp.status === 403) throw { code: 403, msg: 'This Robograde is private.' };
    if (!resp.ok) throw { code: resp.status, msg: 'Server error. Please try again.' };
    data = await resp.json();
  } catch (e) {
    app.innerHTML = `<div class="state">
      <span class="state-icon">${e.code === 404 ? '?' : e.code === 403 ? '🔒' : '⚠'}</span>
      <div class="state-title">${e.code === 404 ? 'Not Found' : e.code === 403 ? 'Private' : 'Error'}</div>
      <div class="state-sub">${e.msg || 'Something went wrong.'}</div>
    </div>`;
    return;
  }

  const rg = data.roboGrade || {};
  const score = rg.score != null ? Math.round(rg.score) : '—';

  document.title = `Robograde ${score} — ${data.title || ''} #${data.issue || ''}`;

  // Dynamically update OG image to point at the front cover. Static link-
  // preview crawlers won't see this (their HTML fetch already happened
  // before our script ran), but any crawler that DOES execute JS will
  // pick up the comic-specific image. iMessage's Apple previewer renders
  // the page and picks the largest visible image automatically — front
  // cover loads first (loading="eager") so it usually becomes the pick.
  if (data.images && data.images[0]) {
    const ogImg = document.querySelector('meta[property="og:image"]');
    if (ogImg) ogImg.setAttribute('content', data.images[0]);
    const twImg = document.querySelector('meta[name="twitter:image"]');
    if (twImg) twImg.setAttribute('content', data.images[0]);
    // Also update title to be book-specific
    const ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle) ogTitle.setAttribute('content', `Robograder: ${data.title || ''} #${data.issue || ''}`.trim());
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // Compact issue-date formatter — mirrors index.html's logic.
  function formatIssueDateCompact(d) {
    if (!d) return '';
    const s = String(d).trim();
    if (/^[A-Z][a-z]{2,3}\s+\d{4}$/.test(s)) return s;
    const monthAbbrev = {
      january: 'Jan', february: 'Feb', march: 'Mar', april: 'Apr', may: 'May', june: 'Jun',
      july: 'Jul', august: 'Aug', september: 'Sep', october: 'Oct', november: 'Nov', december: 'Dec',
      spring: 'Spr', summer: 'Sum', fall: 'Fall', autumn: 'Fall', winter: 'Win'
    };
    const MONTH_BY_NUM = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    let m = s.match(/^([A-Za-z\/]+)\s+(\d{4})$/);
    if (m) {
      const key = m[1].toLowerCase();
      if (monthAbbrev[key]) return `${monthAbbrev[key]} ${m[2]}`;
    }
    m = s.match(/^(\d{1,2})\/(\d{2}|\d{4})$/);
    if (m) {
      const month = parseInt(m[1], 10);
      let year = parseInt(m[2], 10);
      if (m[2].length === 2) year = year >= 30 ? 1900 + year : 2000 + year;
      if (month >= 1 && month <= 12) return `${MONTH_BY_NUM[month]} ${year}`;
    }
    if (/^\d{4}$/.test(s)) return s;
    return s;
  }

  // Issue formatter — strips leading "#" if present so we render it ourselves.
  function formatIssue(issue) {
    const s = String(issue || '').trim();
    return s.startsWith('#') ? s : `#${s}`;
  }

  // Identity block (title, issue, date, publisher). Cert numbers (cgcCert /
  // psaCert) intentionally omitted — public surface should not associate
  // Robograder with CGC/PSA brand identity.
  const identityHTML = `
    <div class="identity">
      <div class="book-title">${esc(data.title || '—')}</div>
      ${(data.issue || data.issueDate) ? `<div class="issue-row">
        ${data.issue ? `<span class="book-issue">${esc(formatIssue(data.issue))}</span>` : ''}
        ${data.issueDate ? `<span class="book-date">${esc(formatIssueDateCompact(data.issueDate))}</span>` : ''}
      </div>` : ''}
      ${data.publisher ? `<div class="book-publisher">${esc(data.publisher)}</div>` : ''}
    </div>
  `;

  // Integrity pill — verified state in olive-on-sage, unverified in muted
  // amber. Public surface renders BOTH states.
  const buildIntegrityPill = (state) => {
    if (state === 'verified') {
      return `<div class="integrity-pill integrity-verified" title="All assessed photos were captured in-app">
        <span class="integrity-icon">📷</span><span>Verified: in-app photos</span>
      </div>`;
    }
    if (state === 'unverified') {
      return `<div class="integrity-pill integrity-unverified" title="At least one assessed photo was uploaded from outside the app">
        <span class="integrity-icon">⚠</span><span>Unverified: photos taken outside of app</span>
      </div>`;
    }
    return '';
  };
  const integrityPillHTML = buildIntegrityPill(data.verificationState);

  // Photo gallery — mirrors detail view's layout.
  // Index 0=front, 1=back, 2=page-quality interior, 3=spine.
  // All clickable to open lightbox.
  const photoBlock = (() => {
    if (!data.images || data.images.length === 0) return '';
    const imgs = data.images;
    let inner = '';
    if (imgs[0]) inner += `<img class="detail-cover" src="${esc(imgs[0])}" alt="Front cover" loading="eager" decoding="async" onclick="openLightbox('${esc(imgs[0])}')">`;
    if (imgs[1]) inner += `<img class="detail-cover" src="${esc(imgs[1])}" alt="Back cover" loading="eager" decoding="async" onclick="openLightbox('${esc(imgs[1])}')">`;
    if (imgs[2]) inner += `<img class="detail-cover" src="${esc(imgs[2])}" alt="Page quality interior" loading="eager" decoding="async" onclick="openLightbox('${esc(imgs[2])}')">`;
    if (imgs[3]) inner += `<img class="photo-spine" src="${esc(imgs[3])}" alt="Spine" loading="eager" decoding="async" onclick="openLightbox('${esc(imgs[3])}')">`;
    return `
      <div class="photos-section">
        <div class="photos-header-row">
          <div class="photos-header">Photos</div>
          ${integrityPillHTML}
        </div>
        <div class="image-stack">${inner}</div>
      </div>
    `;
  })();

  // Corner macros (high-grade only). 2×2 row-major grid:
  //   index 0=TL, 1=TR, 2=BL, 3=BR
  // Reconstructs the front cover layout when corners were captured properly.
  const cornerBlock = (() => {
    if (!data.highGradeUnlocked || !data.cornerImages || data.cornerImages.length === 0) return '';
    const ci = data.cornerImages;
    const labels = ['Top Left', 'Top Right', 'Bottom Left', 'Bottom Right'];
    let tiles = '';
    for (let i = 0; i < 4; i++) {
      if (ci[i]) {
        tiles += `<div class="corner-tile">
          <img src="${esc(ci[i])}" alt="${labels[i]} corner" loading="lazy" decoding="async" onclick="openLightbox('${esc(ci[i])}')">
          <div class="corner-label">${labels[i].toUpperCase()}</div>
        </div>`;
      }
    }
    return `<div class="corner-grid">${tiles}</div>`;
  })();

  // Render the RoboGrade panel via the shared module. The function takes the
  // roboGrade subobject and the full record (for highGradeUnlocked, dates,
  // ID). Public's `data` shape mirrors what the module expects.
  const robogradePanelHTML = window.RobograderPanel.buildDisplay(rg, data);

  app.innerHTML = `
    ${identityHTML}
    ${photoBlock}
    ${cornerBlock}
    ${robogradePanelHTML}
  `;

  document.querySelector('.content').insertAdjacentHTML('beforeend', `
    <footer>
      Robograde is an AI-generated condition assessment produced by the Unerring Robograder.
      It is not affiliated with CGC, PSA, or any official comic book grading service.
      Grades reflect the condition of the book at the time of assessment.
      Books may change condition over time — always verify with current photos.
      <br><br>
      <a href="/" onclick="if (history.length > 1) { history.back(); return false; } return true;">← Back to Robograder</a>
    </footer>
  `);

})();

// Lightbox open — exposed at top level so onclick handlers can call it.
function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  img.src = src;
  lb.classList.add('show');
}
</script>
</body>
</html>
