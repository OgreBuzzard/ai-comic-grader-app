<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!--
    Standard comic outline guide. Used for FRONT, BACK, and (when applicable)
    flat PAGE-QUALITY shots. Geometry sized to fill ~92% of viewport.

    Comic aspect ratio: 6.625 × 10.25 inches → 0.6463 width:height
    To fit comfortably in 800×600 (camera 4:3), we orient the comic vertically
    with its long axis matching viewport height. With a 92%-of-height target:
      Comic height: 552 (92% of 600)
      Comic width:  552 × 0.6463 ≈ 357
      Centered: x = (800 - 357) / 2 = 221.5, y = (600 - 552) / 2 = 24
    Stroke 6 (3× original) for visibility against busy backgrounds.
  -->
  <rect x="221.5" y="24" width="357" height="552"
        fill="none" stroke="#7aa838" stroke-width="6"/>
</svg>
