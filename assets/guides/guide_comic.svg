<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background represents the camera viewfinder. Dark for visibility against the green outline.
       In production this layer is transparent; the live <video> stream shows through. -->
  <rect width="800" height="600" fill="#1a1a1a"/>

  <!--
    Standard comic outline guide.
    Comic aspect ratio: 6.625 × 10.25 inches → 0.6463
    Guide occupies central 80% of viewfinder height: 480px tall
    Width at that ratio: 480 × 0.6463 = 310.2px
    Centered: x = (800 - 310.2) / 2 = 244.9, y = (600 - 480) / 2 = 60
  -->
  <rect x="244.9" y="60" width="310.2" height="480"
        fill="none" stroke="#7aa838" stroke-width="2"/>

  <!-- Faint label so you can tell which guide this is at a glance during preview -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#7aa838" opacity="0.5">FRONT / BACK / PAGE QUALITY</text>
</svg>
