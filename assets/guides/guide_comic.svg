<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!--
    Comic outline guide — used for FRONT cover and BACK cover.
    Note: the same file is reused for both. The slot label below ("FRONT" /
    "BACK") is set DYNAMICALLY by cameraOpenSlot() in index.html, which finds
    the <text id="slot-label"> element and updates its content per slot.
    See CAMERA_LABEL_MAIN for the source of truth on slot labels.

    Sized to 98% of viewport, 12px corner rounding, stroke-6.
    Outline: 380 wide × 588 tall, centered at (210, 6).
    Label: bottom-centered, 36pt, 75% opacity to not compete with the frame.
  -->
  <rect x="210" y="6" width="380" height="588" rx="12" ry="12"
        fill="none" stroke="#7aa838" stroke-width="6"/>
  <!-- Slot label inside the SVG, immediately below the outline -->
  <text id="slot-label" x="400" y="595"
        text-anchor="middle"
        font-family="system-ui, sans-serif"
        font-size="32" font-weight="700"
        fill="#7aa838" opacity="0.85"
        letter-spacing="4">FRONT</text>
</svg>
