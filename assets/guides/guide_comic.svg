<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!--
    Comic outline guide — used for FRONT cover and BACK cover.
    Sized to ~98% of viewport (was 92% in prior iteration; testing showed
    comics fit comfortably smaller than expected so we're pushing closer to
    edges). 12px corner rounding for slightly softer feel without
    abandoning the rectangular comic shape. Stroke-6 for visibility.

    Comic aspect ratio: 6.625 × 10.25 inches → 0.6463 width:height.
    Target: 98% of viewport HEIGHT = 588.
      Comic height: 588
      Comic width:  588 × 0.6463 = 380
      Centered: x = (800 - 380) / 2 = 210, y = (600 - 588) / 2 = 6
  -->
  <rect x="210" y="6" width="380" height="588" rx="12" ry="12"
        fill="none" stroke="#7aa838" stroke-width="6"/>
</svg>
