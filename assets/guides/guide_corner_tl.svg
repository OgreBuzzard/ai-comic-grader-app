<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Top-Left corner macro guide (S13 v4 — full-screen-fill rebuild).

  L-bracket positioned in the upper-left quadrant. The bend of the L sits
  at (90, 200) in viewBox units; horizontal arm extends right to (510, 200),
  vertical arm extends down to (90, 900). The user places the comic's
  top-left corner inside this bracket and the corner detail fills the rest
  of the screen.

  viewBox 600x1100 matches the front/back guides for visual consistency.
  Stroke 4 px non-scaling. No embedded label — slot label "TOP LEFT" lives
  in the HTML overlay above the camera stage.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 1100"
     width="100%" height="100%"
     preserveAspectRatio="xMidYMid slice">
  <path d="M 510 200 L 90 200 L 90 900"
        fill="none"
        stroke="#7aa838"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        vector-effect="non-scaling-stroke"/>
</svg>
