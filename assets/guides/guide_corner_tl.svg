<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Top-Left corner macro. L-shape (⌐): corner-point upper-left, body extends
       toward bottom-right. User fills frame with the corner.
       Corner-point: (100, 75). Vertical leg DOWN to (100, 525). Horizontal leg
       RIGHT to (700, 75). Each leg ~75% of viewport span. -->
  <polyline points="100,525 100,75 700,75"
            fill="none" stroke="#7aa838" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>
