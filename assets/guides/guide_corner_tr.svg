<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Top-Right corner macro guide (S13 v4 — full-screen-fill rebuild).

  Mirrors the TL geometry. Bend at (510, 200); horizontal arm extends left
  to (90, 200), vertical arm extends down to (510, 900).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 1100"
     width="100%" height="100%"
     preserveAspectRatio="xMidYMid slice">
  <path d="M 90 200 L 510 200 L 510 900"
        fill="none"
        stroke="#7aa838"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        vector-effect="non-scaling-stroke"/>
</svg>
