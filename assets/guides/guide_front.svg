<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Front cover guide (S13 v4).

  Sized between v2 (477x738, too small per Matt's feedback) and v3
  (564x870, cut into the dark bands per Matt's feedback). v4 splits the
  difference at 520x804.

  Geometry:
    viewBox 600x1100 (portrait, ~9:16.5 phone aspect)
    Outline rect x=40, y=148, w=520, h=804 — Silver Age aspect 0.647
    Corner radius 16 viewBox units (~10 screen pixels)
    Stroke 4px non-scaling

  On a typical iPhone Pro stage (~390x810), outline renders ~338 px wide
  by ~523 px tall, with ~144 px of dark padding at top (where the slot
  label sits) and ~144 px at bottom (above the controls bar gradient).

  Slot label rendered separately as HTML overlay above the outline.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 1100"
     width="100%" height="100%"
     preserveAspectRatio="xMidYMid meet">
  <rect x="40" y="148" width="520" height="804"
        rx="16" ry="16"
        fill="none"
        stroke="#7aa838"
        stroke-width="4"
        vector-effect="non-scaling-stroke"/>
</svg>
