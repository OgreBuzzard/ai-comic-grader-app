<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Front cover guide (S13 rebuild).

  Portrait viewBox sized for phone aspect (~9:16-ish). Comic outline fills
  ~96% of viewport width and ~81% of viewport height — Silver Age aspect
  (6.625" × 10.25", ratio ~0.647). Slot label is intentionally NOT in the
  SVG; an HTML overlay above the camera stage carries it instead, so the
  label scales with screen pixels and never overlaps the framed cover.

  Stroke: vector-effect="non-scaling-stroke" + stroke-width="6" gives a
  uniform 6 screen-pixel stroke regardless of how the SVG scales to fit
  the viewport. Color #7aa838 matches OLIVE_LT (locked S11).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 1100"
     width="100%" height="100%"
     preserveAspectRatio="xMidYMid meet">
  <!--
    Comic outline. Sharp 90° corners (Silver/Bronze Age comics are square-cut).
    x=12, y=105, width=576, height=890 → centered horizontally with 12px
    margin each side, centered vertically with 105px above and below.
  -->
  <rect x="12" y="105" width="576" height="890"
        fill="none"
        stroke="#7aa838"
        stroke-width="6"
        vector-effect="non-scaling-stroke"/>
</svg>
