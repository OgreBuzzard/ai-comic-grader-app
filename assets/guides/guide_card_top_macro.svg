<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#1a1a1a"/>

  <!--
    Top macro guide for Pokémon cards — TILTED with visibly rounded top corners.
    Open-bottom trapezoid:
      Top edge: y = 80, full width 640px (x: 80–720)
      Sides converge inward by ~5% per side going down (tilt cue for raking edge view)
      Card body extends past viewport bottom (y > 600)

    Top corners use 14px arc radius (matches main card guide for visual consistency).
    Path:
      Start at bottom-left of side (112, 600)
      Line up to near-top of left side, stopping at the corner-radius inset
      Arc into the top edge
      Line across top to right-side corner
      Arc down into the right side
      Line down to bottom-right (688, 600)
  -->
  <path d="M 112 600
           L 80 100
           A 20 20 0 0 1 100 80
           L 700 80
           A 20 20 0 0 1 720 100
           L 688 600"
        fill="none" stroke="#7aa838" stroke-width="2"/>

  <text x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="12" fill="#7aa838" opacity="0.5">TOP MACRO (FRONT &amp; BACK) — TILTED</text>
</svg>
