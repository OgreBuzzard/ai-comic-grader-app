<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!--
    Page Quality guide — open centerfold, designed LANDSCAPE.
    User rotates phone to landscape for this shot. When phone is in landscape,
    this 800×600 viewBox fills the screen and the centerfold occupies most of
    the visible area. When phone is in portrait, it fits cramped in the middle
    — visual cue that rotation is expected.

    Layout:
      LEFT page outline: solid stroke, 3-sided (open toward centerfold).
      RIGHT page outline: dashed stroke, 3-sided (open toward centerfold).
      Two staple markers ON centerfold axis, drawn as THIN strokes.
      Rotation arrow in upper-left to suggest phone rotation.
      Slot label below the page outlines (id=slot-label, set per-slot by JS).
  -->

  <path d="M 400,6 L 32,6 Q 20,6 20,18 L 20,540 Q 20,552 32,552 L 400,552"
        fill="none" stroke="#7aa838" stroke-width="6"
        stroke-linejoin="round"/>
  <path d="M 400,6 L 768,6 Q 780,6 780,18 L 780,540 Q 780,552 768,552 L 400,552"
        fill="none" stroke="#7aa838" stroke-width="6"
        stroke-dasharray="14 14"
        stroke-linejoin="round"/>

  <line x1="400" y1="120" x2="400" y2="160" stroke="#7aa838" stroke-width="6" stroke-linecap="round"/>
  <line x1="400" y1="395" x2="400" y2="435" stroke="#7aa838" stroke-width="6" stroke-linecap="round"/>

  <g transform="translate(60, 60)" opacity="0.75">
    <path d="M 0,15 A 18,18 0 0 1 30,0" fill="none" stroke="#7aa838" stroke-width="4" stroke-linecap="round"/>
    <polyline points="26,-4 30,0 26,5" fill="none" stroke="#7aa838" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text id="slot-label" x="400" y="590"
        text-anchor="middle"
        font-family="system-ui, sans-serif"
        font-size="32" font-weight="700"
        fill="#7aa838" opacity="0.85"
        letter-spacing="4">PAGE QUALITY</text>
</svg>
