<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Spine raking-light guide (S13, landscape orientation).

  Used when the camera modal is on the Spine slot AND the device is in
  landscape orientation. The portrait orientation of this slot is blocked
  by an overlay card instructing "Rotate to landscape" — see
  cameraOpenSlot's slot-orientation logic.

  Geometry: thin horizontal trapezoid representing a comic spine viewed
  end-on at a slight perspective angle (the standard raking-light
  orientation — light source above and slightly to one side, camera shoots
  slightly down at the spine).
    viewBox 1300x600 (landscape, ~2.17 aspect)
    Top edge:    (130, 180) → (1170, 180)  — width 1040, near camera
    Bottom edge: (200, 460) → (1100, 460)  — width 900, farther from camera

  Two short vertical staple markers at 25% and 75% along the spine length
  remind the user to capture both staples in the frame.

  Slot label rendered separately as HTML overlay. Stroke width 4 px
  non-scaling for visual consistency with the front/back guides.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1300 600"
     width="100%" height="100%"
     preserveAspectRatio="xMidYMid meet">
  <!-- Trapezoid: comic spine viewed end-on with slight perspective -->
  <path d="M 130 180 L 1170 180 L 1100 460 L 200 460 Z"
        fill="none"
        stroke="#7aa838"
        stroke-width="4"
        stroke-linejoin="round"
        vector-effect="non-scaling-stroke"/>
  <!-- Staple position markers (~25% and ~75% along the spine) -->
  <line x1="390" y1="270" x2="390" y2="370"
        stroke="#7aa838"
        stroke-width="6"
        stroke-linecap="round"
        vector-effect="non-scaling-stroke"/>
  <line x1="910" y1="270" x2="910" y2="370"
        stroke="#7aa838"
        stroke-width="6"
        stroke-linecap="round"
        vector-effect="non-scaling-stroke"/>
</svg>
