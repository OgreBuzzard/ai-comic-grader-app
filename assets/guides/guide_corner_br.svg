<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Bottom-Right corner macro. Corner-point: (760, 570). Up to (760, 60). Left to (40, 570).
       Slot label placed at TOP since the L-shape's horizontal leg sits at y=570. -->
  <text id="slot-label" x="400" y="40"
        text-anchor="middle"
        font-family="system-ui, sans-serif"
        font-size="32" font-weight="700"
        fill="#7aa838" opacity="0.85"
        letter-spacing="4">BOTTOM RIGHT</text>
  <path d="M 760,60 L 760,558 Q 760,570 748,570 L 40,570"
        fill="none" stroke="#7aa838" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
