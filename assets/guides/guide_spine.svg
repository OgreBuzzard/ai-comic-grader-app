<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!--
    Spine raking-light guide. Trapezoid representing perspective at low angle:
      NEAR edge (spine being photographed) = LONG line at bottom of frame.
      FAR edge (opposite page edge) = SHORTER line in upper portion.
      The cover surface recedes upward, foreshortened.

    Resized to ~92% width target:
      Near edge: y=560, x range 32–768 (736 wide)
      Far edge:  y=170, x range 180–620 (440 wide, 60% of near)
      Vertical span: 390px (foreshortening more pronounced when scaled up)
  -->
  <polygon points="32,560 768,560 620,170 180,170"
           fill="none" stroke="#7aa838" stroke-width="6"
           stroke-linejoin="round"/>
  <!-- "SPINE" label inside near edge — bigger now to actually be readable -->
  <text x="400" y="600" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="32" font-weight="700" fill="#7aa838" opacity="0.75">SPINE</text>
</svg>
