<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Bottom-Left corner macro guide (S13 v4 — full-screen-fill rebuild).

  Mirrors the TL geometry vertically. Bend at (90, 900); vertical arm
  extends up to (90, 200), horizontal arm extends right to (510, 900).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 600 1100"
     width="100%" height="100%"
     preserveAspectRatio="xMidYMid slice">
  <path d="M 510 900 L 90 900 L 90 200"
        fill="none"
        stroke="#7aa838"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
        vector-effect="non-scaling-stroke"/>
</svg>
