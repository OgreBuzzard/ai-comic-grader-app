<style>
:root{
  --ink:#eef6e6; --green:#57b032; --green-d:#3c821f; --green-ink:#08210a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(115% 70% at 50% -6%, rgba(96,178,58,.20) 0%, rgba(96,178,58,0) 46%),
    radial-gradient(140% 100% at 50% 4%, #163024 0%, #0c1712 52%, #070d0b 100%);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; align-items:center; justify-content:center;
  padding:28px 22px;
  padding-top:max(28px,env(safe-area-inset-top)); padding-bottom:max(28px,env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.card{width:100%; max-width:400px; text-align:center}

/* combined logo + character hero */
.hero{width:100%; max-width:360px; height:auto; margin:0 auto 24px; display:block;
  filter:drop-shadow(0 16px 34px rgba(0,0,0,.55))}

/* stacked action list — every row is the SAME size (equal-width tap target),
   badges centered inside at their own undistorted proportions. */
.btns{display:flex; flex-direction:column; align-items:center; gap:12px}
.row{
  display:flex; align-items:center; justify-content:center;
  width:300px; max-width:82vw; height:58px; border-radius:13px; text-decoration:none;
}
.row:active{transform:scale(.98)}
/* web button — the fee-free path; hugs its text, white label to match the badges */
.web{
  width:auto; padding:0 30px; color:#fff;
  background:linear-gradient(180deg,var(--green),var(--green-d));
  font-size:18px; font-weight:800; letter-spacing:.2px;
  box-shadow:0 8px 22px rgba(87,176,50,.34); border:1px solid rgba(255,255,255,.16);
}
/* official store badges — real artwork, never imitations. Centered in the row. */
.badge img{display:block; width:auto}
.badge.apple img{height:44px}
.badge.play  img{height:56px} /* Google's official badge has a built-in frame; sized so its pill matches Apple's height */
.badge-txt{ /* graceful fallback only if an official badge fails to load — plain text, not a fake badge */
  color:#fff; font-size:16px; font-weight:700; text-decoration:none}

/* 1s slide-in intro */
@keyframes riseIn{ from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none} }
@media (prefers-reduced-motion:no-preference){
  .hero{opacity:0; animation:riseIn .6s cubic-bezier(.22,1,.36,1) .05s forwards}
  .web{opacity:0; animation:riseIn .55s cubic-bezier(.22,1,.36,1) .38s forwards; transition:transform .12s}
  #cta-ios{opacity:0; animation:riseIn .55s cubic-bezier(.22,1,.36,1) .53s forwards}
  #cta-android{opacity:0; animation:riseIn .55s cubic-bezier(.22,1,.36,1) .68s forwards}
}
</style>
</head>
<body>
  <main class="card">
    <img class="hero" src="/assets/Ad_Landing_Screen.webp" alt="Robograder — comic grading app">

    <nav class="btns">
      <!-- 1 · Web (fee-free path) -->
      <a class="row web" id="cta-web" href="#" data-dest="web">Open the Web App</a>

      <!-- 2 · Apple — official badge -->
      <a class="row badge apple" id="cta-ios" href="#" data-dest="ios" aria-label="Download on the App Store">
        <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
             alt="Download on the App Store"
             onerror="this.outerHTML='<span class=&quot;badge-txt&quot;>Download on the App Store</span>'">
      </a>

      <!-- 3 · Google — official badge -->
      <a class="row badge play" id="cta-android" href="#" data-dest="android" aria-label="Get it on Google Play">
        <img src="https://play.google.com/intl/en_us/badges/images/generic/en_badge_web_generic.png"
             alt="Get it on Google Play"
             onerror="this.outerHTML='<span class=&quot;badge-txt&quot;>Get it on Google Play</span>'">
      </a>
    </nav>
  </main>

<script>
/* Tracked-link engine: reads the campaign params off this page's URL and
   carries them to each destination (Play referrer / App Store ct / web utm),
   and fires a conversion event on each tap. */
var STORE = {
  ios:     "https://apps.apple.com/app/id6778625739",
  android: "https://play.google.com/store/apps/details?id=app.robograder",
  web:     "https://robograder.app"
};
(function(){
  var qs=new URLSearchParams(location.search);
  var KEYS=["utm_source","utm_medium","utm_campaign","utm_content","utm_term"];
  var utm={}; KEYS.forEach(function(k){ if(qs.get(k)) utm[k]=qs.get(k); });
  if(!utm.utm_source){ var r=(document.referrer||"").toLowerCase();
    if(r.indexOf("instagram")>-1)utm.utm_source="instagram";
    else if(r.indexOf("facebook")>-1||r.indexOf("fb.")>-1)utm.utm_source="facebook";
    else if(r.indexOf("youtu")>-1)utm.utm_source="youtube"; }
  var utmStr=KEYS.filter(function(k){return utm[k];}).map(function(k){return k+"="+encodeURIComponent(utm[k]);}).join("&");
  var source=utm.utm_source||"direct";
  var campaign=(utm.utm_campaign||"launch")+(utm.utm_content?("_"+utm.utm_content):"");
  function link(dest){
    if(dest==="android"){ var ref=encodeURIComponent(utmStr||("utm_source="+source));
      return STORE.android+(STORE.android.indexOf("?")>-1?"&":"?")+"referrer="+ref; }
    if(dest==="ios"){ return STORE.ios+"?ct="+encodeURIComponent((source+"_"+campaign).slice(0,39))+"&mt=8"; }
    return STORE.web+(utmStr?((STORE.web.indexOf("?")>-1?"&":"?")+utmStr):"");
  }
  function fire(dest){
    try{ if(window.fbq) fbq('track', dest==='web'?'Lead':'InitiateCheckout', {content_name:'get_'+dest,source:source,campaign:campaign}); }catch(e){}
    try{ if(window.gtag) gtag('event','cta_click',{destination:dest,source:source,campaign:campaign}); }catch(e){}
  }
  ["cta-web","cta-ios","cta-android"].forEach(function(id){
    var el=document.getElementById(id); if(!el)return;
    var d=el.getAttribute("data-dest");
    el.setAttribute("href",link(d));
    el.addEventListener("click",function(){ fire(d); });
  });
})();
</script>
