    }

      border: 2.5px solid #dde8f4;
      border-top-color: #2a5a8a;

    }
    .assess-step-icon.done { background: #e8f4ec; color: #2a7a4a; }

      display: none;
    }

function gradeColor(g){const n=parseFloat(g);if(n>=9.8)return"#00d4a0";if(n>=9.0)return"#4db8ff";if(n>=7.0)return"#a78bfa";if(n>=5.0)return"#f59e0b";if(n>=3.0)return"#f97316";return"#ef4444";}
function displayGrade(c,showPSA=false){
  if(c.cgcGrade) return {gradeVal:c.cgcGrade,type:"cgc-official"};
  if(c.psaGrade) return {gradeVal:c.psaGrade,type:"psa-official"};
  if(showPSA&&c.assessedPSAGrade) return {gradeVal:c.assessedPSAGrade,type:"psa-ai"};
  if(c.assessedCGCGrade) return {gradeVal:c.assessedCGCGrade,type:"cgc-ai"};
  if(c.grade) return {gradeVal:c.grade,type:"raw"};
  return {gradeVal:"—",type:"none"};
}
function gradeBadgeStyle(c,showPSA=false){
  // Legacy helper used by detail right-column official badge only
  const dg=displayGrade(c,showPSA);
  const gc=dg.type==="none"?"#4a4040":gradeColor(dg.gradeVal);
  let fill="transparent",topLabel="";
  if(dg.type==="cgc-official"){fill="#1a5fa8";topLabel="CGC";}
  else if(dg.type==="psa-official"){fill="#b91c1c";topLabel="PSA";}
  else if(dg.type==="cgc-ai"){fill="rgba(26,95,168,0.18)";}
  else if(dg.type==="psa-ai"){fill="rgba(185,28,28,0.18)";}
  else if(dg.type==="raw"){fill="#1a1a1a";}
  return {fill,topLabel,gc,gradeVal:dg.gradeVal};
}

function detectDesignation(c){
  if(c.cgcDesignation)return c.cgcDesignation;
  const h=(c.graderNotes||"")+" "+(c.notes||"")+" "+(c.cgcNotes||"");
  if(/\b(RC|restored|restoration|conserved)\b/i.test(h))return"restored";
  if(/\bqualified\b/i.test(h))return"qualified";
  return"universal";
}
function normalizeGrade(g){if(!g)return g;const gs=String(g);return gs.includes(".")?gs:parseFloat(gs).toFixed(1);}
function buildBadge(gradeVal,type,designation,sm){
  const cls=sm?"ubadge ubadge-sm":"ubadge";
  const lbl=GRADE_LABELS[gradeVal]||"";
  if(type==="cgc-official"||type==="psa-official"){
    let sc="#1a5fa8",sl=type==="psa-official"?"PSA":"CGC";
    if(designation==="restored"){sc="#7c3aed";sl="CGC";}
    else if(designation==="qualified"){sc="#166534";sl="QUALIFIED";}
    else if(type==="psa-official"){sc="#b91c1c";}
    return `<div class="${cls}" style="border-color:rgba(0,0,0,0.25)"><div class="ubadge-strip" style="background:${sc}"><span>${sl}</span></div><div class="ubadge-body" style="background:#fff"><div class="ubadge-num" style="color:#000">${gradeVal}</div><div class="ubadge-lbl" style="color:#333">${lbl}</div></div></div>`;
  }
  if(type==="cgc-ai")
    return `<div class="${cls}" style="border-color:#1e40af;background:#1a5fa8"><div class="ubadge-body" style="background:#1a5fa8"><div class="ubadge-num" style="color:#fff">${gradeVal}</div><div class="ubadge-lbl" style="color:rgba(255,255,255,0.8)">${lbl}</div></div></div>`;
  if(type==="psa-ai")
    return `<div class="${cls}" style="border-color:#991b1b;background:#b91c1c"><div class="ubadge-body" style="background:#b91c1c"><div class="ubadge-num" style="color:#fff">${gradeVal}</div><div class="ubadge-lbl" style="color:rgba(255,255,255,0.8)">${lbl}</div></div></div>`;
  // My Grade (raw/unassessed): dark badge
  return `<div class="${cls}" style="border-color:#333;background:#1a1a1a"><div class="ubadge-body" style="background:#1a1a1a"><div class="ubadge-num" style="color:#1a1614">${gradeVal}</div><div class="ubadge-lbl" style="color:#6a5a4a">${lbl}</div></div></div>`;
}
function aiCgcGrade(c){
  if(c.assessedCGCGrade)return c.assessedCGCGrade;
  if((c.myAssessment||c.aiAssessment)&&c.grade)return c.grade;
  return null;
}
// List row: exactly ONE badge, priority order
function buildListBadge(c){
  if(c.cgcGrade)return buildBadge(c.cgcGrade,"cgc-official",detectDesignation(c),true);
  if(c.psaGrade)return buildBadge(c.psaGrade,"psa-official",c.psaDesignation||"universal",true);
  const ac=aiCgcGrade(c);
  if(ac)return buildBadge(ac,"cgc-ai","",true);
  if(c.assessedPSAGrade&&c.psaNotes)return buildBadge(c.assessedPSAGrade,"psa-ai","",true);
  if(c.grade)return buildBadge(c.grade,"my","",true);
  return"";
}
// Detail view: full row of all grades
function buildGradeRowHTML(c){
  const des=detectDesignation(c);
  const badges=[];
  if(c.cgcGrade)badges.push(buildBadge(c.cgcGrade,"cgc-official",des,false));
  if(c.psaGrade)badges.push(buildBadge(c.psaGrade,"psa-official",c.psaDesignation||"universal",false));
  const ac=aiCgcGrade(c);
  if(ac)badges.push(buildBadge(normalizeGrade(ac),"cgc-ai","",false));
  if(c.assessedPSAGrade)badges.push(buildBadge(normalizeGrade(c.assessedPSAGrade),"psa-ai","",false));
  const gradeIsAiCgc=!c.assessedCGCGrade&&!!(c.myAssessment||c.aiAssessment)&&!!c.grade;
  if(c.grade&&!gradeIsAiCgc&&!c.cgcGrade&&!c.psaGrade&&!ac)badges.push(buildBadge(c.grade,"my","",false));
  if(badges.length===0)return"";
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start">${badges.join("")}</div>`;
}
function fmt$(v){return v!=null&&v>0?`$${v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`:"—";}
function totalCost(c){return[c.purchasePrice,c.taxesFeesShipping,c.gradingCost,c.cgcShipping].filter(v=>v!=null&&v>0).reduce((a,b)=>a+b,0);}
function formatDate(d){if(!d)return null;const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];const p=d.split("-");if(p.length<3)return d;const mo=parseInt(p[1],10)-1;if(isNaN(mo)||mo<0||mo>11)return d;return months[mo]+" "+p[2].replace(/^0/,"")+", "+p[0];}
function formatIssue(i){if(!i)return null;const m=i.match(/^A(\d+)$/i);if(m)return`Annual #${m[1]}`;return`#${i}`;}
function esc(s){return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"):""}

let comics=[], collapsed={}, view="list", selected=null, sortBy="title", search="", _listScrollY=0;
let db, fsCollection, fsGetDocs, fsSetDoc, fsDeleteDoc, fsDoc, fsOnSnapshot;
let seeded=false;

function syncMsg(msg){
  const bar=document.getElementById("sync-bar");
  const txt=document.getElementById("sync-msg");
  if(msg){bar.style.display="flex";txt.textContent=msg;}
  else{bar.style.display="none";}
}

async function initFirebase(){
  if(!window._firebaseReady){await new Promise(res=>window.addEventListener('firebase-ready',res,{once:true}));}
  db=window._db;fsCollection=window._fsCollection;fsGetDocs=window._fsGetDocs;
  fsSetDoc=window._fsSetDoc;fsDeleteDoc=window._fsDeleteDoc;fsDoc=window._fsDoc;
  fsOnSnapshot=window._fsOnSnapshot;
  await loadComics();
  fsOnSnapshot(fsCollection(db,"comics"),snap=>{
    comics=snap.docs.map(d=>d.data()).map(c=>({...c,pageQuality:normPageQuality(c.pageQuality)}));
    if(view==="list")renderList();
    updateStats();
  });
}

async function loadComics(){
  syncMsg("Loading collection...");
  try{
    const snap=await fsGetDocs(fsCollection(db,"comics"));
    comics=snap.docs.map(d=>d.data()).map(c=>({...c,pageQuality:normPageQuality(c.pageQuality)}));
    if(comics.length===0&&!seeded){
      seeded=true;
      syncMsg("Seeding initial data...");
      for(const c of SEED_COMICS){await fsSetDoc(fsDoc(db,"comics",c.id),c);}
      comics=[...SEED_COMICS];
    }
  }catch(e){console.error("Load error:",e);comics=[...SEED_COMICS];}
  syncMsg(null);
  renderList();
  updateStats();
}

async function saveComic(rec){
  syncMsg("Saving...");
  try{await fsSetDoc(fsDoc(db,"comics",rec.id),rec);}
  catch(e){alert("Save failed: "+e.message);}
  syncMsg(null);
}

async function deleteComic(id){
  syncMsg("Deleting...");
  try{await fsDeleteDoc(fsDoc(db,"comics",id));}
  catch(e){alert("Delete failed: "+e.message);}
  syncMsg(null);
  showList();
}

function updateStats(){
  const total=comics.length;
  const cgc=comics.filter(c=>c.cgcGrade).length;
  const psa=comics.filter(c=>c.psaGrade).length;
  const raw=comics.filter(c=>!c.cgcGrade&&!c.psaGrade).length;
  const parts=[`${total} book${total!==1?"s":""}`];
  if(cgc>0)parts.push(`${cgc} CGC`);
  if(psa>0)parts.push(`${psa} PSA`);
  if(raw>0)parts.push(`${raw} raw`);
  document.getElementById("header-stats").textContent=parts.join(" · ");
}

function showList(){
  view="list";selected=null;
  document.getElementById("add-btn").style.display="";
  renderList();
  requestAnimationFrame(()=>window.scrollTo(0,_listScrollY));
}

function renderList(){
  const main=document.getElementById("main");
  let filt=comics.filter(c=>{
    const q=search.toLowerCase();
    return!q||c.title?.toLowerCase().includes(q)||c.issue?.toLowerCase().includes(q)||c.cgcCert?.includes(q);
  });
  if(sortBy==="grade")filt.sort((a,b)=>parseFloat(b.grade)-parseFloat(a.grade));
  else if(sortBy==="title")filt.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  else if(sortBy==="cost")filt.sort((a,b)=>totalCost(b)-totalCost(a));
  else filt.sort((a,b)=>new Date(b.dateAdded)-new Date(a.dateAdded));

  const groups={};
  filt.forEach(c=>{const t=c.title||"Unknown";if(!groups[t])groups[t]=[];groups[t].push(c);});
  Object.values(groups).forEach(g=>g.sort((a,b)=>{
    // 1. Issue number ascending
    const na=parseFloat(a.issue)||0,nb=parseFloat(b.issue)||0;
    if(na!==nb)return na-nb;
    const is=a.issue||"",ibs=b.issue||"";
    if(is!==ibs)return is.localeCompare(ibs);
    // 2. Grade descending (use best available grade)
    const ga=parseFloat(a.cgcGrade||a.psaGrade||a.assessedCGCGrade||a.grade||0);
    const gb=parseFloat(b.cgcGrade||b.psaGrade||b.assessedCGCGrade||b.grade||0);
    if(gb!==ga)return gb-ga;
    // 3. Official graded above AI/raw
    const offA=!!(a.cgcGrade||a.psaGrade),offB=!!(b.cgcGrade||b.psaGrade);
    if(offA!==offB)return offA?-1:1;
    // 4. Earlier purchase date first
    const da=a.dateAcquired||"9999",db=b.dateAcquired||"9999";
    if(da!==db)return da.localeCompare(db);
    // 5. Earlier dateAdded
    return new Date(a.dateAdded)-new Date(b.dateAdded);
  }));
  const titles=Object.keys(groups).sort((a,b)=>a.localeCompare(b));

  let html=`<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <input placeholder="Search…" value="${esc(search)}" oninput="search=this.value;renderList()" style="flex:1;min-width:180px">
    <select onchange="sortBy=this.value;renderList()">
      <option value="title"${sortBy==="title"?" selected":""}>Title A–Z</option>
      <option value="grade"${sortBy==="grade"?" selected":""}>Grade ↓</option>
      <option value="dateAdded"${sortBy==="dateAdded"?" selected":""}>Date Added</option>
      <option value="cost"${sortBy==="cost"?" selected":""}>Cost ↓</option>
    </select>
  </div>`;

  if(titles.length===0){
    html+=`<div style="text-align:center;padding:80px 20px;color:#8a7a6a"><div style="font-size:40px;margin-bottom:16px">📚</div><div style="font-size:18px;color:#6a5a4a;margin-bottom:8px">No books yet</div></div>`;
  } else {
    titles.forEach(title=>{
      const isOpen=collapsed[title]===false;
      html+=`<div style="margin-bottom:16px">
        <div class="group-header" onclick="toggleGroup('${esc(title)}')">
          <span class="group-chevron${isOpen?" open":""}">›</span>
          ${esc(title)} <span style="color:#9a8a7a;letter-spacing:1px">(${groups[title].length})</span>
        </div>`;
      if(isOpen){
        html+=`<div>`;
        groups[title].forEach(c=>{
          const gc=gradeColor(c.grade);
          const thumb=c.images?.[0]?`<img class="comic-thumb" src="${c.images[0]}" loading="lazy">`:"";
          html+=`<div class="comic-row" onclick="showDetail('${esc(c.id)}')">
            ${thumb}
            ${buildListBadge(c)}
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:#1a1614;line-height:1.2">${esc(c.title)}</div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px">
                ${c.issue?`<span style="font-size:13px;color:#3a2e24">${formatIssue(c.issue)}</span>`:""}
                ${c.pageQuality?`<span style="font-size:11px;color:#8a7a6a">${esc(PQ_ABBREV[c.pageQuality]||c.pageQuality)}</span>`:""}
                ${(()=>{
                  if(!c.fmv||c.fmv<=0)return "";
                  const fmvStr="$"+c.fmv.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0});
                  if(!c.fmvDate)return `<span style="font-size:11px;color:#8a7a6a">${fmvStr}</span>`;
                  const months=(Date.now()-new Date(c.fmvDate).getTime())/(1000*60*60*24*30.5);
                  if(months<6)return `<span style="font-size:11px;color:#4a7a4a;font-weight:600">FMV ${fmvStr}</span>`;
                  if(months<12)return `<span style="font-size:11px;color:#a07820;font-weight:600" title="FMV may be outdated">FMV ~${fmvStr}</span>`;
                  const yr=new Date(c.fmvDate).getFullYear();
                  return `<span style="font-size:11px;color:#9a8a7a" title="FMV from ${yr}">FMV est. ${fmvStr}</span>`;
                })()}
              </div>
            </div>
            ${(()=>{
              // PSA secondary pip: show only when PSA differs from AI CGC by at least 0.5
              const acg=parseFloat(c.assessedCGCGrade||(((c.myAssessment||c.aiAssessment)&&c.grade)?c.grade:null)||0);
              const apsa=parseFloat(c.assessedPSAGrade||0);
              if(c.assessedPSAGrade&&c.psaNotes&&apsa&&acg&&apsa!==acg){
                const psaDisp=String(c.assessedPSAGrade).includes('.')?c.assessedPSAGrade:parseFloat(c.assessedPSAGrade).toFixed(1);
                return `<div style="align-self:flex-end;margin-bottom:2px;background:#b91c1c;border-radius:3px;padding:2px 5px;text-align:center;width:36px;height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box"><div style="font-size:11px;font-weight:800;color:#fff;line-height:1">${esc(psaDisp)}</div><div style="font-size:6px;color:rgba(255,255,255,0.75);letter-spacing:0.5px">PSA</div></div>`;
              }
              return "";
            })()}
          </div>`;
        });
        html+=`</div>`;
      }
      html+=`</div>`;
    });
  }
  main.innerHTML=html;
}

function toggleGroup(title){collapsed[title]=collapsed[title]===false?true:false;renderList();}

async function compressImage(dataUrl,maxDim=900,quality=0.50){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",quality));
    };
    img.src=dataUrl;
  });
}

function showAssessModal() {
  const steps = [
    {id:'analyzing', label:'Analyzing Photos', detail:''},
    {id:'populating', label:'Populating Info', detail:''},
    {id:'mint', label:'Comparing to Mint', detail:''},

  ];
  const stepsHTML = steps.map(st => `
    <div class="assess-step" id="step-${st.id}">
      <div class="assess-step-icon pending" id="icon-${st.id}"></div>
      <div style="flex:1">

        <h3 style="margin:0">Assessing</h3>
        <button onclick="dismissAssessModal()" style="background:none;border:none;font-size:20px;color:#8a7a6a;cursor:pointer;padding:0 0 0 8px;line-height:1" aria-label="Cancel">×</button>
      </div>

        <div class="result-grades" id="result-grades"></div>
        <div style="font-size:12px;color:#8a7a6a;text-align:center" id="result-pq"></div>
      </div>
      <button id="assess-complete-btn" onclick="completeAssessment()">Complete</button>
    </div>`;
  document.body.appendChild(overlay);
}

function setStep(id, state, detail='') {
  const icon = document.getElementById('icon-'+id);
  const det = document.getElementById('detail-'+id);
  const lbl = document.getElementById('label-'+id);
  if (!icon) return;
  icon.className = 'assess-step-icon ' + state;
  icon.textContent = state === 'done' ? '✓' : state === 'failed' ? '✗' : '';
  if (lbl) lbl.textContent = lbl.dataset.base + (state === 'running' ? '...' : '');
  if (det) det.textContent = (state !== 'running' && state !== 'skipped') ? detail : '';
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function animateStepsFromDiagnostics(d) {
  await delay(120);
  setStep('analyzing', 'done');
  await delay(180);
  setStep('populating', 'done');
  await delay(180);
  setStep('mint', d.comicvineRef ? 'done' : 'failed');
  await delay(180);
  setStep('pq', d.pageQualityRef ? 'done' : 'failed');
  await delay(180);
  setStep('confirming', d.gradeRef ? 'done' : 'failed');
}

  "Off-White to White":{"bg":"#EAE0C2","text":"#5a4e3a"},

};

function buildPQBox(pq, size='normal') {
  if (!pq) return '';
  const colors = PQ_COLORS[pq] || {bg:'#f0ece6', text:'#5a4e44'};
  const pad = size === 'small' ? '4px 10px' : '8px 16px';
  const fs = size === 'small' ? '11px' : '13px';
  const fw = '600';
  return `<div style="background:${colors.bg};color:${colors.text};padding:${pad};border-radius:8px;font-size:${fs};font-weight:${fw};letter-spacing:0.03em;display:inline-block">${pq}</div>`;
}
function showResultPreview(cgc, psa) {
  const preview = document.getElementById('assess-result-preview');
  const gradesEl = document.getElementById('result-grades');
  const pqEl = document.getElementById('result-pq');
  if (!preview) return;

  const cgcGrade = normalizeGrade(cgc.grade || '');
  const psaGrade = normalizeGrade(psa.grade || '');
  const pq = cgc.pageQuality ? normPageQuality(cgc.pageQuality) : '';

  gradesEl.innerHTML = (cgcGrade ? buildBadge(cgcGrade, 'cgc-ai', '', true) : '') +
                       (psaGrade ? buildBadge(psaGrade, 'psa-ai', '', true) : '');
  if (pq) pqEl.innerHTML = buildPQBox(pq);

  preview.style.display = 'block';
  const btn = document.getElementById('assess-complete-btn');
  if (btn) btn.style.display = 'block';
}

function completeAssessment() {
  if (!_pendingAssessResult) return;
  const {cgc, psa} = _pendingAssessResult;

  // Populate formData from held results
  formData.title=(cgc.title||formData.title||'').trim().replace(/\s+/g,' ').replace(/^The\s+/i,'');
  formData.issue=cgc.issue!=null?String(cgc.issue):formData.issue||'';
  formData.issueDate=cgc.issueDate||formData.issueDate||'';
  formData.publisher=cgc.publisher||formData.publisher||'';
  if(cgc.labelDetected&&cgc.officialCGCGrade){
    formData.cgcGrade=cgc.officialCGCGrade;
    if(cgc.officialCGCCert)formData.cgcCert=cgc.officialCGCCert;
    if(cgc.officialPageQuality)formData.pageQuality=cgc.officialPageQuality;
  }
  if(psa.labelDetected&&psa.officialPSAGrade){
    formData.psaGrade=psa.officialPSAGrade;
    if(psa.officialPSACert)formData.psaCert=psa.officialPSACert;
    if(psa.officialPageQuality&&!formData.pageQuality)formData.pageQuality=psa.officialPageQuality;
  }
  formData.assessedCGCGrade=cgc.grade||'';
  formData.assessedPSAGrade=psa.grade?(String(psa.grade).includes('.')?String(psa.grade):parseFloat(psa.grade).toFixed(1)):'';
  formData.pageQuality=cgc.pageQuality?normPageQuality(cgc.pageQuality):formData.pageQuality;
  formData.aiGraderNotes=cgc.graderNotes||'';
  formData.aiAssessment=cgc.aiAssessment||'';
  if(cgc.labelNotes&&cgc.labelNotes.trim())formData.cgcNotes=cgc.labelNotes.trim()+(formData.cgcNotes?('\n'+formData.cgcNotes):'');
  formData.psaNotes=psa.psaNotes||'';
  if(cgc.press!==undefined&&cgc.press!==null)formData.press=cgc.press;
  if(cgc.uv!==undefined&&cgc.uv!==null)formData.uv=cgc.uv;
  if(cgc.clean!==undefined&&cgc.clean!==null)formData.clean=cgc.clean;

  _assessed=true;
  _pendingAssessResult=null;
  const overlay = document.getElementById('assess-modal-overlay');
  if (overlay) overlay.remove();
  renderForm();
}

function dismissAssessModal(err) {
  const overlay = document.getElementById('assess-modal-overlay');
  if (overlay) overlay.remove();
  if (err) alert('Assessment failed: ' + err);
}

async function assessGrade(){
  const imgs=(formData.images||[]).filter(Boolean);
  if(imgs.length===0){alert("Add at least one photo first.");return;}
  if(assessing)return;
  assessing=true;
  showAssessModal();
  setStep('analyzing','running','Reading photos...');
  try{
    const compressed=await Promise.all(imgs.slice(0,4).map(img=>compressImage(img)));
    const cgcResp=await fetch("/api/assess",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({images:compressed,grader:"CGC",title:formData.title||"",issueNumber:formData.issue||"",issueDate:formData.issueDate||""})});
    if(!cgcResp.ok){const e=await cgcResp.text();throw new Error("CGC error: "+e);}
    const cgc=await cgcResp.json();
    if(cgc.error)throw new Error(cgc.error);
    const d=cgc._diagnostics||{};
    await animateStepsFromDiagnostics(d);
    setStep('psa','running','Checking variance...');
    const slabDetected=!!(cgc.labelDetected&&(cgc.officialCGCGrade||cgc.officialPSAGrade));
    const psaResp=await fetch("/api/assess",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({images:compressed,grader:"PSA",cgcGrade:cgc.grade||"",cgcGraderNotes:slabDetected?formData.graderNotes||"":"",psaGraderNotes:slabDetected?formData.psaNotes||"":""})});
    if(!psaResp.ok){const e=await psaResp.text();throw new Error("PSA error: "+e);}
    const psa=await psaResp.json();
    if(psa.error)throw new Error(psa.error);
    await delay(180);
    setStep('psa','done');
    _pendingAssessResult={cgc,psa};
    showResultPreview(cgc,psa);
  }catch(e){
    dismissAssessModal(e.message);
  }
  assessing=false;
}

      </div>

      <button id="assess-btn" class="btn btn-cgc" onclick="assessGrade()" ${(!formData.images||formData.images.filter(Boolean).length===0||assessing)?"disabled":""} style="width:100%;background:${assessing?"#1a3a5c":_assessed?"#1a4a2a":"#2a4a6a"};color:${assessing?"#a8d0f0":_assessed?"#6abf6a":"#a8d0f0"}">${assessing?"Assessing…":_assessed?"Re-assess Grade":"Assess Grade"}</button>
    </div>
    <div class="form-grid-2">
      ${tf("Title *","title","Series title")}
      ${tf("Issue #","issue","Issue number",true)}

      ${tf("Publisher","publisher","Publisher")}
    </div>
    <div class="form-grid-2">

      ${tf("CGC Cert #","cgcCert","Cert number")}

    <div class="form-grid-2">

      <input value="${esc(formData.seller||"")}" list="seller-list" oninput="formData.seller=this.value;updateSellerList(this.value)" placeholder="Name / source" autocomplete="off">

    ${formData.aiGraderNotes?`<div><label class="field-label" style="color:#4a7a9a">AI Grader Notes</label><textarea rows="4" style="font-style:italic;border-color:#1a3a5c" oninput="formData.aiGraderNotes=this.value">${esc(formData.aiGraderNotes||"")}</textarea></div>`:""}

function renderImgPreview(){}

async function assessPSA(){
  if(!formData.images||formData.images.filter(Boolean).length===0){alert("Add at least one photo first.");return;}
  if(assessing)return;
  assessing=true;
  syncMsg("Compressing images...");
  const compressed=await Promise.all(formData.images.filter(Boolean).slice(0,4).map(img=>new Promise(res=>{
    const image=new Image();
    image.onload=()=>{
      let w=image.width,h=image.height,max=900;
      if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
      const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(image,0,0,w,h);
      res(canvas.toDataURL("image/jpeg",0.50));
    };
    image.src=img;
  })));
  syncMsg("Assessing PSA Grade — please wait...");
  try{
    const resp=await fetch("/api/assess",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({images:compressed,grader:"PSA"})
    });
    if(!resp.ok){const e=await resp.text();throw new Error("Server error: "+e);}
    const parsed=await resp.json();
    if(parsed.error)throw new Error(parsed.error);
    formData.title=(parsed.title||formData.title||"").trim().replace(/\s+/g," ").replace(/^The\s+/i,"");
    formData.issue=parsed.issue!=null?String(parsed.issue):formData.issue||"";
    formData.issueDate=parsed.issueDate||formData.issueDate||"";
    formData.publisher=parsed.publisher||formData.publisher||"";
    // PSA grade goes into a separate field
    formData.psaGrade=parsed.grade||formData.psaGrade;
    formData.pageQuality=parsed.pageQuality||formData.pageQuality;
    formData.graderNotes=parsed.graderNotes||formData.graderNotes||"";
    formData.myAssessment=parsed.myAssessment||formData.myAssessment||"";
    if(parsed.press!==undefined&&parsed.press!==null)formData.press=parsed.press;
    if(parsed.uv!==undefined&&parsed.uv!==null)formData.uv=parsed.uv;
    if(parsed.clean!==undefined&&parsed.clean!==null)formData.clean=parsed.clean;
    syncMsg(null);
    renderForm();
  }catch(e){
    syncMsg(null);
    alert("PSA Assessment failed: "+e.message);
  }
  assessing=false;
}

function removeImg(i){
  const imgs=[...(formData.images||[])];
  imgs[i]=null;
  while(imgs.length&&imgs[imgs.length-1]===null)imgs.pop();
  formData.images=imgs;
  formData._imagesChanged=true;
  renderForm();
}

let _dragSrc=null;
let _tappedSlot=0;
function dragStart(e,i){_dragSrc=i;e.dataTransfer.effectAllowed="move";}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add("drag-over");}
function dragLeave(e){e.currentTarget.classList.remove("drag-over");}
function dropSlot(e,target){
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  if(_dragSrc===null||_dragSrc===target){_dragSrc=null;return;}
  const imgs=[...(formData.images||[])];
  while(imgs.length<4)imgs.push(null);
  const tmp=imgs[_dragSrc];imgs[_dragSrc]=imgs[target]||null;imgs[target]=tmp;
  while(imgs.length&&imgs[imgs.length-1]===null)imgs.pop();
  formData.images=imgs;
  formData._imagesChanged=true;
  _dragSrc=null;
  renderForm();
}

async function handleImages(e){
  const files=Array.from(e.target.files);
  if(!files.length)return;
  const newImgs=await Promise.all(files.map(f=>new Promise(res=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.readAsDataURL(f);})));
  // Place images forward from tapped slot, wrapping if needed (max 4 slots)
  const imgs=[...(formData.images||[])];
  while(imgs.length<4)imgs.push(null);
  const count=Math.min(newImgs.length,4);
  for(let n=0;n<count;n++){
    const slot=(_tappedSlot+n)%4;
    imgs[slot]=newImgs[n];
  }
  formData.images=imgs.filter(Boolean);
  formData._imagesChanged=true;
  // Reset file input so same files can be re-selected if needed
  e.target.value="";
  renderForm();
  const btn=document.getElementById("assess-btn");
  if(btn)btn.disabled=formData.images.filter(Boolean).length===0||assessing;
}

function cycleTreatment(key){
  const v=formData[key];
  formData[key]=v===null?true:v===true?false:v===false?"done":null;
  renderForm();
}
function cancelTreatment(key,e){
  e.stopPropagation();
  formData[key]=null;
  renderForm();
}

async function submitForm(){
  if(!formData.title?.trim()){alert("Title is required.");return;}
  formData.title=formData.title.trim().replace(/\s+/g," ").replace(/^The\s+/i,"");
  if(formData.seller?.trim())updateSellerList(formData.seller.trim());
  syncMsg("Compressing images...");
  const rawImages=(formData.images||[]).filter(Boolean);
  const compressedImages=rawImages.length>0&&formData._imagesChanged?await Promise.all(rawImages.map(img=>compressImage(img))):[];
  syncMsg(null);
  const existingComic=formData.id?comics.find(c=>c.id===formData.id):null;
  // Use compressed new images if user changed them, otherwise preserve Firestore images exactly
  const finalImages=formData._imagesChanged
    ?(compressedImages.length>0?compressedImages:[])
    :(formData._savedImages||existingComic?.images||[]);
  const id=formData.id||`comic:user_${Date.now()}`;
  const rec={...formData,id,
    images:finalImages,
    purchasePrice:formData.purchasePrice!==""?parseFloat(formData.purchasePrice):null,
    taxesFeesShipping:formData.taxesFeesShipping!==""?parseFloat(formData.taxesFeesShipping):null,
    gradingCost:formData.gradingCost!==""?parseFloat(formData.gradingCost):null,
    cgcShipping:formData.cgcShipping!==""?parseFloat(formData.cgcShipping):null,
    fmv:formData.fmv!==""?parseFloat(formData.fmv):null,
    fmvDate:formData.fmvDate||null,
    dateAdded:formData.dateAdded||new Date().toISOString()
  };
  delete rec._savedImages;
  delete rec._imagesChanged;
  await saveComic(rec);
  showList();
}

function cancelForm(){if(selected){showDetail(selected.id);}else{showList();}}


function normPageQuality(pq){
  if(!pq)return pq;
  const map={"OW/W":"Off-White to White","C/OW":"Cream to Off-White","OW":"Off-White","W":"White",
    "Cream to OW":"Cream to Off-White","Light Tan to OW":"Light Tan to Off-White",
    "Tan to OW":"Tan to Off-White","Dark Tan to OW":"Dark Tan to Off-White",
    "Brown to OW":"Brown to Off-White"};
  return map[pq]||pq;
}
