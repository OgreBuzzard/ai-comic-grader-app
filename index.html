function gradeColor(g){const n=parseFloat(g);if(n>=9.8)return"#00d4a0";if(n>=9.0)return"#4db8ff";if(n>=7.0)return"#a78bfa";if(n>=5.0)return"#f59e0b";if(n>=3.0)return"#f97316";return"#ef4444";}
function fmt$(v){return v!=null&&v>0?`$${v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`:"—";}
function totalCost(c){return[c.purchasePrice,c.taxesFeesShipping,c.gradingCost,c.cgcShipping].filter(v=>v!=null&&v>0).reduce((a,b)=>a+b,0);}
function formatDate(d){if(!d)return null;const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];const p=d.split("-");if(p.length<3)return d;const mo=parseInt(p[1],10)-1;if(isNaN(mo)||mo<0||mo>11)return d;return months[mo]+" "+p[2].replace(/^0/,"")+", "+p[0];}
function formatIssue(i){if(!i)return null;const m=i.match(/^A(\d+)$/i);if(m)return`Annual #${m[1]}`;return`#${i}`;}
function esc(s){return s?String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"):""}

let comics=[], collapsed={}, view="list", selected=null, sortBy="title", search="";
let db, fsCollection, fsGetDocs, fsSetDoc, fsDeleteDoc, fsDoc, fsOnSnapshot;
let seeded=false;

function syncMsg(msg){
  const bar=document.getElementById("sync-bar");
  const txt=document.getElementById("sync-msg");
  if(msg){bar.style.display="flex";txt.textContent=msg;}
  else{bar.style.display="none";}
}

async function initFirebase(){
  if(!window._firebaseReady){await new Promise(res=>window.addEventListener('firebase-ready',res,{once:true}));}
  db=window._db;fsCollection=window._fsCollection;fsGetDocs=window._fsGetDocs;
  fsSetDoc=window._fsSetDoc;fsDeleteDoc=window._fsDeleteDoc;fsDoc=window._fsDoc;
  fsOnSnapshot=window._fsOnSnapshot;
  await loadComics();
  fsOnSnapshot(fsCollection(db,"comics"),snap=>{
    comics=snap.docs.map(d=>d.data());
    if(view==="list")renderList();
    updateStats();
  });
}

async function loadComics(){
  syncMsg("Loading collection...");
  try{
    const snap=await fsGetDocs(fsCollection(db,"comics"));
    comics=snap.docs.map(d=>d.data());
    if(comics.length===0&&!seeded){
      seeded=true;
      syncMsg("Seeding initial data...");
      for(const c of SEED_COMICS){await fsSetDoc(fsDoc(db,"comics",c.id),c);}
      comics=[...SEED_COMICS];
    }
  }catch(e){console.error("Load error:",e);comics=[...SEED_COMICS];}
  syncMsg(null);
  renderList();
  updateStats();
}

async function saveComic(rec){
  syncMsg("Saving...");
  try{await fsSetDoc(fsDoc(db,"comics",rec.id),rec);}
  catch(e){alert("Save failed: "+e.message);}
  syncMsg(null);
}

async function deleteComic(id){
  syncMsg("Deleting...");
  try{await fsDeleteDoc(fsDoc(db,"comics",id));}
  catch(e){alert("Delete failed: "+e.message);}
  syncMsg(null);
  showList();
}

function updateStats(){
  const avg=comics.length?(comics.reduce((s,c)=>s+parseFloat(c.grade||0),0)/comics.length).toFixed(1):null;
  const inv=comics.reduce((s,c)=>s+totalCost(c),0);
  document.getElementById("header-stats").textContent=
    `${comics.length} books${avg?` · avg ${avg}`:""}${inv>0?` · ${fmt$(inv)} invested`:""}`;
}

function showList(){
  view="list";selected=null;
  document.getElementById("add-btn").style.display="";
  renderList();
}

function renderList(){
  const main=document.getElementById("main");
  let filt=comics.filter(c=>{
    const q=search.toLowerCase();
    return!q||c.title?.toLowerCase().includes(q)||c.issue?.toLowerCase().includes(q)||c.cgcCert?.includes(q);
  });
  if(sortBy==="grade")filt.sort((a,b)=>parseFloat(b.grade)-parseFloat(a.grade));
  else if(sortBy==="title")filt.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  else if(sortBy==="cost")filt.sort((a,b)=>totalCost(b)-totalCost(a));
  else filt.sort((a,b)=>new Date(b.dateAdded)-new Date(a.dateAdded));

  const groups={};
  filt.forEach(c=>{const t=c.title||"Unknown";if(!groups[t])groups[t]=[];groups[t].push(c);});
  Object.values(groups).forEach(g=>g.sort((a,b)=>{const na=parseFloat(a.issue)||0,nb=parseFloat(b.issue)||0;if(na!==nb)return na-nb;return(a.issue||"").localeCompare(b.issue||"");}));
  const titles=Object.keys(groups).sort((a,b)=>a.localeCompare(b));

  let html=`<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <input placeholder="Search…" value="${esc(search)}" oninput="search=this.value;renderList()" style="flex:1;min-width:180px">
    <select onchange="sortBy=this.value;renderList()">
      <option value="title"${sortBy==="title"?" selected":""}>Title A–Z</option>
      <option value="grade"${sortBy==="grade"?" selected":""}>Grade ↓</option>
      <option value="dateAdded"${sortBy==="dateAdded"?" selected":""}>Date Added</option>
      <option value="cost"${sortBy==="cost"?" selected":""}>Cost ↓</option>
    </select>
  </div>`;

  if(titles.length===0){
    html+=`<div style="text-align:center;padding:80px 20px;color:#6b5e52"><div style="font-size:40px;margin-bottom:16px">📚</div><div style="font-size:18px;color:#a09080;margin-bottom:8px">No books yet</div></div>`;
  } else {
    titles.forEach(title=>{
      const isOpen=collapsed[title]===false;
      html+=`<div style="margin-bottom:16px">
        <div class="group-header" onclick="toggleGroup('${esc(title)}')">
          <span class="group-chevron${isOpen?" open":""}">›</span>
          ${esc(title)} <span style="color:#4a4040;letter-spacing:1px">(${groups[title].length})</span>
        </div>`;
      if(isOpen){
        html+=`<div>`;
        groups[title].forEach(c=>{
          const gc=gradeColor(c.grade);
          const thumb=c.images?.[0]?`<img class="comic-thumb" src="${c.images[0]}" loading="lazy">`:"";
          const cgcBadge=c.cgcGrade?`<span class="badge badge-cgc">CGC ${esc(c.cgcGrade)}</span>`
            :(!c.cgcCert?`<span class="badge badge-raw">RAW</span>`:"");
          html+=`<div class="comic-row" onclick="showDetail('${esc(c.id)}')">
            ${thumb}
            <div class="grade-badge" style="border-color:${gc}">
              <div class="grade-num" style="color:${gc}">${esc(c.grade)}</div>
              <div class="grade-lbl" style="color:${gc}">${esc(GRADE_LABELS[c.grade]||"")}</div>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;color:#e8e0d5;line-height:1.2">${esc(c.title)}</div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px">
                ${c.issue?`<span style="font-size:13px;color:#c8b89a">${formatIssue(c.issue)}</span>`:""}
                ${cgcBadge}
              </div>
              <div class="row-meta">
                ${c.pageQuality?`<span>${esc(c.pageQuality)}</span>`:""}
                ${c.cgcCert?`<span>#${esc(c.cgcCert)}</span>`:""}
              </div>
            </div>
          </div>`;
        });
        html+=`</div>`;
      }
      html+=`</div>`;
    });
  }
  main.innerHTML=html;
}

function toggleGroup(title){collapsed[title]=collapsed[title]===false?true:false;renderList();}

function showDetail(id){
  selected=comics.find(c=>c.id===id);
  if(!selected)return;
  view="detail";
  document.getElementById("add-btn").style.display="none";
  const gc=gradeColor(selected.grade);
  const cost=totalCost(selected);
  let html=`<button class="btn-ghost" onclick="showList()" style="margin-bottom:4px">← Back</button>
  <div class="card" style="border-top:3px solid ${gc};margin-top:8px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
      <div>
        <h2 style="font-size:22px;color:#e8e0d5">${esc(selected.title)}</h2>
        ${selected.issue?`<div style="font-size:16px;color:#c8b89a;margin-top:2px">${formatIssue(selected.issue)}</div>`:""}
        <div style="font-size:13px;color:#6b5e52;margin-top:4px">${[selected.publisher,selected.issueDate].filter(Boolean).map(esc).join(" · ")}</div>
        ${selected.cgcCert?`<div style="font-size:12px;color:#4a4040;margin-top:4px">Cert #${esc(selected.cgcCert)}</div>`:""}
        ${selected.seller?`<div style="font-size:12px;color:#6b5e52;margin-top:4px">Purchased from: ${esc(selected.seller)}</div>`:""}
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-size:40px;font-weight:700;color:${gc};line-height:1">${esc(selected.grade)}</div>
        <div style="font-size:13px;color:${gc};opacity:0.8">${esc(GRADE_LABELS[selected.grade]||"")}</div>
        ${selected.cgcGrade?`<div style="font-size:11px;color:#6abf6a;margin-top:4px">CGC ${esc(selected.cgcGrade)} · Universal</div>`:`<div style="font-size:11px;color:#a09040;margin-top:4px">Raw / Unslabbed</div>`}
      </div>
    </div>`;

  if(selected.images?.length>0){
    html+=`<div style="margin-top:20px"><div class="section-label">Images</div>
      <img class="detail-cover" src="${selected.images[0]}" onclick="openLightbox('${selected.id}',0)">`;
    if(selected.images.length>1){
      html+=`<div class="thumb-row">`;
      selected.images.slice(1).forEach((img,i)=>{html+=`<img src="${img}" onclick="openLightbox('${selected.id}',${i+1})">`;});
      html+=`</div>`;
    }
    html+=`</div>`;
  }

  html+=`<div class="divider"></div>
  <div class="grid-2">
    ${selected.pageQuality?`<div><div class="section-label">Page Quality</div><div class="field-val">${esc(selected.pageQuality)}</div></div>`:""}
    ${selected.slabbingDate?`<div><div class="section-label">Date Graded</div><div class="field-val">${esc(selected.slabbingDate)}</div></div>`:""}
    ${selected.dateAcquired?`<div><div class="section-label">Date Acquired</div><div class="field-val">${formatDate(selected.dateAcquired)}</div></div>`:""}
  </div>`;

  const treatments=[["Press",selected.press],["UV",selected.uv],["Clean",selected.clean]].filter(([,v])=>v!==null&&v!==undefined);
  if(treatments.length>0){
    html+=`<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">`;
    treatments.forEach(([label,val])=>{
      html+=`<div style="padding:4px 10px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:1px;background:${val?"#1a2a10":"#2a1a10"};border:1px solid ${val?"#4a7a20":"#5a2a10"};color:${val?"#8abf40":"#bf6040"}">${label}: ${val?"Y":"N"}</div>`;
    });
    html+=`</div>`;
  }

  html+=`<div class="divider"></div>
  <div class="section-label" style="color:#6a8a6a">Cost Breakdown</div>
  <div class="grid-2" style="margin-top:10px">
    <div><div class="section-label">Purchase Price</div><div class="field-val">${fmt$(selected.purchasePrice)}</div></div>
    <div><div class="section-label">Taxes/Fees/Ship</div><div class="field-val">${fmt$(selected.taxesFeesShipping)}</div></div>
    <div><div class="section-label">Grading Cost</div><div class="field-val">${fmt$(selected.gradingCost)}</div></div>
    <div><div class="section-label">CGC Shipping</div><div class="field-val">${fmt$(selected.cgcShipping)}</div></div>
  </div>`;

  if(cost>0||selected.fmv){
    html+=`<div style="display:flex;gap:16px;align-items:center;margin-top:12px;flex-wrap:wrap">`;
    if(cost>0)html+=`<div style="padding:8px 12px;background:#0d0d0f;border:1px solid #2a3a2a;border-radius:4px"><span style="font-size:11px;color:#6a8a6a;letter-spacing:2px;text-transform:uppercase">Total Cost </span><span style="font-size:16px;font-weight:700;color:#8abf8a;margin-left:8px">${fmt$(cost)}</span></div>`;
    if(selected.fmv)html+=`<div style="padding:8px 12px;background:#0d0d0f;border:1px solid #2a1a3a;border-radius:4px;display:flex;gap:10px;align-items:center"><span style="font-size:11px;color:#8a6abf;letter-spacing:2px;text-transform:uppercase">FMV</span><span style="font-size:16px;font-weight:700;color:#a078df">${fmt$(selected.fmv)}</span>${selected.fmvDate?`<span style="font-size:11px;color:#6b5e72">as of ${esc(selected.fmvDate)}</span>`:""}</div>`;
    html+=`</div>`;
  }

  if(selected.cgcNotes)html+=`<div style="margin-top:20px"><div class="section-label" style="color:#4a7a4a">CGC Label Notes</div><div class="notes-box" style="border-color:#1a3a1a;color:#80b080">${esc(selected.cgcNotes)}</div></div>`;
  if(selected.graderNotes)html+=`<div style="margin-top:20px"><div class="section-label">Grader Notes</div><div class="notes-box">${esc(selected.graderNotes)}</div></div>`;
  if(selected.myAssessment)html+=`<div style="margin-top:20px"><div class="section-label">My Assessment</div><div class="notes-box" style="font-style:normal;color:#a09080">${esc(selected.myAssessment)}</div></div>`;
  if(selected.notes)html+=`<div style="margin-top:20px"><div class="section-label">Notes</div><div style="font-size:13px;color:#a09080;line-height:1.7">${esc(selected.notes)}</div></div>`;

  html+=`<div style="display:flex;gap:10px;margin-top:24px">
    <button class="btn btn-gold" onclick="showEdit('${esc(selected.id)}')">Edit</button>
    <button class="btn btn-dark" id="del-btn" onclick="confirmDelete('${esc(selected.id)}')">Delete</button>
  </div></div>`;

  document.getElementById("main").innerHTML=html;
}

function confirmDelete(id){
  const btn=document.getElementById("del-btn");
  if(btn.dataset.confirm==="1"){deleteComic(id);}
  else{btn.dataset.confirm="1";btn.textContent="Tap again to confirm";btn.style.background="#ef4444";btn.style.color="#fff";}
}

function openLightbox(id,idx){
  const c=comics.find(x=>x.id===id);
  if(!c||!c.images?.[idx])return;
  document.getElementById("lightbox-img").src=c.images[idx];
  document.getElementById("lightbox").style.display="flex";
}

const EMPTY={title:"",issue:"",issueDate:"",publisher:"",grade:"",cgcGrade:"",cgcCert:"",pageQuality:"",graderNotes:"",cgcNotes:"",myAssessment:"",notes:"",slabbingDate:"",dateAcquired:"",purchasePrice:"",taxesFeesShipping:"",gradingCost:"",cgcShipping:"",fmv:"",fmvDate:"",press:null,uv:null,clean:null,seller:"",images:[]};
let formData={...EMPTY};
let assessing=false;

function showAdd(){formData={...EMPTY};view="add";document.getElementById("add-btn").style.display="none";renderForm();}

function showEdit(id){
  const c=comics.find(x=>x.id===id);
  if(!c)return;
  formData={...EMPTY,...c,
    purchasePrice:c.purchasePrice!=null?String(c.purchasePrice):"",
    taxesFeesShipping:c.taxesFeesShipping!=null?String(c.taxesFeesShipping):"",
    gradingCost:c.gradingCost!=null?String(c.gradingCost):"",
    cgcShipping:c.cgcShipping!=null?String(c.cgcShipping):"",
    fmv:c.fmv!=null?String(c.fmv):"",
    fmvDate:c.fmvDate||""
  };
  view="add";document.getElementById("add-btn").style.display="none";renderForm();
}

async function assessBook(){
  if(!formData.images||formData.images.length===0){alert("Add at least one photo first.");return;}
  if(assessing)return;
  assessing=true;
  syncMsg("Compressing images...");

  // Compress images before sending
  const compressed=await Promise.all(formData.images.slice(0,6).map(img=>new Promise(res=>{
    const image=new Image();
    image.onload=()=>{
      let w=image.width,h=image.height,max=1200;
      if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
      const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
      canvas.getContext("2d").drawImage(image,0,0,w,h);
      res(canvas.toDataURL("image/jpeg",0.8));
    };
    image.src=img;
  })));

  syncMsg("Assessing with Claude — please wait...");
  try{
    const resp=await fetch("/api/assess",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({images:compressed})
    });
    if(!resp.ok){const e=await resp.text();throw new Error("Server error: "+e);}
    const parsed=await resp.json();
    if(parsed.error)throw new Error(parsed.error);

    formData.title=parsed.title||formData.title||"";
    formData.issue=parsed.issue!=null?String(parsed.issue):formData.issue||"";
    formData.issueDate=parsed.issueDate||formData.issueDate||"";
    formData.publisher=parsed.publisher||formData.publisher||"";
    formData.grade=parsed.grade||formData.grade;
    formData.pageQuality=parsed.pageQuality||formData.pageQuality;
    formData.graderNotes=parsed.graderNotes||formData.graderNotes||"";
    formData.myAssessment=parsed.myAssessment||formData.myAssessment||"";
    if(parsed.press!==undefined&&parsed.press!==null)formData.press=parsed.press;
    if(parsed.uv!==undefined&&parsed.uv!==null)formData.uv=parsed.uv;
    if(parsed.clean!==undefined&&parsed.clean!==null)formData.clean=parsed.clean;

    syncMsg(null);
    renderForm();
  }catch(e){
    syncMsg(null);
    alert("Assessment failed: "+e.message);
  }
  assessing=false;
}

function renderForm(){
  const isEdit=!!formData.id;
  function tf(label,field,ph=""){
    return`<div><label class="field-label">${label}</label><input value="${esc(formData[field]||"")}" oninput="formData['${field}']=this.value" placeholder="${ph}"></div>`;
  }
  function treatBtn(key,label){
    const v=formData[key];
    const bg=v===true?"#1a2a10":v===false?"#2a1a10":"#1a1a1a";
    const bc=v===true?"#4a7a20":v===false?"#5a2a10":"#3a3a3a";
    const col=v===true?"#8abf40":v===false?"#bf6040":"#6b6b6b";
    const txt=v===true?"Y":v===false?"N":"—";
    return`<button class="treatment-btn" style="background:${bg};border-color:${bc};color:${col}" onclick="cycleTreatment('${key}')">${label}: ${txt}</button>`;
  }

  let html=`<button class="btn-ghost" onclick="cancelForm()" style="margin-bottom:4px">← Back</button>
  <h2 style="font-size:18px;margin:16px 0 20px;color:#c8a96e">${isEdit?"Edit Book":"Add Book"}</h2>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div>
      <label class="field-label">Photos</label>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <label class="btn btn-dark" style="cursor:pointer;display:inline-block">
          Choose Photos
          <input type="file" accept="image/*" multiple onchange="handleImages(event)" style="display:none">
        </label>
      </div>
      <div id="img-preview" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"></div>
      <button id="assess-btn" class="btn btn-purple" onclick="assessBook()" ${(!formData.images||formData.images.length===0||assessing)?"disabled":""} style="width:100%">🔍 ${assessing?"Assessing...":"Assess Book"}</button>
    </div>
    <div class="form-grid-2">
      ${tf("Title *","title","Series title")}
      ${tf("Issue #","issue","Issue number")}
      ${tf("Issue Date","issueDate","Cover date")}
      ${tf("Publisher","publisher","Publisher")}
    </div>
    <div class="form-grid-2">
      <div><label class="field-label">My Grade</label><select onchange="formData.grade=this.value">
        <option value="">— select grade —</option>
        ${GRADES.map(g=>`<option value="${g}"${formData.grade===g?" selected":""}>${g} — ${GRADE_LABELS[g]}</option>`).join("")}
      </select></div>
      <div><label class="field-label">Page Quality</label><select onchange="formData.pageQuality=this.value">
        <option value="">— select pages —</option>
        ${PAGE_QUALITIES.map(q=>`<option value="${q}"${formData.pageQuality===q?" selected":""}>${q}</option>`).join("")}
      </select></div>
    </div>
    <div class="form-grid-2">
      ${tf("CGC Grade","cgcGrade","CGC grade if slabbed")}
      ${tf("CGC Cert #","cgcCert","Cert number")}
    </div>
    ${tf("Seller","seller","Name / source")}
    <div class="form-grid-2">
      ${tf("Date Acquired","dateAcquired","YYYY-MM-DD")}
      ${tf("Date Graded","slabbingDate","YYYY-MM-DD")}
    </div>
    <div class="cost-box">
      <div style="font-size:11px;color:#6a8a6a;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">Cost Breakdown</div>
      <div class="form-grid-2">
        ${tf("Purchase Price ($)","purchasePrice","0.00")}
        ${tf("Taxes / Fees / Shipping ($)","taxesFeesShipping","0.00")}
        ${tf("Grading / Pressing ($)","gradingCost","0.00")}
        ${tf("CGC Return Shipping ($)","cgcShipping","0.00")}
      </div>
    </div>
    <div class="form-grid-2">
      ${tf("Fair Market Value ($)","fmv","0.00")}
      ${tf("FMV Date","fmvDate","YYYY-MM")}
    </div>
    <div>
      <label class="field-label">Treatment Candidates</label>
      <div style="display:flex;gap:10px">
        ${treatBtn("press","Press")}
        ${treatBtn("uv","UV")}
        ${treatBtn("clean","Clean")}
      </div>
      <div style="font-size:10px;color:#4a4040;margin-top:4px">Tap to cycle: — → Y → N</div>
    </div>
    <div><label class="field-label">CGC Label Notes</label><textarea rows="2" oninput="formData.cgcNotes=this.value">${esc(formData.cgcNotes||"")}</textarea></div>
    <div><label class="field-label">Grader Notes</label><textarea rows="3" style="font-style:italic" oninput="formData.graderNotes=this.value">${esc(formData.graderNotes||"")}</textarea></div>
    <div><label class="field-label">My Assessment</label><textarea rows="3" oninput="formData.myAssessment=this.value">${esc(formData.myAssessment||"")}</textarea></div>
    <div><label class="field-label">Personal Notes</label><textarea rows="2" oninput="formData.notes=this.value">${esc(formData.notes||"")}</textarea></div>
    <div style="display:flex;gap:10px;padding-top:4px">
      <button class="btn btn-gold" onclick="submitForm()">${isEdit?"Save Changes":"Add to Collection"}</button>
      <button class="btn btn-dark" onclick="cancelForm()">Cancel</button>
    </div>
  </div>`;

  document.getElementById("main").innerHTML=html;
  renderImgPreview();
}

function renderImgPreview(){
  const el=document.getElementById("img-preview");
  if(!el)return;
  el.innerHTML=(formData.images||[]).map((img,i)=>
    `<div style="position:relative">
      <img src="${img}" style="width:60px;height:84px;object-fit:cover;border-radius:3px;border:1px solid #2a2420">
      <button onclick="removeImg(${i})" style="position:absolute;top:-6px;right:-6px;background:#ef4444;border:none;border-radius:50%;width:18px;height:18px;cursor:pointer;color:#fff;font-size:11px;padding:0;display:flex;align-items:center;justify-content:center">×</button>
    </div>`
  ).join("");
}

function removeImg(i){formData.images=formData.images.filter((_,j)=>j!==i);renderImgPreview();renderForm();}

async function handleImages(e){
  const files=Array.from(e.target.files);
  if(!files.length)return;
  const imgs=await Promise.all(files.map(f=>new Promise(res=>{const r=new FileReader();r.onload=ev=>res(ev.target.result);r.readAsDataURL(f);})));
  formData.images=[...(formData.images||[]),...imgs];
  renderForm();
  // Ensure button state is correct after async load
  const assessBtn=document.getElementById("assess-btn");
  if(assessBtn){assessBtn.disabled=formData.images.length===0||assessing;}
}

function cycleTreatment(key){
  const v=formData[key];formData[key]=v===null?true:v===true?false:null;renderForm();
}

async function submitForm(){
  if(!formData.title?.trim()){alert("Title is required.");return;}
  const id=formData.id||`comic:user_${Date.now()}`;
  const rec={...formData,id,
    purchasePrice:formData.purchasePrice!==""?parseFloat(formData.purchasePrice):null,
    taxesFeesShipping:formData.taxesFeesShipping!==""?parseFloat(formData.taxesFeesShipping):null,
    gradingCost:formData.gradingCost!==""?parseFloat(formData.gradingCost):null,
    cgcShipping:formData.cgcShipping!==""?parseFloat(formData.cgcShipping):null,
    fmv:formData.fmv!==""?parseFloat(formData.fmv):null,
    fmvDate:formData.fmvDate||null,
    dateAdded:formData.dateAdded||new Date().toISOString()
  };
  await saveComic(rec);
  showList();
}

function cancelForm(){if(selected){showDetail(selected.id);}else{showList();}}

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
initFirebase();
</script>
</body>
</html>
